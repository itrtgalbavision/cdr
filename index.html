<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Radios Guatemala</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00e5ff;
            --primary-dark: #00bfff;
            --accent: #ff3366;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        *{box-sizing:border-box;}
        body{
            margin:0; font-family:'Poppins',sans-serif;
            background: radial-gradient(circle at top, #162431 0%, #0b1118 100%);
            color:white; min-height: 100vh;
        }
        .header { text-align: center; padding: 40px 20px; }
        .badge-en-vivo {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255, 51, 102, 0.1); border: 1px solid rgba(255, 51, 102, 0.2);
            padding: 6px 16px; border-radius: 30px; font-size: 11px; font-weight: 700;
            color: var(--accent); margin-bottom: 20px; text-transform: uppercase;
        }
        .punto-rojo {
            width: 8px; height: 8px; background-color: var(--accent); border-radius: 50%;
            box-shadow: 0 0 10px var(--accent); animation: latido 1.5s infinite;
        }
        @keyframes latido { 0% { transform: scale(0.9); opacity: 1; } 70% { transform: scale(1.5); opacity: 0; } 100% { transform: scale(0.9); opacity: 0; } }
        .header h1 { margin: 0; font-size: 32px; font-weight: 800; }
        .header h1 span {
            display: block; font-size: 40px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .contenedor {
            width: 90%; max-width: 1200px; margin: 0 auto 140px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;
        }
        .radio {
            background: var(--glass); border-radius: 20px; padding: 25px 15px; cursor: pointer;
            transition: 0.3s; border: 1px solid var(--glass-border);
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        .radio:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.08); border-color: var(--primary); }
        .radio.activa { border: 2px solid var(--primary); background: rgba(0, 229, 255, 0.05); }
        .radio img { width: auto; max-width: 100px; height: 60px; object-fit: contain; margin-bottom: 12px; }
        .radio span { font-size: 14px; font-weight: 500; color: #efefef; }
        .player {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(15, 24, 34, 0.95); backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass-border); padding: 15px 30px;
            display: flex; align-items: center; justify-content: space-between; z-index: 1000;
        }
        .player-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        #playerLogo { width: 45px; height: 45px; border-radius: 8px; background: white; padding: 4px; object-fit: contain; }
        #playerLogo[src=""], #playerLogo:not([src]) { display: none; }
        .player-title { font-size: 14px; font-weight: 600; }
        .controls { display: flex; align-items: center; gap: 20px; }
        button {
            background: var(--primary); border: none; padding: 10px 20px; border-radius: 50px;
            cursor: pointer; font-weight: 700; font-size: 12px; transition: 0.2s;
            color: #000; font-weight: 600;
        }
        button:hover { background: white; transform: scale(1.05); }
        button.loading { opacity: 0.6; cursor: not-allowed; }
        .status-indicator {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            margin-right: 8px; background: #ff3366;
        }
        .status-indicator.playing { background: #00ff00; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .volume { width: 100px; accent-color: var(--primary); }
        @media(max-width: 600px) {
            .player { padding: 15px; } 
            .volume { display: none; }
            .player-title { font-size: 12px; max-width: 140px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        }
    </style>
</head>
<body>
    
    <div class="header">
        <div class="badge-en-vivo"><span class="punto-rojo"></span> EN VIVO</div>
        <h1>CENTRAL DE RADIOS <span>GUATEMALA</span></h1>
    </div>

    <div class="contenedor">
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/c2cce928-c69c-45d5-bd0a-5a5eba167a0d/ts:abr.m3u8','Xtrema 101.3 FM','xtrema.png')">
            <img src="xtrema.png"> <span>Xtrema 101.3 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/406d6243-a8fc-4215-aca0-ffd43aac2bf3/ts:abr.m3u8','Galaxia 88.5 FM','galaxia.png')">
            <img src="galaxia.png"> <span>Galaxia 88.5 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/67aeb080-68fa-4197-89f6-c8bb70f9a395/ts:abr.m3u8','Tropicálida 104.9 FM','tropicalida.png')">
            <img src="tropicalida.png"> <span>Tropicálida 104.9 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/ca11fca0-0da4-4198-83bd-b50e5607d6f8/ts:abr.m3u8','Éxitos 90.9','exitos.png')">
            <img src="exitos.png"> <span>Éxitos 90.9</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/e33ed625-2624-4334-a625-a53a70d95791/ts:abr.m3u8','Joya 92.9 FM','joya.png')">
            <img src="joya.png"> <span>Joya 92.9 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/3943e598-9843-4784-9388-80e97aa3674b/ts:abr.m3u8','Alfa 97.3 FM','alfa.png')">
            <img src="alfa.png"> <span>Alfa 97.3 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/a4e3175d-fa7e-4d4b-979f-e7f875468260/ts:abr.m3u8','Ranchera 95.7 FM','ranchera.png')">
            <img src="ranchera.png"> <span>Ranchera 95.7 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/53ee315d-206f-4271-994b-4c1927ae338b/ts:abr.m3u8','La Marca 94.1 FM','lamarca.png')">
            <img src="lamarca.png"> <span>La Marca 94.1 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/9c2d6264-2009-49a8-a501-848a7bae1051/ts:abr.m3u8','Fiesta 103.7 FM','fiesta.png')">
            <img src="fiesta.png"> <span>Fiesta 103.7 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/8e7a8a5b-a2db-4323-8397-46c17f4573ac/ts:abr.m3u8','Sonora 96.9 FM','sonora.png')">
            <img src="sonora.png"> <span>Sonora 96.9 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/ef0c82f1-e446-4093-8455-3a144ca2e171/ts:abr.m3u8','Éxitos Xela 107.1 FM','exitosx.png')">
            <img src="exitosx.png"> <span>Éxitos Xela 107.1 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/c2af032e-3e29-4551-a757-e4f3d349386c/ts:abr.m3u8','Flix Xela 93.9','fixx.png')">
            <img src="fixx.png"> <span>Flix Xela 93.9</span>
        </div>
    </div>

    <div class="player">
        <div class="player-info">
            <span class="status-indicator" id="statusIndicator"></span>
            <img id="playerLogo">
            <div class="player-title" id="playerTitle">Selecciona una radio</div>
        </div>
        <div class="controls">
            <button id="playBtn" onclick="togglePlay()">▶ Play</button>
            <input class="volume" type="range" min="0" max="1" step="0.01" value="1.0" onchange="setVolume(this.value)">
        </div>
    </div>

    <audio id="audio" crossorigin="anonymous" playsinline controlsList="nodownload"></audio>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>

    <script>
        let audio = document.getElementById("audio");
        let title = document.getElementById("playerTitle");
        let logo = document.getElementById("playerLogo");
        let playBtn = document.getElementById("playBtn");
        let statusIndicator = document.getElementById("statusIndicator");
        let hlsInstancia = null;
        let currentRadio = null;
        let isLoadingManifest = false;

        // Configuración optimizada para HLS.js
        const hlsConfig = {
            debug: false,
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 90, // Aumentado para mejor estabilidad en móvil
            maxBufferLength: 30,
            maxMaxBufferLength: 600, // Máximo buffer en caso de conexión lenta
            maxBackBufferLength: 90,
            fragLoadingTimeOut: 20000, // 20 segundos timeout
            fragLoadingMaxRetry: 6, // Reintentos agresivos
            levelLoadingTimeOut: 10000,
            levelLoadingMaxRetry: 4,
            manifestLoadingTimeOut: 10000,
            manifestLoadingMaxRetry: 3,
            startFragPrefetching: true,
            initialLiveManifestSize: 1,
            testBitrate: false, // Desactiva test de bitrate que causa cortes
            progressive: false,
            autoStartLoad: false, // Control manual de carga
            startLevel: -1, // Auto-selección de calidad
            emeEnabled: false,
            cmcdUserAgent: true,
        };

        // Función para reproducir radio
        function playRadio(el, url, name, img) {
            // Si ya está reproduciendo la misma radio, solo play/pause
            if (currentRadio === url && hlsInstancia) {
                togglePlay();
                return;
            }

            // Actualizar UI
            document.querySelectorAll(".radio").forEach(r => r.classList.remove("activa"));
            el.classList.add("activa");
            title.innerText = name;
            logo.src = img;
            logo.style.display = "block";
            currentRadio = url;

            // Marcar como cargando
            isLoadingManifest = true;
            playBtn.classList.add("loading");
            playBtn.textContent = "⏳ Cargando...";
            updateStatus(false);

            // Destruir instancia anterior
            if (hlsInstancia) {
                try {
                    hlsInstancia.destroy();
                } catch(e) {
                    console.error("Error destruyendo HLS anterior:", e);
                }
                hlsInstancia = null;
            }

            // Pausar y limpiar audio
            audio.pause();
            audio.currentTime = 0;
            audio.src = "";

            // Pequeño delay para asegurar limpieza
            setTimeout(() => {
                cargarRadio(url, name);
            }, 100);
        }

        function cargarRadio(url, name) {
            try {
                if (Hls.isSupported()) {
                    hlsInstancia = new Hls(hlsConfig);
                    
                    // Evento: Manifest cargado
                    hlsInstancia.on(Hls.Events.MANIFEST_PARSED, function() {
                        isLoadingManifest = false;
                        playBtn.classList.remove("loading");
                        playBtn.textContent = "⏸ Pause";
                        console.log(`Manifest parsed para ${name}`);
                        
                        // Reproducir automáticamente
                        let playPromise = audio.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(err => {
                                console.error("Error al reproducir:", err);
                                playBtn.textContent = "▶ Play";
                            });
                        }
                    });

                    // Evento: Error fatal
                    hlsInstancia.on(Hls.Events.ERROR, function(event, data) {
                        console.error("HLS Error:", data);
                        
                        if (data.fatal) {
                            isLoadingManifest = false;
                            playBtn.classList.remove("loading");
                            
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    console.log("Error de red, intentando fallback...");
                                    intentarFallback(url);
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    console.log("Error de media, recargando...");
                                    hlsInstancia.recoverMediaError();
                                    break;
                                default:
                                    console.log("Error fatal, usando fallback directo");
                                    intentarFallback(url);
                            }
                        }
                    });

                    // Eventos de estado
                    audio.addEventListener("play", () => updateStatus(true));
                    audio.addEventListener("pause", () => updateStatus(false));
                    audio.addEventListener("loadstart", () => {
                        if (!isLoadingManifest) updateStatus(false);
                    });
                    audio.addEventListener("stalled", () => {
                        console.log("Audio stalled, reintentando...");
                        audio.load();
                    });

                    hlsInstancia.loadSource(url);
                    hlsInstancia.attachMedia(audio);
                    hlsInstancia.startLoad();

                } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                    // Soporte nativo iOS
                    console.log("Usando soporte nativo HLS (iOS)");
                    audio.src = url;
                    
                    audio.addEventListener("canplay", function onCanPlay() {
                        isLoadingManifest = false;
                        playBtn.classList.remove("loading");
                        playBtn.textContent = "⏸ Pause";
                        audio.removeEventListener("canplay", onCanPlay);
                        audio.play().catch(err => console.error("Error iOS:", err));
                    }, { once: true });

                    audio.load();
                }
            } catch(err) {
                console.error("Error cargando radio:", err);
                isLoadingManifest = false;
                playBtn.classList.remove("loading");
                intentarFallback(url);
            }
        }

        function intentarFallback(url) {
            console.log("Intento fallback directo sin HLS.js");
            try {
                if (hlsInstancia) hlsInstancia.destroy();
                hlsInstancia = null;
                
                audio.src = url;
                audio.load();
                
                let playPromise = audio.play();
                if (playPromise) {
                    playPromise.then(() => {
                        isLoadingManifest = false;
                        playBtn.classList.remove("loading");
                        playBtn.textContent = "⏸ Pause";
                    }).catch(err => {
                        console.error("Error fallback:", err);
                        playBtn.textContent = "✗ Error";
                        playBtn.classList.remove("loading");
                    });
                }
            } catch(err) {
                console.error("Fallback también falló:", err);
                playBtn.textContent = "✗ Error";
                playBtn.classList.remove("loading");
            }
        }

        function togglePlay() {
            if (!audio.src) {
                console.log("Sin fuente de audio");
                return;
            }
            
            if (audio.paused) {
                audio.play().catch(err => console.error("Error play:", err));
            } else {
                audio.pause();
            }
        }

        function setVolume(v) {
            audio.volume = parseFloat(v);
        }

        function updateStatus(playing) {
            if (playing) {
                statusIndicator.classList.add("playing");
                playBtn.textContent = "⏸ Pause";
                updateStatus(true);
            } else {
                statusIndicator.classList.remove("playing");
                if (!isLoadingManifest) {
                    playBtn.textContent = "▶ Play";
                }
            }
        }

        // Manejo de cambio de pestaña/app
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                console.log("App en background");
            } else {
                console.log("App activa, verificando reproducción");
                if (audio.paused && currentRadio) {
                    audio.play().catch(err => console.error("Error al reanudar:", err));
                }
            }
        });

        // Cleanup al cerrar
        window.addEventListener("beforeunload", function() {
            if (hlsInstancia) {
                hlsInstancia.destroy();
            }
        });
    </script>
</body>
</html>
