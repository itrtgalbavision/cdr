<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Radios Guatemala</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00e5ff;
            --primary-dark: #00bfff;
            --bg-dark: #0b1118;
            --accent: #ff3366;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; outline: none; }
        
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #0b1118 0%, #121c27 40%, #0b1118 100%);
            color: white;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* --- HEADER --- */
        .header {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
        }

        .badge-en-vivo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.2);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .punto-rojo {
            width: 8px; height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: latido 1.5s infinite;
        }

        @keyframes latido {
            0% { transform: scale(0.95); opacity: 1; }
            70% { transform: scale(1.6); opacity: 0; }
            100% { transform: scale(0.95); opacity: 0; }
        }

        .header h1 {
            margin: 0;
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 800;
            line-height: 1.1;
        }

        .header h1 span {
            display: block;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 10px rgba(0, 229, 255, 0.2));
        }

        /* --- GRID RADIOS --- */
        .contenedor {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .radio {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .radio:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .radio.activa {
            background: rgba(0, 229, 255, 0.1);
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }

        .radio img {
            width: 100px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            transition: 0.3s;
        }

        .radio:hover img { transform: scale(1.1); }

        .radio span {
            font-size: 14px;
            font-weight: 500;
            color: #e0e0e0;
        }

        /* Ondas de sonido animadas */
        .waves {
            display: none;
            align-items: flex-end;
            gap: 3px;
            height: 15px;
            margin-top: 10px;
        }
        .radio.activa .waves { display: flex; }
        .bar {
            width: 3px; height: 100%;
            background: var(--primary);
            border-radius: 3px;
            animation: bounce 0.6s infinite alternate;
        }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            from { height: 3px; }
            to { height: 15px; }
        }

        /* --- PLAYER BAR --- */
        .player {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            background: rgba(15, 24, 34, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
        }

        .player-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        #playerLogo {
            width: 45px; height: 45px;
            border-radius: 8px;
            object-fit: contain;
            background: white;
            padding: 3px;
            display: none;
        }

        .player-title { font-size: 14px; font-weight: 600; }

        .controls { display: flex; align-items: center; gap: 20px; }

        .btn-play {
            width: 50px; height: 50px;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .btn-play:hover { transform: scale(1.1); background: white; }
        .btn-play svg { width: 24px; fill: black; }

        .volume-box { display: flex; align-items: center; gap: 10px; }
        .volume-box input {
            accent-color: var(--primary);
            width: 100px;
            cursor: pointer;
        }

        /* --- RESPONSIVO --- */
        @media(max-width: 600px) {
            .player { padding: 10px 15px; }
            .volume-box { display: none; }
            .player-title { font-size: 12px; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .contenedor { grid-template-columns: repeat(2, 1fr); gap: 12px; width: 95%; }
            .header { padding: 40px 15px 20px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge-en-vivo">
            <span class="punto-rojo"></span> Transmisión en Vivo
        </div>
        <h1>CENTRAL DE RADIOS <span>GUATEMALA</span></h1>
    </div>

    <div class="contenedor">
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/c2cce928-c69c-45d5-bd0a-5a5eba167a0d/ts:abr.m3u8','Xtrema 101.3 FM','xtrema.png')">
            <img src="xtrema.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>Xtrema 101.3 FM</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>

        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/406d6243-a8fc-4215-aca0-ffd43aac2bf3/ts:abr.m3u8','Galaxia 88.5 FM','galaxia.png')">
            <img src="galaxia.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>Galaxia 88.5 FM</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>

        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/67aeb080-68fa-4197-89f6-c8bb70f9a395/ts:abr.m3u8','Tropicálida 104.9 FM','tropicalida.png')">
            <img src="tropicalida.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>Tropicálida 104.9 FM</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>

        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/ca11fca0-0da4-4198-83bd-b50e5607d6f8/ts:abr.m3u8','Éxitos 90.9','exitos.png')">
            <img src="exitos.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>Éxitos 90.9</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>

        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/e33ed625-2624-4334-a625-a53a70d95791/ts:abr.m3u8','Joya 92.9 FM','joya.png')">
            <img src="joya.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>Joya 92.9 FM</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>

        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/3943e598-9843-4784-9388-80e97aa3674b/ts:abr.m3u8','Alfa 97.3 FM','alfa.png')">
            <img src="alfa.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>Alfa 97.3 FM</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>

        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/a4e3175d-fa7e-4d4b-979f-e7f875468260/ts:abr.m3u8','Ranchera 95.7 FM','ranchera.png')">
            <img src="ranchera.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>Ranchera 95.7 FM</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>

        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/53ee315d-206f-4271-994b-4c1927ae338b/ts:abr.m3u8','La Marca 94.1 FM','lamarca.png')">
            <img src="lamarca.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>La Marca 94.1 FM</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>

        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/9c2d6264-2009-49a8-a501-848a7bae1051/ts:abr.m3u8','Fiesta 103.7 FM','fiesta.png')">
            <img src="fiesta.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>Fiesta 103.7 FM</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>

        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/8e7a8a5b-a2db-4323-8397-46c17f4573ac/ts:abr.m3u8','Sonora 96.9 FM','sonora.png')">
            <img src="sonora.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>Sonora 96.9 FM</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>

        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/ef0c82f1-e446-4093-8455-3a144ca2e171/ts:abr.m3u8','Éxitos Xela 107.1 FM','exitosx.png')">
            <img src="exitosx.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>Éxitos Xela 107.1 FM</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>

        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/c2af032e-3e29-4551-a757-e4f3d349386c/ts:abr.m3u8','Flix Xela 93.9','fixx.png')">
            <img src="fixx.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>Flix Xela 93.9</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>
    </div>

    <div class="player">
        <div class="player-info">
            <img id="playerLogo" src="" alt="logo">
            <div class="player-title" id="playerTitle">Selecciona una emisora</div>
        </div>
        <div class="controls">
            <div class="volume-box">
                <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M14 5v14l-4.5-4.5H6V9.5h3.5L14 5zm3 7c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                <input type="range" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
            </div>
            <button class="btn-play" onclick="togglePlay()">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>
    </div>

    <audio id="audio" playsinline></audio>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const audio = document.getElementById("audio");
        const title = document.getElementById("playerTitle");
        const logo = document.getElementById("playerLogo");
        const playIcon = document.getElementById("playIcon");
        let hlsInstancia = null;

        function playRadio(el, url, name, img) {
            // UI
            document.querySelectorAll(".radio").forEach(r => r.classList.remove("activa"));
            el.classList.add("activa");
            
            title.innerText = name;
            logo.src = img;
            logo.style.display = "block";
            
            // Si la imagen del reproductor falla, usar icono genérico
            logo.onerror = () => logo.src = 'https://cdn-icons-png.flaticon.com/512/27/27184.png';

            // Reproducción
            if (Hls.isSupported()) {
                if (hlsInstancia) hlsInstancia.destroy();
                hlsInstancia = new Hls({
                    maxBufferLength: 15,
                    liveSyncDurationCount: 3
                });
                hlsInstancia.loadSource(url);
                hlsInstancia.attachMedia(audio);
                hlsInstancia.on(Hls.Events.MANIFEST_PARSED, () => {
                    audio.play();
                    updateIcon(false);
                });
            } else {
                audio.src = url;
                audio.play();
                updateIcon(false);
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                updateIcon(false);
            } else {
                audio.pause();
                updateIcon(true);
            }
        }

        function updateIcon(isPaused) {
            playIcon.innerHTML = isPaused ? 
                '<path d="M8 5v14l11-7z"/>' : 
                '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }

        function setVolume(v) {
            audio.volume = v;
        }
    </script>
</body>
</html>
