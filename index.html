<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Radios Guatemala</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00e5ff;
            --primary-dark: #00bfff;
            --bg-dark: #0b1118;
            --accent: #ff3366;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        *{box-sizing:border-box; outline: none;}
        
        body {
            margin:0;
            font-family:'Poppins',sans-serif;
            background:linear-gradient(180deg,#0b1118,#121c27 40%,#0b1118);
            color:white;
            min-height: 100vh;
        }

        /* --- HEADER --- */
        .header {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
        }
        .badge-en-vivo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 20px;
        }
        .punto-rojo {
            width: 8px; height: 8px;
            background-color: #ff3366;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3366;
            animation: latido 1.5s infinite;
        }
        @keyframes latido {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(255, 51, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); }
        }
        .header h1 { margin: 0; font-size: 36px; font-weight: 800; }
        .header h1 span {
            display: block;
            font-size: 44px;
            background: linear-gradient(90deg, #00e5ff, #00bfff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- GRID --- */
        .contenedor {
            width: 90%; max-width: 1200px; 
            margin: 20px auto 120px;
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 22px;
        }

        .radio {
            background: var(--glass);
            border-radius: 16px; padding: 25px 15px;
            cursor: pointer; transition: .3s; 
            border: 1px solid var(--glass-border);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            position: relative;
        }
        .radio:hover { transform: translateY(-6px); background: rgba(255,255,255,0.1); }
        .radio.activa { border: 2px solid var(--primary); box-shadow: 0 0 18px rgba(0,229,255,.3); }

        .radio img {
            width: 100px; height: 60px; object-fit: contain;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.3));
        }

        /* Ondas animadas */
        .waves {
            display: none; gap: 3px; height: 15px; margin-top: 10px;
        }
        .radio.activa .waves { display: flex; align-items: flex-end; }
        .bar { width: 3px; background: var(--primary); animation: bounce 0.5s infinite alternate; }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { from { height: 3px; } to { height: 15px; } }

        /* --- PLAYER --- */
        .player {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #0f1822; border-top: 1px solid rgba(255,255,255,.1);
            padding: 15px 30px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 1000;
        }
        .player-info { display: flex; align-items: center; gap: 15px; }
        .player-info img { 
            width: 50px; height: 50px; object-fit: contain; 
            background: white; border-radius: 8px; padding: 4px;
            display: none;
        }
        .player-title { font-size: 15px; font-weight: 500; }
        
        .controls { display: flex; align-items: center; gap: 20px; }
        .btn-play {
            background: var(--primary); border: none; width: 45px; height: 45px;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-play svg { fill: #000; width: 20px; }
        .volume { width: 110px; accent-color: var(--primary); cursor: pointer; }

        @media(max-width: 600px) {
            .contenedor { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .player { padding: 10px; }
            .volume { display: none; }
            .player-title { font-size: 13px; max-width: 140px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        }
    </style>
</head>
<body>

            <img src="galaxia.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">

        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/ca11fca0-0da4-4198-83bd-b50e5607d6f8/ts:abr.m3u8','Éxitos 90.9','exitos.png')">

            <img src="alfa.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">

        </div>

            <img src="ranchera.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>Ranchera 95.7 FM</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/53ee315d-206f-4271-994b-4c1927ae338b/ts:abr.m3u8','La Marca 94.1 FM','lamarca.png')">
            <img src="lamarca.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>La Marca 94.1 FM</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/9c2d6264-2009-49a8-a501-848a7bae1051/ts:abr.m3u8','Fiesta 103.7 FM','fiesta.png')">
            <img src="fiesta.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>Fiesta 103.7 FM</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>

            <img src="sonora.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">
            <span>Sonora 96.9 FM</span>
            <div class="waves"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/ef0c82f1-e446-4093-8455-3a144ca2e171/ts:abr.m3u8','Éxitos Xela 107.1 FM','exitosx.png')">
            <img src="exitosx.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">

        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/c2af032e-3e29-4551-a757-e4f3d349386c/ts:abr.m3u8','Flix Xela 93.9','fixx.png')">
            <img src="fixx.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/27/27184.png'">

    </div>

    <div class="player">
        <div class="player-info">
            <img id="playerLogo" src="">
            <div class="player-title" id="playerTitle">Selecciona una radio</div>
        </div>
        <div class="controls">
            <input class="volume" type="range" min="0" max="1" step="0.01" value="1.0" onchange="setVolume(this.value)">
            <button class="btn-play" onclick="togglePlay()">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>
    </div>

    <audio id="audio" playsinline preload="auto"></audio>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        let audio = document.getElementById("audio");
        let title = document.getElementById("playerTitle");
        let logo = document.getElementById("playerLogo");
        let playIcon = document.getElementById("playIcon");
        let hlsInstancia = null;

        const esMovil = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        function playRadio(el, url, name, img) {
            // UI
            document.querySelectorAll(".radio").forEach(r => r.classList.remove("activa"));
            el.classList.add("activa");
            title.innerText = name;
            logo.src = img;
            logo.style.display = "block";
            logo.onerror = () => logo.src = 'https://cdn-icons-png.flaticon.com/512/27/27184.png';

            // Lógica original funcional
            if (Hls.isSupported()) {
                if (hlsInstancia) { hlsInstancia.destroy(); }
                hlsInstancia = new Hls();
                hlsInstancia.loadSource(url);
                hlsInstancia.attachMedia(audio);
                hlsInstancia.on(Hls.Events.MANIFEST_PARSED, function() {
                    audio.play();
                    updateIcon(false);
                });
            } else {
                audio.src = url;
                audio.play();
                updateIcon(false);
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                updateIcon(false);
            } else {
                audio.pause();
                updateIcon(true);
            }
        }

        function updateIcon(pausado) {
            if (pausado) {
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            } else {
                playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            }
        }

        function setVolume(v) { audio.volume = v; }
    </script>
</body>
</html>
