<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Radios Guatemala — Directo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
<style>
:root {
  --bg-deep: #06090e;
  --bg-surface: #0e141d;
  --bg-surface-hover: #151d2a;
  --bg-card: rgba(14, 20, 29, 0.7);
  
  --border: rgba(255, 255, 255, 0.06);
  --border-strong: rgba(255, 255, 255, 0.12);
  
  --accent-cyan: #00d9ff;
  --accent-cyan-glow: rgba(0, 217, 255, 0.25);
  --accent-red: #ff3355;
  --accent-gold: #ffb700;

  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #475569;

  --radius-xl: 18px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;

  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --backdrop: blur(20px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100vh; background: var(--bg-deep); }

body {
  font-family: var(--font-sans);
  color: var(--text-primary);
  background-image: 
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 217, 255, 0.08), transparent),
    radial-gradient(circle at 100% 100%, rgba(255, 51, 85, 0.03), transparent 40%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input { font-family: inherit; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 40px 20px 170px; }

/* HEADER */
.site-header { text-align: center; margin-bottom: 36px; }

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.22em;
  color: #ff99aa;
  background: rgba(255, 51, 85, 0.1);
  border: 1px solid rgba(255, 51, 85, 0.25);
  padding: 5px 14px;
  border-radius: 100px;
  margin-bottom: 16px;
  text-transform: uppercase;
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-red);
  box-shadow: 0 0 8px var(--accent-red);
  animation: pulseDot 1.4s ease-in-out infinite;
}

@keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } }

.site-title {
  font-size: clamp(28px, 4.5vw, 48px);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -0.03em;
  text-transform: uppercase;
}

.site-title .thin { color: var(--text-muted); font-weight: 700; display: block; font-size: 0.55em; letter-spacing: 0.08em; }
.site-title .grad {
  background: linear-gradient(135deg, #ffffff 30%, var(--accent-cyan) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.site-subtitle { margin-top: 8px; color: var(--text-secondary); font-size: 14px; font-weight: 500; }

/* CONTROLES BARRA */
.controls-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  padding: 8px;
  border-radius: var(--radius-lg);
}

.search-wrap {
  position: relative;
  flex: 1 1 280px;
}

.search-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  width: 16px;
  height: 16px;
}

.search-input {
  width: 100%;
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid var(--border);
  color: var(--text-primary);
  border-radius: var(--radius-md);
  padding: 10px 14px 10px 40px;
  font-size: 13px;
  outline: none;
  transition: all 0.2s;
}

.search-input:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 12px var(--accent-cyan-glow);
}

.view-controls { display: flex; gap: 6px; align-items: center; }

.view-btn, .fav-toggle {
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.02);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: var(--radius-md);
  transition: all 0.2s;
}

.view-btn:hover, .fav-toggle:hover { background: var(--bg-surface-hover); color: #fff; }

.view-btn.active {
  border-color: var(--accent-cyan);
  background: rgba(0, 217, 255, 0.08);
  color: var(--accent-cyan);
}

.fav-toggle.on {
  border-color: var(--accent-gold);
  background: rgba(255, 183, 0, 0.08);
  color: var(--accent-gold);
}

.list-meta { color: var(--text-muted); font-size: 12px; font-weight: 600; margin: 0 0 16px 4px; text-transform: uppercase; letter-spacing: 0.05em; }

/* EMISORAS GRID */
.stations-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }

.station-card {
  background: var(--bg-card);
  backdrop-filter: var(--backdrop);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  height: 125px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
}

.station-card:hover {
  background: var(--bg-surface-hover);
  border-color: var(--border-strong);
  transform: translateY(-2px);
}

.station-card.active {
  border-color: var(--accent-cyan);
  background: rgba(0, 217, 255, 0.05);
  box-shadow: 0 0 20px var(--accent-cyan-glow);
}

.card-logo-wrap {
  width: 100%;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}

.card-logo-wrap img {
  max-width: 70%;
  max-height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
}

.card-name { font-size: 13px; font-weight: 700; color: var(--text-primary); text-align: center; }
.card-freq { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-top: 1px; }

.card-fav-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 24px;
  height: 24px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  color: var(--text-muted);
  transition: all 0.2s;
}

.card-fav-btn:hover, .card-fav-btn.is-fav { color: var(--accent-gold); }

/* VISTA LISTA Y COMPACTA */
.stations-list { display: flex; flex-direction: column; gap: 8px; }
.list-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-card);
  backdrop-filter: var(--backdrop);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px 14px;
  transition: all 0.2s;
  cursor: pointer;
}
.list-row:hover { background: var(--bg-surface-hover); border-color: var(--border-strong); }
.list-row.active { border-color: var(--accent-cyan); background: rgba(0, 217, 255, 0.04); }

.list-logo { width: 36px; height: 28px; display: grid; place-items: center; flex-shrink: 0; }
.list-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }

.list-info { flex: 1; }
.list-name { font-weight: 700; font-size: 13.5px; }
.list-freq { font-size: 11px; color: var(--text-secondary); }
.list-actions { display: flex; align-items: center; gap: 8px; }
.list-play { width: 30px; height: 30px; border-radius: 50%; background: rgba(0, 217, 255, 0.1); color: var(--accent-cyan); display: grid; place-items: center; font-size: 11px; }

.stations-compact { display: flex; flex-wrap: wrap; gap: 8px; }
.compact-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 6px 12px 6px 8px;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 12px;
  font-weight: 600;
}
.compact-pill:hover { border-color: var(--border-strong); background: var(--bg-surface-hover); }
.compact-pill.active { border-color: var(--accent-cyan); color: var(--accent-cyan); }
.compact-pill img { width: 18px; height: 18px; object-fit: contain; }

/* REPRODUCTOR BARRA CONSOLA PRO */
.player-bar {
  position: fixed;
  left: 12px; right: 12px; bottom: 12px;
  max-width: 1176px;
  margin: 0 auto;
  background: rgba(10, 15, 23, 0.92);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-xl);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255,255,255,0.2);
  z-index: 100;
  overflow: hidden;
}

.player-bar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: transparent;
  transition: background 0.3s;
}

.player-bar.playing::before {
  background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
}

.player-inner {
  padding: 12px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
}

.player-left { display: flex; align-items: center; gap: 14px; min-width: 0; }

.player-logo {
  width: 42px;
  height: 42px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  padding: 4px;
}
.player-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }

.player-meta { min-width: 0; }
.player-station { font-weight: 800; font-size: 14.5px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.player-live { font-size: 11px; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; gap: 8px; margin-top: 3px; letter-spacing: 0.05em; }

.p-live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted); }
.player-bar.playing .p-live-dot { background: var(--accent-red); box-shadow: 0 0 6px var(--accent-red); animation: pulseDot 1.4s infinite; }

/* NUEVAS ONDAS MUSICALES MEJORADAS */
.visualizer {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 18px;
  padding: 2px 6px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 6px;
}

.vbar {
  width: 3px;
  height: 3px;
  background: var(--text-muted);
  border-radius: 2px;
  transition: all 0.2s ease;
}

.player-bar.playing .vbar {
  background: linear-gradient(180deg, #00ffff, var(--accent-cyan));
  box-shadow: 0 0 6px var(--accent-cyan-glow);
}

.player-bar.playing .vbar:nth-child(1) { animation: waveAnim 0.7s infinite alternate ease-in-out 0.05s; }
.player-bar.playing .vbar:nth-child(2) { animation: waveAnim 0.5s infinite alternate ease-in-out 0.20s; }
.player-bar.playing .vbar:nth-child(3) { animation: waveAnim 0.9s infinite alternate ease-in-out 0.10s; }
.player-bar.playing .vbar:nth-child(4) { animation: waveAnim 0.6s infinite alternate ease-in-out 0.30s; }
.player-bar.playing .vbar:nth-child(5) { animation: waveAnim 0.8s infinite alternate ease-in-out 0.15s; }
.player-bar.playing .vbar:nth-child(6) { animation: waveAnim 0.5s infinite alternate ease-in-out 0.25s; }
.player-bar.playing .vbar:nth-child(7) { animation: waveAnim 0.7s infinite alternate ease-in-out 0.00s; }
.player-bar.playing .vbar:nth-child(8) { animation: waveAnim 0.6s infinite alternate ease-in-out 0.35s; }

@keyframes waveAnim {
  0% { height: 3px; opacity: 0.4; }
  100% { height: 16px; opacity: 1; }
}

/* CONTROLES CENTRADOS */
.player-center { display: flex; align-items: center; gap: 10px; justify-content: center; }

.ctrl-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  color: var(--text-primary);
  transition: all 0.2s;
}
.ctrl-btn:hover { background: var(--bg-surface-hover); border-color: var(--border-strong); transform: scale(1.05); }

.ctrl-btn.play {
  width: 46px; height: 46px;
  background: var(--text-primary);
  color: #000;
  border: none;
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
}
.ctrl-btn.play:hover { transform: scale(1.06); background: #fff; }
.player-bar.playing .ctrl-btn.play { background: var(--accent-cyan); box-shadow: 0 0 20px var(--accent-cyan-glow); }

.player-right { display: flex; align-items: center; gap: 12px; justify-content: flex-end; }
.vol-wrap { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }

input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; width: 85px; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--text-primary);
  margin-top: -3.5px;
  transition: background 0.2s;
}
.player-bar.playing input[type=range]::-webkit-slider-thumb { background: var(--accent-cyan); }

.toast {
  position: fixed;
  bottom: 85px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: #0f172a;
  border: 1px solid var(--border-strong);
  color: #fff;
  padding: 8px 16px;
  border-radius: 100px;
  font-size: 12px; font-weight: 600;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  z-index: 120; opacity: 0; pointer-events: none;
  transition: all 0.2s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.empty-state {
  background: var(--bg-card);
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
  padding: 40px 20px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 13px;
}

.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

@media (max-width: 768px) {
  .controls-bar { flex-direction: column; align-items: stretch; }
  .view-controls { justify-content: space-between; }
  .player-inner { grid-template-columns: 1fr auto; }
  .player-right { display: none; }
  .wrap { padding-bottom: 150px; }
  .player-bar { left: 8px; right: 8px; bottom: 8px; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="site-header">
    <div class="live-badge"><span class="live-dot" aria-hidden="true"></span> EN EMISIÓN</div>
    <h1 class="site-title">
      <span class="thin">CENTRAL DE RADIOS</span>
      <span class="grad">GUATEMALA</span>
    </h1>
    <p class="site-subtitle">Plataforma oficial de streaming radial</p>
  </header>

  <div class="controls-bar" role="region" aria-label="Controles de listado">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input id="searchInput" class="search-input" type="search" placeholder="Buscar emisora o dial..." autocomplete="off" />
    </div>
    <div class="view-controls" id="viewControls" role="tablist" aria-label="Vista">
      <button class="view-btn active" data-view="grid" role="tab" aria-selected="true">Grid</button>
      <button class="view-btn" data-view="list" role="tab" aria-selected="false">Lista</button>
      <button class="view-btn" data-view="compact" role="tab" aria-selected="false">Compacto</button>
      <button class="fav-toggle" id="favToggle" aria-pressed="false">★ Favoritas</button>
    </div>
  </div>

  <div class="list-meta" id="listMeta"></div>
  <main id="stationsContainer" aria-live="polite"></main>
</div>

<!-- REPRODUCTOR BARRA CON SOLA PRO -->
<div class="player-bar" id="playerBar" role="region" aria-label="Reproductor">
  <div class="player-inner">
    <div class="player-left">
      <div class="player-logo" id="playerLogoWrap">
        <img id="playerLogo" alt="Logo emisora" />
      </div>
      <div class="player-meta">
        <div class="player-station" id="playerStationName">Selecciona una emisora</div>
        <div class="player-live">
          <span class="p-live-dot" aria-hidden="true"></span>
          <span id="playerLiveText">En espera</span>
          <div class="visualizer" aria-hidden="true">
            <div class="vbar"></div><div class="vbar"></div><div class="vbar"></div><div class="vbar"></div>
            <div class="vbar"></div><div class="vbar"></div><div class="vbar"></div><div class="vbar"></div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="player-center">
      <button class="ctrl-btn" id="prevBtn" aria-label="Anterior">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play" id="playPauseBtn" aria-label="Reproducir / Pausar">
        <svg id="playIcon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" aria-label="Siguiente">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="player-right">
      <div class="vol-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        <label class="sr-only" for="volumeRange">Volumen</label>
        <input type="range" id="volumeRange" min="0" max="1" step="0.01" value="1.0" />
      </div>
    </div>
  </div>
  <audio id="audioEl" preload="metadata" playsinline></audio>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const CDN_NUEVO = "https://d2b5h5wyivfnfl.cloudfront.net";
const CDN_VIEJO = "https://d2qsan2ut81n2k.cloudfront.net";
const SONORA_CUSTOM = "https://d1iowt63cq06qa.cloudfront.net/medialist_14854753276708185244_hls.m3u8";

const stations = [
  { name: "Xtrema", freq: "101.3 FM", file: "xtrema.png", id: "c2cce928-c69c-45d5-bd0a-5a5eba167a0d" },
  { name: "Galaxia", freq: "88.5 FM", file: "galaxia.png", id: "406d6243-a8fc-4215-aca0-ffd43aac2bf3" },
  { name: "Tropicálida", freq: "104.9 FM", file: "tropicalida.png", id: "67aeb080-68fa-4197-89f6-c8bb70f9a395" },
  { name: "Éxitos", freq: "90.9 FM", file: "exitos.png", id: "ca11fca0-0da4-4198-83bd-b50e5607d6f8" },
  { name: "Joya", freq: "92.9 FM", file: "joya.png", id: "e33ed625-2624-4334-a625-a53a70d95791" },
  { name: "Alfa", freq: "97.3 FM", file: "alfa.png", id: "3943e598-9843-4784-9388-80e97aa3674b" },
  { name: "Ranchera", freq: "95.7 FM", file: "ranchera.png", id: "a4e3175d-fa7e-4d4b-979f-e7f875468260" },
  { name: "La Marca", freq: "94.1 FM", file: "lamarca.png", id: "53ee315d-206f-4271-994b-4c1927ae338b" },
  { name: "Fiesta", freq: "103.7 FM", file: "fiesta.png", id: "9c2d6264-2009-49a8-a501-848a7bae1051" },
  { name: "Sonora", freq: "96.9 FM", file: "sonora.png", id: "8e7a8a5b-a2db-4323-8397-46c17f4573ac", customUrl: SONORA_CUSTOM },
  { name: "Éxitos Xela", freq: "107.1 FM", file: "exitosx.png", id: "ef0c82f1-e446-4093-8455-3a144ca2e171" },
  { name: "Flix Xela", freq: "93.9 FM", file: "fixx.png", id: "c2af032e-3e29-4551-a757-e4f3d349386c" }
].map(s => {
  if(s.customUrl){
    return {...s, urls: [
      s.customUrl,
      `${CDN_NUEVO}/live/${s.id}/ts:abr.m3u8`,
      `${CDN_VIEJO}/live/${s.id}/ts:abr.m3u8`
    ]};
  }
  return {...s, urls: [
    `${CDN_NUEVO}/live/${s.id}/ts:abr.m3u8`,
    `${CDN_VIEJO}/live/${s.id}/ts:abr.m3u8`
  ]};
});

let currentIndex = -1;
let isPlaying = false;
let viewMode = localStorage.getItem('crg_view') || 'grid';
let showFavoritesOnly = false;
let favorites = JSON.parse(localStorage.getItem('crg_favs') || '[]');
let hlsInstance = null;

const audio = document.getElementById('audioEl');
const playerBar = document.getElementById('playerBar');
const playerStationName = document.getElementById('playerStationName');
const playerLogo = document.getElementById('playerLogo');
const playerLiveText = document.getElementById('playerLiveText');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const container = document.getElementById('stationsContainer');
const searchInput = document.getElementById('searchInput');
const listMeta = document.getElementById('listMeta');

audio.removeAttribute('crossorigin');
audio.crossOrigin = null;

function svgFallback(name){
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='140' height='90' viewBox='0 0 140 90'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='#0e141d'/><stop offset='100%' stop-color='#151d2a'/></linearGradient></defs><rect width='140' height='90' rx='10' fill='url(#g)'/><text x='50%' y='50%' fill='#00d9ff' font-family='sans-serif' font-size='13' font-weight='800' text-anchor='middle' dominant-baseline='middle'>${name}</text></svg>`
  );
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2100);
}

function isFav(i){ return favorites.includes(i); }
function toggleFav(i, e){
  if(e) e.stopPropagation();
  const pos = favorites.indexOf(i);
  if(pos > -1){ favorites.splice(pos,1); showToast('Eliminada de favoritas'); }
  else { favorites.push(i); showToast('Añadida a favoritas'); }
  localStorage.setItem('crg_favs', JSON.stringify(favorites));
  render();
}

function getFilteredStations(){
  const q = searchInput.value.trim().toLowerCase();
  return stations.map((s, i)=>({...s, _i:i}))
   .filter(s=>{
      const matches = !q || (s.name.toLowerCase().includes(q) || s.freq.toLowerCase().includes(q));
      const favOk = !showFavoritesOnly || isFav(s._i);
      return matches && favOk;
    });
}

function render(){
  const list = getFilteredStations();
  listMeta.textContent = `${list.length} emisora${list.length!==1?'s':''}${showFavoritesOnly? ' • Favoritas' : ''}`;
  if(list.length === 0){
    container.innerHTML = `<div class="empty-state">Sin emisoras coincidentes.</div>`;
    return;
  }
  if(viewMode === 'grid'){
    container.innerHTML = `<div class="stations-grid" id="gridWrap"></div>`;
    const grid = document.getElementById('gridWrap');
    list.forEach(s=>{
      const el = document.createElement('div');
      el.className = 'station-card' + (s._i === currentIndex? ' active' : '');
      el.innerHTML = `
        <button class="card-fav-btn ${isFav(s._i)?'is-fav':''}" aria-label="Favorito" data-fav="${s._i}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="${isFav(s._i)?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 17.3l-6.18 3.25 1.18-6.88L2 8.93l6.91-1L12 1.5l3.09 6.43 6.91 1-5 4.74 1.18 6.88z"/></svg>
        </button>
        <div class="card-logo-wrap"><img src="${s.file}" alt="${s.name}" loading="lazy" onerror="this.onerror=null;this.src='${svgFallback(s.name)}'"></div>
        <div class="card-name">${s.name}</div>
        <div class="card-freq">${s.freq}</div>`;
      el.addEventListener('click', ()=> playStation(s._i));
      el.querySelector('[data-fav]').addEventListener('click', (e)=> toggleFav(s._i, e));
      grid.appendChild(el);
    });
  } else if(viewMode === 'list'){
    container.innerHTML = `<div class="stations-list" id="listWrap"></div>`;
    const wrap = document.getElementById('listWrap');
    list.forEach(s=>{
      const row = document.createElement('div');
      row.className = 'list-row' + (s._i === currentIndex? ' active' : '');
      row.innerHTML = `
        <div class="list-logo"><img src="${s.file}" alt="${s.name}" loading="lazy" onerror="this.onerror=null;this.src='${svgFallback(s.name)}'"></div>
        <div class="list-info"><div class="list-name">${s.name}</div><div class="list-freq">${s.freq}</div></div>
        <div class="list-actions">
          <button class="card-fav-btn ${isFav(s._i)?'is-fav':''}" data-fav="${s._i}" style="position:static">★</button>
          <button class="list-play">${s._i === currentIndex && isPlaying ? '❚❚' : '▶'}</button>
        </div>`;
      row.addEventListener('click', (e)=>{ if(!e.target.closest('[data-fav]')) playStation(s._i); });
      row.querySelector('.list-play').addEventListener('click', (e)=>{ e.stopPropagation(); playStation(s._i); });
      row.querySelector('[data-fav]').addEventListener('click', (e)=> toggleFav(s._i, e));
      wrap.appendChild(row);
    });
  } else {
    container.innerHTML = `<div class="stations-compact" id="compactWrap"></div>`;
    const wrap = document.getElementById('compactWrap');
    list.forEach(s=>{
      const pill = document.createElement('button');
      pill.className = 'compact-pill' + (s._i === currentIndex? ' active' : '');
      pill.innerHTML = `<img src="${s.file}" alt="" onerror="this.onerror=null;this.src='${svgFallback(s.name)}'"><span>${s.name} <small style="opacity:0.5;margin-left:2px">${s.freq}</small></span><span class="pill-fav ${isFav(s._i)?'is-fav':''}">★</span>`;
      pill.addEventListener('click', ()=> playStation(s._i));
      wrap.appendChild(pill);
    });
  }
}

function playStation(index, urlTry = 0){
  if(index < 0 || index >= stations.length) return;
  const st = stations[index];
  const url = st.urls[urlTry];
  if(!url){ showToast("Sin conexión con el origen"); playerLiveText.textContent = "Error de señal"; return; }

  currentIndex = index;
  playerStationName.textContent = `${st.name} — ${st.freq}`;
  playerLogo.src = st.file;
  playerLogo.alt = st.name;
  playerLogo.onerror = function(){ this.onerror=null; this.src = svgFallback(st.name); };
  playerLiveText.textContent = "Conectando…";
  render();

  if (hlsInstance) { try{ hlsInstance.destroy(); }catch(e){} hlsInstance = null; }
  audio.pause();
  audio.removeAttribute('crossorigin');
  audio.crossOrigin = null;

  const tryNextUrl = () => {
    if(urlTry + 1 < st.urls.length){ playStation(index, urlTry + 1); }
    else { playerLiveText.textContent = "Error de señal"; showToast("Error de conexión con " + st.name); }
  };

  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  if(isIOS || audio.canPlayType('application/vnd.apple.mpegurl')){
    audio.src = url;
    audio.load();
    audio.play().catch(()=>{});
    return;
  }

  if (window.Hls && Hls.isSupported()) {
    hlsInstance = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      maxBufferLength: isMobile ? 30 : 15,
      maxMaxBufferLength: 60,
      maxBufferSize: 30 * 1000 * 1000,
      maxBufferHole: isMobile ? 1.5 : 0.5,
      liveSyncDurationCount: isMobile ? 5 : 3,
      liveMaxLatencyDurationCount: 20,
      manifestLoadingTimeOut: 20000,
      manifestLoadingMaxRetry: 4,
      fragLoadingTimeOut: 20000,
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 1000,
      xhrSetup: xhr => { xhr.withCredentials = false; }
    });
    hlsInstance.loadSource(url);
    hlsInstance.attachMedia(audio);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => { audio.play().catch(()=>{}); });
    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
      if(!data.fatal) return;
      if(data.type === Hls.ErrorTypes.NETWORK_ERROR){ hlsInstance.startLoad(); return; }
      if(data.type === Hls.ErrorTypes.MEDIA_ERROR){ hlsInstance.recoverMediaError(); return; }
      try{ hlsInstance.destroy(); }catch(e){}
      hlsInstance = null;
      tryNextUrl();
    });
    return;
  }

  audio.src = url;
  audio.load();
  audio.play().catch(()=>{});

  if('mediaSession' in navigator){
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: st.name,
        artist: 'Central de Radios Guatemala',
        album: st.freq
      });
    }catch(e){}
  }
}

function togglePlay(){
  if(currentIndex === -1){ playStation(0); return; }
  if(audio.paused){ audio.play().catch(()=>{}); } else { audio.pause(); }
}
function nextStation(){ if(currentIndex === -1){ playStation(0); return; } playStation((currentIndex + 1) % stations.length); }
function prevStation(){ if(currentIndex === -1){ playStation(0); return; } playStation((currentIndex - 1 + stations.length) % stations.length); }
function setVolume(v){ audio.volume = v; document.getElementById('volumeRange').value = v; localStorage.setItem('crg_vol', v); }

audio.addEventListener('play', ()=>{ isPlaying = true; playerBar.classList.add('playing'); playIcon.classList.add('hidden'); pauseIcon.classList.remove('hidden'); playerLiveText.textContent = "EN VIVO"; render(); });
audio.addEventListener('pause', ()=>{ isPlaying = false; playerBar.classList.remove('playing'); pauseIcon.classList.add('hidden'); playIcon.classList.remove('hidden'); playerLiveText.textContent = currentIndex >= 0? "Pausado" : "En espera"; render(); });
audio.addEventListener('waiting', ()=>{ playerLiveText.textContent = "Cargando…"; });
audio.addEventListener('playing', ()=>{ playerLiveText.textContent = "EN VIVO"; });
audio.addEventListener('stalled', ()=>{ if(hlsInstance){ try{ hlsInstance.startLoad(); }catch(e){} }});
audio.addEventListener('error', ()=>{ playerLiveText.textContent = "Error de señal"; showToast("Error al cargar la señal de audio"); });

document.getElementById('playPauseBtn').addEventListener('click', togglePlay);
document.getElementById('nextBtn').addEventListener('click', nextStation);
document.getElementById('prevBtn').addEventListener('click', prevStation);
document.getElementById('volumeRange').addEventListener('input', e => setVolume(parseFloat(e.target.value)));
searchInput.addEventListener('input', render);

document.querySelectorAll('.view-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    viewMode = btn.dataset.view;
    localStorage.setItem('crg_view', viewMode);
    document.querySelectorAll('.view-btn').forEach(b=>{
      b.classList.toggle('active', b === btn);
      b.setAttribute('aria-selected', b === btn? 'true' : 'false');
    });
    render();
  });
});

document.getElementById('favToggle').addEventListener('click', function(){
  showFavoritesOnly = !showFavoritesOnly;
  this.classList.toggle('on', showFavoritesOnly);
  this.setAttribute('aria-pressed', showFavoritesOnly? 'true' : 'false');
  render();
});

document.addEventListener('keydown', e=>{
  if(e.code === 'Space' && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); togglePlay(); }
});

window.addEventListener('online', () => {
  if(currentIndex >= 0 && audio.paused){ playStation(currentIndex); }
});

if('mediaSession' in navigator){
  try{
    navigator.mediaSession.setActionHandler('play', ()=> audio.play());
    navigator.mediaSession.setActionHandler('pause', ()=> audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', prevStation);
    navigator.mediaSession.setActionHandler('nexttrack', nextStation);
  }catch(e){}
}

(function init(){
  const savedVol = localStorage.getItem('crg_vol');
  if(savedVol !== null) setVolume(parseFloat(savedVol));
  else setVolume(1.0);
  document.querySelectorAll('.view-btn').forEach(b=>{
    const on = b.dataset.view === viewMode;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on? 'true' : 'false');
  });
  playerLogo.src = svgFallback('CRG');
  render();
})();
</script>
</body>
</html>
