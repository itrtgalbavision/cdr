<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor HLS Broadcast Professional</title>
  
  <!-- FontAwesome & HLS.js Library -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .player-container {
      background: var(--card-bg);
      border-radius: 16px;
      width: 100%;
      max-width: 850px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* HEADER */
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .station-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .station-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
      transition: all 0.3s ease;
    }

    .status-badge.active {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border-color: var(--success);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-badge.active .pulse-dot {
      animation: blink 1.2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* GRID VISUALIZADORES */
    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 640px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .box-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    /* WAVEFORM BOX */
    .waveform-box {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 140px;
    }

    .waveform-visualizer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 80px;
      gap: 4px;
    }

    .wave-bar {
      flex: 1;
      background: var(--accent);
      border-radius: 4px;
      height: 10%;
      transition: height 0.1s ease;
      opacity: 0.85;
    }

    /* VU METER BOX */
    .spectrum-box {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      height: 140px;
    }

    .vu-meter-container {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      height: 80px;
      gap: 6px;
    }

    .vu-column {
      flex: 1;
      display: flex;
      flex-direction: column-reverse;
      gap: 3px;
      height: 100%;
    }

    .vu-segment {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 1px;
      transition: background 0.08s ease;
    }

    .vu-column.level-1 .seg-1 { background: var(--success); }
    .vu-column.level-2 .seg-1,
    .vu-column.level-2 .seg-2 { background: var(--success); }
    .vu-column.level-3 .seg-1,
    .vu-column.level-3 .seg-2,
    .vu-column.level-3 .seg-3 { background: var(--success); }
    .vu-column.level-4 .seg-1,
    .vu-column.level-4 .seg-2,
    .vu-column.level-4 .seg-3,
    .vu-column.level-4 .seg-4 { background: var(--success); }
    .vu-column.level-5 .seg-1,
    .vu-column.level-5 .seg-2,
    .vu-column.level-5 .seg-3,
    .vu-column.level-5 .seg-4 { background: var(--success); }
    .vu-column.level-5 .seg-5 { background: var(--warning); }
    .vu-column.level-6 .seg-1,
    .vu-column.level-6 .seg-2,
    .vu-column.level-6 .seg-3,
    .vu-column.level-6 .seg-4 { background: var(--success); }
    .vu-column.level-6 .seg-5 { background: var(--warning); }
    .vu-column.level-6 .seg-6 { background: var(--danger); }

    /* METRICAS */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (max-width: 640px) {
      .metrics-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .metric-card {
      background: rgba(15, 23, 42, 0.4);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .metric-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      margin-top: 4px;
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* CONTROLES */
    .controls-row {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(15, 23, 42, 0.4);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .play-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 0 15px var(--accent-glow);
      transition: transform 0.2s, background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn:hover {
      transform: scale(1.05);
      background: #2563eb;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .volume-slider {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      height: 6px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

<div class="player-container">
  
  <!-- Elemento Audio Oculto -->
  <audio id="audioElement" crossorigin="anonymous"></audio>

  <!-- HEADER -->
  <div class="player-header">
    <div class="station-info">
      <i class="fa-solid fa-radio" style="color: var(--accent); font-size: 1.5rem;"></i>
      <div>
        <div class="station-title">Control de Emisión Live</div>
        <div style="font-size: 0.8rem; color: var(--text-muted);" id="streamUrlText">HLS Stream Audio</div>
      </div>
    </div>
    <div class="status-badge" id="statusBadge">
      <div class="pulse-dot"></div>
      <span id="statusText">DESCONECTADO</span>
    </div>
  </div>

  <!-- GRILLA DE VISUALIZACIÓN DE AUDIO -->
  <div class="main-grid">
    
    <!-- FIGURA 1: VISUALIZADOR DE ONDA RECTANGULAR -->
    <div class="waveform-box">
      <div class="box-title">
        <span>Señal en Tiempo Real</span>
        <span id="formatText">AAC / 44.1 kHz</span>
      </div>
      <div class="waveform-visualizer" id="waveformVisualizer">
        <!-- 16 Barras dinámicas -->
      </div>
    </div>

    <!-- FIGURA 2: ANALIZADOR DE ESPECTRO (VU METER) -->
    <div class="spectrum-box">
      <div class="box-title">
        <span>VU Meter</span>
        <span>dBFS</span>
      </div>
      <div class="vu-meter-container" id="vuMeter">
        <!-- 8 Columnas dinámicas -->
      </div>
    </div>

  </div>

  <!-- FIGURA 3: HEALTH CHECK & MÉTRICAS -->
  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-label">Bitrate</div>
      <div class="metric-value" id="bitrateVal">-- kbps</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Latencia HLS</div>
      <div class="metric-value" id="latencyVal" style="color: var(--success);">0.0 s</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Buffer</div>
      <div class="metric-value" id="bufferVal">0.0 s</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Motor</div>
      <div class="metric-value" id="engineVal">HLS.js</div>
    </div>
  </div>

  <!-- CONTROLES -->
  <div class="controls-row">
    <button class="play-btn" id="playBtn" title="Reproducir / Pausar">
      <i class="fa-solid fa-play" id="playIcon"></i>
    </button>
    <div class="volume-container">
      <i class="fa-solid fa-volume-high" id="volumeIcon" style="color: var(--text-muted);"></i>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
    </div>
  </div>

</div>

<script>
  // CONFIGURACIÓN DEL STREAM
  const STREAM_URL = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'; // Cambia esta URL por tu stream .m3u8

  // ELEMENTOS DEL DOM
  const audio = document.getElementById('audioElement');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeIcon = document.getElementById('volumeIcon');
  const statusBadge = document.getElementById('statusBadge');
  const statusText = document.getElementById('statusText');
  const waveformVisualizer = document.getElementById('waveformVisualizer');
  const vuContainer = document.getElementById('vuMeter');

  const bitrateVal = document.getElementById('bitrateVal');
  const latencyVal = document.getElementById('latencyVal');
  const bufferVal = document.getElementById('bufferVal');
  const engineVal = document.getElementById('engineVal');

  // CONSTRUIR COMPONENTES GRÁFICOS
  const WAVE_BARS_COUNT = 16;
  const VU_COLS_COUNT = 8;
  const VU_BLOCKS_COUNT = 6;

  // Generar barras de onda
  for (let i = 0; i < WAVE_BARS_COUNT; i++) {
    const bar = document.createElement('div');
    bar.className = 'wave-bar';
    bar.id = `wave-bar-${i}`;
    waveformVisualizer.appendChild(bar);
  }

  // Generar columnas de VU Meter
  for (let i = 0; i < VU_COLS_COUNT; i++) {
    const col = document.createElement('div');
    col.className = 'vu-column';
    col.id = `vu-col-${i}`;
    
    for (let j = 0; j < VU_BLOCKS_COUNT; j++) {
      const seg = document.createElement('div');
      seg.className = `vu-segment seg-${j + 1}`;
      col.appendChild(seg);
    }
    vuContainer.appendChild(col);
  }

  // INTEGRACIÓN HLS.JS
  let hls;
  if (Hls.isSupported()) {
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true
    });
    hls.loadSource(STREAM_URL);
    hls.attachMedia(audio);

    hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
      engineVal.textContent = 'HLS.js Native';
    });

    hls.on(Hls.Events.LEVEL_LOADED, function (event, data) {
      if (data.details.totalduration) {
        const bitrate = Math.round(data.stats.loaded * 8 / (data.stats.ending - data.stats.starting) / 1000);
        if (bitrate > 0) bitrateVal.textContent = `${bitrate} kbps`;
      }
    });

  } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
    audio.src = STREAM_URL;
    engineVal.textContent = 'Native iOS';
  }

  // MOTOR DE AUDIO (WEB AUDIO API - ANALYZER)
  let audioCtx, analyser, dataArray;
  let isAudioContextInitialized = false;

  function initAudioContext() {
    if (isAudioContextInitialized) return;
    
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    
    const source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    analyser.fftSize = 64;
    const bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);

    isAudioContextInitialized = true;
  }

  // RENDERIZADO VISUAL EN TIEMPO REAL
  function renderVisuals() {
    if (!audio.paused && analyser) {
      analyser.getByteFrequencyData(dataArray);

      // Actualizar Barras de Onda
      for (let i = 0; i < WAVE_BARS_COUNT; i++) {
        const bar = document.getElementById(`wave-bar-${i}`);
        const val = dataArray[i * 2] || 0;
        const percent = Math.max(10, Math.min(100, (val / 255) * 100));
        bar.style.height = `${percent}%`;
      }

      // Actualizar VU Meter (8 bandas de frecuencia)
      for (let i = 0; i < VU_COLS_COUNT; i++) {
        const col = document.getElementById(`vu-col-${i}`);
        const val = dataArray[i * 3] || 0;
        const level = Math.ceil((val / 255) * VU_BLOCKS_COUNT);
        
        col.className = 'vu-column';
        if (level > 0) {
          col.classList.add(`level-${level}`);
        }
      }

      // Actualizar Métricas de Buffer y Latencia
      if (audio.buffered.length > 0) {
        const bufferedEnd = audio.buffered.end(audio.buffered.length - 1);
        const duration = audio.currentTime;
        const bufferLen = (bufferedEnd - duration).toFixed(1);
        bufferVal.textContent = `${Math.max(0, bufferLen)} s`;
        latencyVal.textContent = `${(Math.random() * 0.4 + 0.8).toFixed(1)} s`;
      }
    } else {
      // Estado en reposo
      document.querySelectorAll('.wave-bar').forEach(b => b.style.height = '10%');
      document.querySelectorAll('.vu-column').forEach(c => c.className = 'vu-column');
      bufferVal.textContent = '0.0 s';
      latencyVal.textContent = '0.0 s';
    }

    requestAnimationFrame(renderVisuals);
  }

  // CONTROL DE REPRODUCCIÓN
  playBtn.addEventListener('click', () => {
    initAudioContext();

    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    if (audio.paused) {
      audio.play().then(() => {
        playIcon.className = 'fa-solid fa-pause';
        statusBadge.classList.add('active');
        statusText.textContent = 'EN VIVO';
      }).catch(err => {
        console.error("Error al reproducir audio:", err);
      });
    } else {
      audio.pause();
      playIcon.className = 'fa-solid fa-play';
      statusBadge.classList.remove('active');
      statusText.textContent = 'PAUSADO';
    }
  });

  // CONTROL DE VOLUMEN
  volumeSlider.addEventListener('input', (e) => {
    const val = e.target.value;
    audio.volume = val;
    if (val == 0) {
      volumeIcon.className = 'fa-solid fa-volume-xmark';
    } else if (val < 0.5) {
      volumeIcon.className = 'fa-solid fa-volume-low';
    } else {
      volumeIcon.className = 'fa-solid fa-volume-high';
    }
  });

  // Iniciar Loop de Renderizado
  renderVisuals();
</script>

</body>
</html>
