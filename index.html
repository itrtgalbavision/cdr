<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Radios Guatemala</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Iconos Lucide para un look moderno -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #1a1f2c 0%, #0d1017 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 140px;
        }

        /* HEADER PREMIUM */
        .header {
            text-align: center;
            padding: 50px 20px 30px;
            position: relative;
        }
        .badge-en-vivo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ff3366;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .punto-rojo {
            width: 8px;
            height: 8px;
            background-color: #ff3366;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff3366;
            animation: latido 1.5s infinite;
        }
        @keyframes latido {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.5); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(255, 51, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); }
        }
        .header h1 {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #e2e8f0;
            line-height: 1.2;
        }
        .header h1 span {
            display: block;
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* GRID DE RADIOS */
        .contenedor {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        /* TARJETAS ESTILO GLASSMORPHISM */
        .radio {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .radio::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(0,242,254,0.05) 0%, rgba(79,172,254,0.05) 100%);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .radio:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }
        .radio:hover::before {
            opacity: 1;
        }
        .radio.activa {
            background: rgba(0, 242, 254, 0.08);
            border-color: #00f2fe;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.2);
        }
        
        /* CONTENEDOR DE LOGO */
        .logo-wrapper {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s;
            z-index: 1;
        }
        .radio:hover .logo-wrapper {
            transform: scale(1.05);
        }
        .radio img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .radio span {
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
            transition: color 0.3s;
            z-index: 1;
        }
        .radio:hover span, .radio.activa span {
            color: #ffffff;
        }

        /* REPRODUCTOR FLOTANTE PREMIUM */
        .player {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 900px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            z-index: 100;
            visibility: hidden; /* Oculto hasta que se seleccione una radio */
            opacity: 0;
            transition: opacity 0.4s, visibility 0.4s, transform 0.4s;
        }
        .player.visible {
            visibility: visible;
            opacity: 1;
        }

        /* INFO DEL TEMA EN REPRODUCCIÓN */
        .player-info {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 35%;
        }
        .player-logo-container {
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        #playerLogo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .player-text {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .player-status {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00f2fe;
            font-weight: 600;
        }
        .player-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CONTROLES DE AUDIO */
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .btn-play {
            background: #ffffff;
            border: none;
            color: #0f172a;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
        }
        .btn-play:hover {
            transform: scale(1.08);
            background: #00f2fe;
            color: #0f172a;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.4);
        }
        
        /* VOLUMEN */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 25%;
            justify-content: flex-end;
        }
        .volume-container i {
            color: #94a3b8;
            font-size: 18px;
            display: flex;
            align-items: center;
        }
        .volume {
            -webkit-appearance: none;
            width: 100px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
            transition: background 0.3s;
        }
        .volume::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00f2fe;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .volume::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* RESPONSIVE */
        @media(max-width: 768px) {
            .header h1 { font-size: 22px; }
            .header h1 span { font-size: 38px; }
            .player {
                flex-direction: column;
                gap: 16px;
                padding: 16px;
                bottom: 12px;
                text-align: center;
            }
            .player-info {
                width: 100%;
                justify-content: center;
            }
            .volume-container {
                width: 100%;
                justify-content: center;
            }
            .contenedor {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
                width: 95%;
            }
            .radio { padding: 15px 10px; border-radius: 16px;}
            .logo-wrapper { width: 70px; height: 70px; margin-bottom: 8px; padding: 6px;}
            .radio span { font-size: 12px; }
        }
    </style>
</head>
<body>
    
    <div class="header">
        <div class="badge-en-vivo">
            <span class="punto-rojo"></span> Transmitiendo En Vivo
        </div>
        <h1>
            CENTRAL DE RADIOS
            <span>GUATEMALA</span>
        </h1>
    </div>

    <div class="contenedor">
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/c2cce928-c69c-45d5-bd0a-5a5eba167a0d/ts:abr.m3u8','Xtrema 101.3 FM','xtrema.png')">
            <div class="logo-wrapper"><img src="xtrema.png" alt="Xtrema 101.3 FM"></div>
            <span>Xtrema 101.3 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/406d6243-a8fc-4215-aca0-ffd43aac2bf3/ts:abr.m3u8','Galaxia 88.5 FM','galaxia.png')">
            <div class="logo-wrapper"><img src="galaxia.png" alt="Galaxia 88.5 FM"></div>
            <span>Galaxia 88.5 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/67aeb080-68fa-4197-89f6-c8bb70f9a395/ts:abr.m3u8','Tropicálida 104.9 FM','tropicalida.png')">
            <div class="logo-wrapper"><img src="tropicalida.png" alt="Tropicálida 104.9 FM"></div>
            <span>Tropicálida 104.9 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/ca11fca0-0da4-4198-83bd-b50e5607d6f8/ts:abr.m3u8','Éxitos 90.9','exitos.png')">
            <div class="logo-wrapper"><img src="exitos.png" alt="Éxitos 90.9"></div>
            <span>Éxitos 90.9</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/e33ed625-2624-4334-a625-a53a70d95791/ts:abr.m3u8','Joya 92.9 FM','joya.png')">
            <div class="logo-wrapper"><img src="joya.png" alt="Joya 92.9 FM"></div>
            <span>Joya 92.9 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/3943e598-9843-4784-9388-80e97aa3674b/ts:abr.m3u8','Alfa 97.3 FM','alfa.png')">
            <div class="logo-wrapper"><img src="alfa.png" alt="Alfa 97.3 FM"></div>
            <span>Alfa 97.3 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/a4e3175d-fa7e-4d4b-979f-e7f875468260/ts:abr.m3u8','Ranchera 95.7 FM','ranchera.png')">
            <div class="logo-wrapper"><img src="ranchera.png" alt="Ranchera 95.7 FM"></div>
            <span>Ranchera 95.7 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/53ee315d-206f-4271-994b-4c1927ae338b/ts:abr.m3u8','La Marca 94.1 FM','lamarca.png')">
            <div class="logo-wrapper"><img src="lamarca.png" alt="La Marca 94.1 FM"></div>
            <span>La Marca 94.1 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/9c2d6264-2009-49a8-a501-848a7bae1051/ts:abr.m3u8','Fiesta 103.7 FM','fiesta.png')">
            <div class="logo-wrapper"><img src="fiesta.png" alt="Fiesta 103.7 FM"></div>
            <span>Fiesta 103.7 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/8e7a8a5b-a2db-4323-8397-46c17f4573ac/ts:abr.m3u8','Sonora 96.9 FM','sonora.png')">
            <div class="logo-wrapper"><img src="sonora.png" alt="Sonora 96.9 FM"></div>
            <span>Sonora 96.9 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/ef0c82f1-e446-4093-8455-3a144ca2e171/ts:abr.m3u8','Éxitos Xela 107.1 FM','exitosx.png')">
            <div class="logo-wrapper"><img src="exitosx.png" alt="Éxitos Xela 107.1 FM"></div>
            <span>Éxitos Xela 107.1 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/c2af032e-3e29-4551-a757-e4f3d349386c/ts:abr.m3u8','Flix Xela 93.9','fixx.png')">
            <div class="logo-wrapper"><img src="fixx.png" alt="Flix Xela 93.9"></div>
            <span>Flix Xela 93.9</span>
        </div>
    </div>

    <!-- REPRODUCTOR FLOTANTE MODERNO -->
    <div class="player" id="mainPlayer">
        <div class="player-info">
            <div class="player-logo-container">
                <img id="playerLogo" src="" alt="Logo Radio">
            </div>
            <div class="player-text">
                <span class="player-status">Escuchando:</span>
                <div class="player-title" id="playerTitle">Selecciona una radio</div>
            </div>
        </div>
        <div class="controls">
            <button class="btn-play" onclick="togglePlay()" id="btnPlay">
                <i data-lucide="play"></i>
            </button>
        </div>
        <div class="volume-container">
            <i data-lucide="volume-2" id="volumeIcon"></i>
            <input class="volume" type="range" min="0" max="1" step="0.01" value="1.0" oninput="setVolume(this.value)">
        </div>
    </div>

    <audio id="audio" playsinline preload="auto"></audio>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        let audio = document.getElementById("audio");
        let title = document.getElementById("playerTitle");
        let logo = document.getElementById("playerLogo");
        let playerContainer = document.getElementById("mainPlayer");
        let btnPlay = document.getElementById("btnPlay");
        
        let hlsInstancia = null;

        // Inicializar iconos Lucide
        lucide.createIcons();

        function actualizarIconoPlay(reproduciendo) {
            if (reproduciendo) {
                btnPlay.innerHTML = '<i data-lucide="pause"></i>';
            } else {
                btnPlay.innerHTML = '<i data-lucide="play"></i>';
            }
            lucide.createIcons();
        }

        function playRadio(el, url, name, img) {
            document.querySelectorAll(".radio").forEach(r => r.classList.remove("activa"));
            el.classList.add("activa");
            
            title.innerText = name;
            logo.src = img;
            
            playerContainer.classList.add("visible");

            // CORRECCIÓN AQUÍ: Quitamos el filtro estricto de "esMovil". 
            // Ahora si el navegador soporta HLS.js (que son casi todos los de PC), levantará la transmisión correctamente.
            if (Hls.isSupported()) {
                if (hlsInstancia) {
                    hlsInstancia.destroy(); 
                }
                
                hlsInstancia = new Hls({
                    maxBufferLength: 15,
                    maxMaxBufferLength: 30,
                    liveSyncDurationCount: 3,
                    liveMaxLatencyDurationCount: 10
                });
                
                hlsInstancia.loadSource(url);
                hlsInstancia.attachMedia(audio);
                hlsInstancia.on(Hls.Events.MANIFEST_PARSED, function() {
                    audio.play().catch(err => console.log("Error al reproducir automáticamente:", err));
                });

                hlsInstancia.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        hlsInstancia.destroy();
                        audio.src = url;
                        audio.play().catch(err => console.log(err));
                    }
                });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                // Soporte nativo de HLS (principalmente Safari en iOS/Mac)
                audio.src = url;
                audio.play().catch(err => console.log(err));
            }
        }

        // Detectar estados del audio para sincronizar el botón de Play/Pause
        audio.addEventListener('play', () => actualizarIconoPlay(true));
        audio.addEventListener('pause', () => actualizarIconoPlay(false));

        function togglePlay() {
            if (!audio.src && !hlsInstancia) return;
            
            if (audio.paused) {
                audio.play().catch(err => console.log(err));
            } else {
                audio.pause();
            }
        }

        function setVolume(v) {
            audio.volume = v;
            let volIcon = document.getElementById("volumeIcon");
            
            if(v == 0) {
                volIcon.parentNode.innerHTML = '<i data-lucide="volume-x" id="volumeIcon"></i>';
            } else if(v < 0.5) {
                volIcon.parentNode.innerHTML = '<i data-lucide="volume-1" id="volumeIcon"></i>';
            } else {
                volIcon.parentNode.innerHTML = '<i data-lucide="volume-2" id="volumeIcon"></i>';
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
