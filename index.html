<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Central de Radios Guatemala</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00e5ff;
            --primary-dark: #00bfff;
            --accent: #ff3366;
            --bg-body: #0b1118;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        *{box-sizing:border-box;}
        
        body{
            margin:0;
            font-family:'Poppins',sans-serif;
            background: radial-gradient(circle at top, #162431 0%, #0b1118 100%);
            color:white;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
        }

        .badge-en-vivo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.2);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--accent);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .punto-rojo {
            width: 8px; height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: latido 1.5s infinite;
        }

        @keyframes latido {
            0% { transform: scale(0.9); opacity: 1; }
            70% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(0.9); opacity: 0; }
        }

        .header h1 {
            margin: 0;
            font-size: 38px;
            line-height: 1.1;
            font-weight: 800;
            color: #f0f0f0;
        }

        .header h1 span {
            display: block;
            font-size: 48px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 10px rgba(0, 229, 255, 0.3));
        }

        /* GRID */
        .contenedor {
            width: 90%; 
            max-width: 1200px; 
            margin: 20px auto 140px;
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 25px;
        }

        /* TARJETAS */
        .radio {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 160px;
            text-align: center;
            position: relative;
        }

        .radio:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .radio.activa {
            background: rgba(0, 229, 255, 0.05);
            border: 2px solid var(--primary);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
        }

        .radio img {
            width: auto;
            max-width: 110px;
            height: 65px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
            transition: transform 0.3s;
        }

        .radio:hover img {
            transform: scale(1.05);
        }

        .radio span {
            font-size: 14px;
            font-weight: 500;
            color: #efefef;
            letter-spacing: 0.3px;
        }

        /* PLAYER BAR */
        .player {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            background: rgba(15, 24, 34, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        #playerLogo {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: white;
            padding: 5px;
            object-fit: contain;
            border: 1px solid var(--glass-border);
        }
        
        #playerLogo[src=""], #playerLogo:not([src]) { display: none; }

        .player-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        button {
            background: var(--primary);
            border: none;
            color: #0b1118;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
        }

        button:hover {
            background: white;
            transform: scale(1.05);
        }

        .volume {
            width: 120px;
            height: 5px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        /* RESPONSIVE */
        @media(max-width: 768px) {
            .header h1 { font-size: 28px; }
            .header h1 span { font-size: 36px; }
            .contenedor { width: 95%; gap: 15px; }
            .player { padding: 15px 20px; }
            .volume { display: none; }
            .player-title { font-size: 13px; max-width: 150px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        }
    </style>
</head>
<body>
    
    <div class="header">
        <div class="badge-en-vivo">
            <span class="punto-rojo"></span> EN VIVO
        </div>
        <h1>CENTRAL DE RADIOS <span>GUATEMALA</span></h1>
    </div>

    <div class="contenedor">
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/c2cce928-c69c-45d5-bd0a-5a5eba167a0d/ts:abr.m3u8','Xtrema 101.3 FM','xtrema.png')">
            <img src="xtrema.png"> <span>Xtrema 101.3 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/406d6243-a8fc-4215-aca0-ffd43aac2bf3/ts:abr.m3u8','Galaxia 88.5 FM','galaxia.png')">
            <img src="galaxia.png"> <span>Galaxia 88.5 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/67aeb080-68fa-4197-89f6-c8bb70f9a395/ts:abr.m3u8','Tropicálida 104.9 FM','tropicalida.png')">
            <img src="tropicalida.png"> <span>Tropicálida 104.9 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/ca11fca0-0da4-4198-83bd-b50e5607d6f8/ts:abr.m3u8','Éxitos 90.9','exitos.png')">
            <img src="exitos.png"> <span>Éxitos 90.9</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/e33ed625-2624-4334-a625-a53a70d95791/ts:abr.m3u8','Joya 92.9 FM','joya.png')">
            <img src="joya.png"> <span>Joya 92.9 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/3943e598-9843-4784-9388-80e97aa3674b/ts:abr.m3u8','Alfa 97.3 FM','alfa.png')">
            <img src="alfa.png"> <span>Alfa 97.3 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/a4e3175d-fa7e-4d4b-979f-e7f875468260/ts:abr.m3u8','Ranchera 95.7 FM','ranchera.png')">
            <img src="ranchera.png"> <span>Ranchera 95.7 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/53ee315d-206f-4271-994b-4c1927ae338b/ts:abr.m3u8','La Marca 94.1 FM','lamarca.png')">
            <img src="lamarca.png"> <span>La Marca 94.1 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/9c2d6264-2009-49a8-a501-848a7bae1051/ts:abr.m3u8','Fiesta 103.7 FM','fiesta.png')">
            <img src="fiesta.png"> <span>Fiesta 103.7 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/8e7a8a5b-a2db-4323-8397-46c17f4573ac/ts:abr.m3u8','Sonora 96.9 FM','sonora.png')">
            <img src="sonora.png"> <span>Sonora 96.9 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/ef0c82f1-e446-4093-8455-3a144ca2e171/ts:abr.m3u8','Éxitos Xela 107.1 FM','exitosx.png')">
            <img src="exitosx.png"> <span>Éxitos Xela 107.1 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/c2af032e-3e29-4551-a757-e4f3d349386c/ts:abr.m3u8','Flix Xela 93.9','fixx.png')">
            <img src="fixx.png"> <span>Flix Xela 93.9</span>
        </div>
    </div>

    <div class="player">
        <div class="player-info">
            <img id="playerLogo">
            <div class="player-title" id="playerTitle">Selecciona una radio</div>
        </div>
        <div class="controls">
            <button onclick="togglePlay()">Play / Pause</button>
            <input class="volume" type="range" min="0" max="1" step="0.01" value="1.0" onchange="setVolume(this.value)">
        </div>
    </div>

    <audio id="audio" playsinline preload="auto"></audio>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        let audio = document.getElementById("audio");
        let title = document.getElementById("playerTitle");
        let logo = document.getElementById("playerLogo");
        let hlsInstancia = null;

        function playRadio(el, url, name, img) {
            document.querySelectorAll(".radio").forEach(r => r.classList.remove("activa"));
            el.classList.add("activa");
            title.innerText = name;
            logo.src = img;

            // Intentar reproducir el elemento audio vacío primero (necesario para safari móvil)
            audio.play().catch(() => {});

            if (Hls.isSupported()) {
                if (hlsInstancia) {
                    hlsInstancia.destroy();
                }

                // OPTIMIZACIÓN MÓVIL: Configuración de buffer agresiva para evitar cortes
                hlsInstancia = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false, // Desactivamos latencia baja para priorizar estabilidad
                    backBufferLength: 60,
                    maxBufferLength: 30, // 30 segundos de colchón
                    maxMaxBufferLength: 60,
                    liveSyncDurationCount: 5, // Se aleja un poco más del punto en vivo para mayor estabilidad
                    liveMaxLatencyDurationCount: 10
                });

                hlsInstancia.loadSource(url);
                hlsInstancia.attachMedia(audio);
                hlsInstancia.on(Hls.Events.MANIFEST_PARSED, function() {
                    audio.play();
                });

                // REINTENTO AUTOMÁTICO: Si hay error de red, intenta recargar
                hlsInstancia.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hlsInstancia.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInstancia.recoverMediaError();
                                break;
                            default:
                                hlsInstancia.destroy();
                                audio.src = url;
                                audio.play();
                                break;
                        }
                    }
                });

            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                // Soporte nativo para iOS Safari
                audio.src = url;
                audio.addEventListener('canplay', function() {
                    audio.play();
                });
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function setVolume(v) {
            audio.volume = v;
        }
    </script>
</body>
</html>
