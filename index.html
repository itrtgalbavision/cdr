<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Radios Guatemala</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00e5ff;
            --primary-dark: #00bfff;
            --accent: #ff3366;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        *{box-sizing:border-box;}
        body{
            margin:0; font-family:'Poppins',sans-serif;
            background: radial-gradient(circle at top, #162431 0%, #0b1118 100%);
            color:white; min-height: 100vh;
        }
        .header { text-align: center; padding: 40px 20px; }
        .badge-en-vivo {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255, 51, 102, 0.1); border: 1px solid rgba(255, 51, 102, 0.2);
            padding: 6px 16px; border-radius: 30px; font-size: 11px; font-weight: 700;
            color: var(--accent); margin-bottom: 20px; text-transform: uppercase;
        }
        .punto-rojo {
            width: 8px; height: 8px; background-color: var(--accent); border-radius: 50%;
            box-shadow: 0 0 10px var(--accent); animation: latido 1.5s infinite;
        }
        @keyframes latido { 0% { transform: scale(0.9); opacity: 1; } 70% { transform: scale(1.5); opacity: 0; } 100% { transform: scale(0.9); opacity: 0; } }
        .header h1 { margin: 0; font-size: 32px; font-weight: 800; }
        .header h1 span {
            display: block; font-size: 40px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .contenedor {
            width: 90%; max-width: 1200px; margin: 0 auto 140px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;
        }
        .radio {
            background: var(--glass); border-radius: 20px; padding: 25px 15px; cursor: pointer;
            transition: 0.3s; border: 1px solid var(--glass-border);
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        .radio:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.08); border-color: var(--primary); }
        .radio.activa { border: 2px solid var(--primary); background: rgba(0, 229, 255, 0.05); }
        .radio img { width: auto; max-width: 100px; height: 60px; object-fit: contain; margin-bottom: 12px; }
        .radio span { font-size: 14px; font-weight: 500; color: #efefef; }
        .player {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(15, 24, 34, 0.95); backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass-border); padding: 15px 30px;
            display: flex; align-items: center; justify-content: space-between; z-index: 1000;
        }
        .player-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        #playerLogo { width: 45px; height: 45px; border-radius: 8px; background: white; padding: 4px; object-fit: contain; }
        #playerLogo[src=""], #playerLogo:not([src]) { display: none; }
        .player-title { font-size: 14px; font-weight: 600; }
        .controls { display: flex; align-items: center; gap: 20px; }
        button {
            background: var(--primary); border: none; padding: 10px 20px; border-radius: 50px;
            cursor: pointer; font-weight: 700; font-size: 12px; transition: 0.2s;
            color: #000; font-weight: 600;
        }
        button:hover { background: white; transform: scale(1.05); }
        button.loading { opacity: 0.6; }
        .status-indicator {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            margin-right: 8px; background: #ff3366;
        }
        .status-indicator.playing { background: #00ff00; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .volume { width: 100px; accent-color: var(--primary); }
        @media(max-width: 600px) {
            .player { padding: 15px; } 
            .volume { display: none; }
            .player-title { font-size: 12px; max-width: 140px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        }
    </style>
</head>

    <div class="player">
        <div class="player-info">
            <span class="status-indicator" id="statusIndicator"></span>
            <img id="playerLogo">
            <div class="player-title" id="playerTitle">Selecciona una radio</div>
        </div>
        <div class="controls">
            <button id="playBtn" onclick="togglePlay()">▶ Play</button>
            <input class="volume" type="range" min="0" max="1" step="0.01" value="1.0" onchange="setVolume(this.value)">
        </div>
    </div>

    <audio id="audio" crossorigin="anonymous" playsinline controlsList="nodownload"></audio>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>

    <script>
        let audio = document.getElementById("audio");
        let title = document.getElementById("playerTitle");
        let logo = document.getElementById("playerLogo");
        let playBtn = document.getElementById("playBtn");
        let statusIndicator = document.getElementById("statusIndicator");
        
        let hlsInstancia = null;
        let currentRadio = null;
        let currentRadioName = null;
        let isLoading = false;

        // Configuración optimizada pero SIMPLE
        const hlsConfig = {
            debug: false,
            enableWorker: true,
            autoStartLoad: true,
            startLevel: -1,
            defaultAudioCodec: undefined,
            initialLiveManifestSize: 3,
            maxBufferLength: 30,
            maxMaxBufferLength: 300,
            backBufferLength: 60,
            fragLoadingTimeOut: 20000,
            fragLoadingMaxRetry: 4,
            levelLoadingTimeOut: 10000,
            levelLoadingMaxRetry: 4,
            manifestLoadingTimeOut: 10000,
            manifestLoadingMaxRetry: 2,
            lowLatencyMode: false,
            testBitrate: false,
            progressive: false
        };

        function playRadio(el, url, name, img) {
            console.log("Iniciando reproducción:", name);
            
            // Si es la misma radio, solo toggle play/pause
            if (currentRadio === url && !isLoading) {
                togglePlay();
                return;
            }

            isLoading = true;
            currentRadio = url;
            currentRadioName = name;
            
            // UI Updates
            document.querySelectorAll(".radio").forEach(r => r.classList.remove("activa"));
            el.classList.add("activa");
            title.innerText = name;
            logo.src = img;
            logo.style.display = "block";
            playBtn.textContent = "⏳ Cargando...";
            playBtn.classList.add("loading");
            updateStatus(false);

            // Limpiar reproducción anterior
            audio.pause();
            
            // Destruir HLS anterior
            if (hlsInstancia) {
                try {
                    hlsInstancia.destroy();
                    hlsInstancia = null;
                } catch (e) {
                    console.log("Error limpiando HLS:", e);
                    hlsInstancia = null;
                }
            }

            // Pequeño delay para asegurar limpieza
            setTimeout(() => {
                loadAndPlay(url, name);
            }, 100);
        }

        function loadAndPlay(url, name) {
            try {
                console.log("Cargando:", url);
                
                if (Hls.isSupported()) {
                    hlsInstancia = new Hls(hlsConfig);

                    // Cuando el manifest esté listo
                    hlsInstancia.once(Hls.Events.MANIFEST_PARSED, function() {
                        console.log("✓ Manifest parsed");
                        isLoading = false;
                        playBtn.classList.remove("loading");
                        playBtn.textContent = "⏸ Pause";
                        updateStatus(true);
                        audio.play().catch(e => console.error("Error play:", e));
                    });

                    // Manejo de errores
                    hlsInstancia.on(Hls.Events.ERROR, function(event, data) {
                        console.error("HLS Error:", data.type, data.details);
                        
                        if (data.fatal) {
                            console.log("Error fatal, intentando fallback...");
                            if (hlsInstancia) {
                                hlsInstancia.destroy();
                                hlsInstancia = null;
                            }
                            
                            // Fallback directo
                            setTimeout(() => {
                                fallbackPlay(url, name);
                            }, 500);
                        }
                    });

                    // Cargar source
                    hlsInstancia.loadSource(url);
                    hlsInstancia.attachMedia(audio);
                    
                } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                    console.log("Usando soporte nativo HLS");
                    audio.src = url;
                    isLoading = false;
                    playBtn.classList.remove("loading");
                    playBtn.textContent = "⏸ Pause";
                    updateStatus(true);
                    audio.load();
                    audio.play().catch(e => console.error("Error play iOS:", e));
                } else {
                    console.log("Usando fallback directo (sin HLS.js support)");
                    fallbackPlay(url, name);
                }

            } catch (err) {
                console.error("Error en loadAndPlay:", err);
                fallbackPlay(url, name);
            }
        }

        function fallbackPlay(url, name) {
            console.log("Fallback: Reproducción directa");
            try {
                audio.src = url;
                audio.load();
                isLoading = false;
                playBtn.classList.remove("loading");
                playBtn.textContent = "⏸ Pause";
                updateStatus(true);
                
                audio.play().catch(e => {
                    console.error("Error fallback play:", e);
                    playBtn.textContent = "✗ Error";
                    playBtn.classList.remove("loading");
                });
            } catch (err) {
                console.error("Error fallback:", err);
                playBtn.textContent = "✗ Error";
                playBtn.classList.remove("loading");
            }
        }

        function togglePlay() {
            if (!audio.src && !currentRadio) {
                console.log("Sin radio seleccionada");
                return;
            }

            if (audio.paused) {
                console.log("Reproduciendo");
                audio.play().catch(e => console.error("Error:", e));
            } else {
                console.log("Pausando");
                audio.pause();
            }
        }

        function setVolume(v) {
            audio.volume = parseFloat(v);
        }

        function updateStatus(playing) {
            if (playing) {
                statusIndicator.classList.add("playing");
            } else {
                statusIndicator.classList.remove("playing");
            }
        }

        // Events de audio
        audio.addEventListener("play", function() {
            console.log("Audio: play");
            playBtn.textContent = "⏸ Pause";
            updateStatus(true);
        });

        audio.addEventListener("pause", function() {
            console.log("Audio: pause");
            playBtn.textContent = "▶ Play";
            updateStatus(false);
        });

        audio.addEventListener("error", function(e) {
            console.error("Audio error:", audio.error);
            playBtn.textContent = "✗ Error";
            playBtn.classList.remove("loading");
        });

        audio.addEventListener("stalled", function() {
            console.log("Audio stalled - recuperando");
            audio.load();
        });

        audio.addEventListener("loadstart", function() {
            console.log("Audio: loadstart");
        });

        audio.addEventListener("canplay", function() {
            console.log("Audio: canplay");
        });

        // Recuperar al volver a la app
        document.addEventListener("visibilitychange", function() {
            if (!document.hidden && !audio.paused) {
                console.log("App visible - verificando audio");
                if (audio.paused && currentRadio) {
                    audio.play().catch(e => console.error("Error resume:", e));
                }
            }
        });

        // Limpiar al cerrar
        window.addEventListener("beforeunload", function() {
            if (hlsInstancia) {
                try {
                    hlsInstancia.destroy();
                } catch (e) {}
            }
            audio.pause();
        });

        console.log("Script cargado - HLS.js disponible:", typeof Hls !== 'undefined');
    </script>
</body>
</html>
