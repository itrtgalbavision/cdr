<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Radios Guatemala</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Iconos Lucide para un look moderno -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #1a1f2c 0%, #0d1017 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 140px;
        }

        /* HEADER PREMIUM */
        .header {
            text-align: center;
            padding: 50px 20px 30px;
            position: relative;
        }
        .badge-en-vivo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ff3366;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .punto-rojo {
            width: 8px;
            height: 8px;
            background-color: #ff3366;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff3366;
            animation: latido 1.5s infinite;
        }
        @keyframes latido {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.5); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(255, 51, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); }
        }
        .header h1 {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #e2e8f0;
            line-height: 1.2;
        }
        .header h1 span {
            display: block;
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* GRID DE RADIOS */
        .contenedor {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        /* TARJETAS ESTILO GLASSMORPHISM */
        .radio {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .radio::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(0,242,254,0.05) 0%, rgba(79,172,254,0.05) 100%);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .radio:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }
        .radio:hover::before {
            opacity: 1;
        }
        .radio.activa {
            background: rgba(0, 242, 254, 0.08);
            border-color: #00f2fe;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.2);
        }
        
        /* CONTENEDOR DE LOGO */
        .logo-wrapper {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s;
            z-index: 1;
        }
        .radio:hover .logo-wrapper {
            transform: scale(1.05);
        }
        .radio img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .radio span {
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
            transition: color 0.3s;
            z-index: 1;
        }
        .radio:hover span, .radio.activa span {
            color: #ffffff;
        }

        /* REPRODUCTOR FLOTANTE PREMIUM */
        .player {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 900px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.4s, visibility 0.4s, transform 0.4s;
        }
        .player.visible {
            visibility: visible;
            opacity: 1;
        }

        /* INFO DEL TEMA EN REPRODUCCIÓN */
        .player-info {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 35%;
        }
        .player-logo-container {
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        #playerLogo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .player-text {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .player-status {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00f2fe;
            font-weight: 600;
        }
        .player-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CONTROLES DE AUDIO */
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .btn-play {
            background: #ffffff;
            border: none;
            color: #0f172a;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
        }
        .btn-play:hover {
            transform: scale(1.08);
            background: #00f2fe;
            color: #0f172a;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.4);
        }
        
        /* VOLUMEN */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 25%;
            justify-content: flex-end;
        }
        .volume-container i {
            color: #94a3b8;
            font-size: 18px;
            display: flex;
            align-items: center;
        }
        .volume {
            -webkit-appearance: none;
            width: 100px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
            transition: background 0.3s;
        }
        .volume::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00f2fe;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .volume::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* RESPONSIVE */
        @media(max-width: 768px) {
            .header h1 { font-size: 22px; }
            .header h1 span { font-size: 38px; }
            .player {
                flex-direction: column;
                gap: 16px;
                padding: 16px;
                bottom: 12px;
                text-align: center;
            }
            .player-info {
                width: 100%;
                justify-content: center;
            }
            .volume-container {
                width: 100%;
                justify-content: center;
            }
            .contenedor {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
                width: 95%;
            }
            .radio { padding: 15px 10px; border-radius: 16px;}
            .logo-wrapper { width: 70px; height: 70px; margin-bottom: 8px; padding: 6px;}
            .radio span { font-size: 12px; }
        }
    </style>
</head>
<body>
    
    <div class="header">
        <div class="badge-en-vivo">
            <span class="punto-rojo"></span> Transmitiendo En Vivo
        </div>
        <h1>
            CENTRAL DE RADIOS
            <span>GUATEMALA</span>
        </h1>
    </div>

    <div class="contenedor">
        <!-- Añadimos IDs a las tarjetas para poder manejarlas fácilmente con JS -->
        <div id="radio-xtrema" class="radio" onclick="playRadio(this,'https://icecast.emisorasunidas.com/xtrema','Xtrema 101.3 FM','xtrema.png')">
            <div class="logo-wrapper"><img src="xtrema.png" alt="Xtrema 101.3 FM"></div>
            <span>Xtrema 101.3 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://icecast.emisorasunidas.com/galaxia','Galaxia 88.5 FM','galaxia.png')">
            <div class="logo-wrapper"><img src="galaxia.png" alt="Galaxia 88.5 FM"></div>
            <span>Galaxia 88.5 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://icecast.emisorasunidas.com/tropicalida','Tropicálida 104.9 FM','tropicalida.png')">
            <div class="logo-wrapper"><img src="tropicalida.png" alt="Tropicálida 104.9 FM"></div>
            <span>Tropicálida 104.9 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://icecast.emisorasunidas.com/exitos','Éxitos 90.9','exitos.png')">
            <div class="logo-wrapper"><img src="exitos.png" alt="Éxitos 90.9"></div>
            <span>Éxitos 90.9</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://icecast.emisorasunidas.com/joya','Joya 92.9 FM','joya.png')">
            <div class="logo-wrapper"><img src="joya.png" alt="Joya 92.9 FM"></div>
            <span>Joya 92.9 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://icecast.emisorasunidas.com/alfa','Alfa 97.3 FM','alfa.png')">
            <div class="logo-wrapper"><img src="alfa.png" alt="Alfa 97.3 FM"></div>
            <span>Alfa 97.3 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://icecast.emisorasunidas.com/ranchera','Ranchera 95.7 FM','ranchera.png')">
            <div class="logo-wrapper"><img src="ranchera.png" alt="Ranchera 95.7 FM"></div>
            <span>Ranchera 95.7 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://icecast.emisorasunidas.com/lamarca','La Marca 94.1 FM','lamarca.png')">
            <div class="logo-wrapper"><img src="lamarca.png" alt="La Marca 94.1 FM"></div>
            <span>La Marca 94.1 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://icecast.emisorasunidas.com/fiesta','Fiesta 103.7 FM','fiesta.png')">
            <div class="logo-wrapper"><img src="fiesta.png" alt="Fiesta 103.7 FM"></div>
            <span>Fiesta 103.7 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://icecast.emisorasunidas.com/sonora','Sonora 96.9 FM','sonora.png')">
            <div class="logo-wrapper"><img src="sonora.png" alt="Sonora 96.9 FM"></div>
            <span>Sonora 96.9 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://icecast.emisorasunidas.com/exitosxela','Éxitos Xela 107.1 FM','exitosx.png')">
            <div class="logo-wrapper"><img src="exitosx.png" alt="Éxitos Xela 107.1 FM"></div>
            <span>Éxitos Xela 107.1 FM</span>
        </div>
        <div class="radio" onclick="playRadio(this,'https://icecast.emisorasunidas.com/flix','Flix Xela 93.9','fixx.png')">
            <div class="logo-wrapper"><img src="fixx.png" alt="Flix Xela 93.9"></div>
            <span>Flix Xela 93.9</span>
        </div>
    </div>

    <!-- REPRODUCTOR FLOTANTE MODERNO -->
    <div class="player" id="mainPlayer">
        <div class="player-info">
            <div class="player-logo-container">
                <img id="playerLogo" src="" alt="Logo Radio">
            </div>
            <div class="player-text">
                <span class="player-status">Escuchando:</span>
                <div class="player-title" id="playerTitle">Selecciona una radio</div>
            </div>
        </div>
        <div class="controls">
            <button class="btn-play" onclick="togglePlay()" id="btnPlay">
                <i data-lucide="play"></i>
            </button>
        </div>
        <div class="volume-container">
            <i data-lucide="volume-2" id="volumeIcon"></i>
            <input class="volume" type="range" min="0" max="1" step="0.01" value="1.0" id="volumeSlider" oninput="setVolume(this.value)">
        </div>
    </div>

    <!-- El truco del Autostart: Iniciamos la etiqueta audio mutada para saltar el bloqueo del navegador -->
    <audio id="audio" playsinline preload="auto" muted></audio>

    <script>
        let audio = document.getElementById("audio");
        let title = document.getElementById("playerTitle");
        let logo = document.getElementById("playerLogo");
        let playerContainer = document.getElementById("mainPlayer");
        let btnPlay = document.getElementById("btnPlay");
        let volumeSlider = document.getElementById("volumeSlider");

        lucide.createIcons();

        function actualizarIconoPlay(reproduciendo) {
            if (reproduciendo) {
                btnPlay.innerHTML = '<i data-lucide="pause"></i>';
            } else {
                btnPlay.innerHTML = '<i data-lucide="play"></i>';
            }
            lucide.createIcons();
        }

        function playRadio(el, url, name, img) {
            document.querySelectorAll(".radio").forEach(r => r.classList.remove("activa"));
            el.classList.add("activa");
            
            title.innerText = name;
            logo.src = img;
            playerContainer.classList.add("visible");

            audio.src = url;
            audio.load();
            
            audio.play().catch(error => {
                console.log("Esperando interacción para quitar el mute:", error);
            });
        }

        audio.addEventListener('play', () => actualizarIconoPlay(true));
        audio.addEventListener('pause', () => actualizarIconoPlay(false));

        function togglePlay() {
            if (!audio.src) return;
            
            // Si el usuario presiona play manualmente, nos aseguramos de quitar el mute
            if (audio.muted) audio.muted = false;

            if (audio.paused) {
                audio.play().catch(err => console.log(err));
            } else {
                audio.pause();
            }
        }

        function setVolume(v) {
            audio.volume = v;
            if(v > 0 && audio.muted) {
                audio.muted = false; // Quitar el silencio si se mueve la barra de volumen
            }
            
            let volIcon = document.getElementById("volumeIcon");
            if(v == 0) {
                volIcon.parentNode.innerHTML = '<i data-lucide="volume-x" id="volumeIcon"></i>';
            } else if(v < 0.5) {
                volIcon.parentNode.innerHTML = '<i data-lucide="volume-1" id="volumeIcon"></i>';
            } else {
                volIcon.parentNode.innerHTML = '<i data-lucide="volume-2" id="volumeIcon"></i>';
            }
            lucide.createIcons();
        }

        // --- LÓGICA DE AUTOSTART REAL ---
        window.addEventListener('DOMContentLoaded', () => {
            // Pasados 500ms, forzamos la reproducción de la primera estación de tu lista (Xtrema)
            setTimeout(() => {
                const primeraRadio = document.getElementById('radio-xtrema');
                if (primeraRadio) {
                    playRadio(primeraRadio, 'https://icecast.emisorasunidas.com/xtrema', 'Xtrema 101.3 FM', 'xtrema.png');
                }
            }, 500);
        });

        // Evento Global: Al hacer un solo clic o toque en CUALQUIER parte de la pantalla,
        // el navegador activa el contexto de audio y le quitamos el 'muted' al reproductor de forma invisible.
        const activarAudioGlobal = () => {
            if (audio.muted) {
                audio.muted = false;
                audio.volume = 1.0;
                volumeSlider.value = 1.0;
                // Forzar play por si acaso quedó retenido
                audio.play().catch(() => {});
            }
            // Retiramos los detectores para que no se sigan ejecutando innecesariamente
            document.removeEventListener('click', activarAudioGlobal);
            document.removeEventListener('touchstart', activarAudioGlobal);
        };

        document.addEventListener('click', activarAudioGlobal);
        document.addEventListener('touchstart', activarAudioGlobal);
    </script>
</body>
</html>
