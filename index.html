<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Radios — Neon + Pac-Man</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
<style>
:root{--bg-deep:#06090e;--bg-surface:#0e141d;--bg-surface-hover:#151d2a;--bg-card:rgba(14,20,29,0.6);--border:rgba(255,255,255,0.06);--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#475569;--radius-xl:18px;--radius-lg:14px;--radius-md:10px;--font-sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100vh;background:var(--bg-deep)}body{font-family:var(--font-sans);color:var(--text-primary);-webkit-font-smoothing:antialiased;overflow-x:hidden}
#ambientGlow{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:0;transition:opacity 0.8s ease, background 0.8s ease;background:radial-gradient(600px 400px at 50% -10%, var(--glow, rgba(0,217,255,0.12)), transparent 70%), radial-gradient(800px 600px at 100% 100%, var(--glow2, rgba(255,0,170,0.06)), transparent 60%);filter:blur(20px)}
#ambientGlow.on{opacity:1}
.wrap{max-width:1200px;margin:0 auto;padding:40px 20px 190px}
.site-header{text-align:center;margin-bottom:36px}.live-badge{display:inline-flex;align-items:center;gap:8px;font-size:10px;font-weight:800;letter-spacing:0.22em;color:#ff99aa;background:rgba(255,51,85,0.08);border:1px solid rgba(255,51,85,0.18);padding:5px 14px;border-radius:100px;margin-bottom:16px;text-transform:uppercase}
.live-dot{width:6px;height:6px;border-radius:50%;background:#ff3355;box-shadow:0 0 8px #ff3355;animation:pulseDot 1.4s ease-in-out infinite}@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(0.8)}}
.site-title{font-size:clamp(28px,4.5vw,48px);font-weight:900;line-height:1.05;letter-spacing:-0.03em;text-transform:uppercase}.site-title .thin{color:var(--text-muted);font-weight:700;display:block;font-size:0.55em;letter-spacing:0.08em}.site-title .grad{background:linear-gradient(135deg,#ffffff 40%, #8be9ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.site-subtitle{margin-top:8px;color:var(--text-secondary);font-size:13px;font-weight:500}
.controls-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:24px;background:var(--bg-surface);border:1px solid var(--border);padding:8px;border-radius:var(--radius-lg)}
.search-wrap{position:relative;flex:1 1 280px}.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);width:16px;height:16px}.search-input{width:100%;background:rgba(0,0,0,0.2);border:1px solid var(--border);color:var(--text-primary);border-radius:10px;padding:10px 14px 10px 40px;font-size:13px;outline:none;transition:all 0.2s}.search-input:focus{border-color:rgba(0,217,255,0.4);box-shadow:0 0 0 3px rgba(0,217,255,0.12)}
.view-controls{display:flex;gap:6px;align-items:center}.view-btn,.fav-toggle{border:1px solid var(--border);background:rgba(255,255,255,0.02);color:var(--text-secondary);font-size:12px;font-weight:600;padding:8px 14px;border-radius:10px;transition:all 0.2s}.view-btn:hover,.fav-toggle:hover{background:var(--bg-surface-hover);color:#fff}.view-btn.active{border-color:rgba(0,217,255,0.4);background:rgba(0,217,255,0.08);color:#7de8ff}.fav-toggle.on{border-color:rgba(255,183,0,0.35);background:rgba(255,183,0,0.08);color:#ffcc66}
.list-meta{color:var(--text-muted);font-size:11px;font-weight:600;margin:0 0 14px 4px;text-transform:uppercase;letter-spacing:0.06em}
.stations-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.station-card{--neon:#00d9ff;--neon-border:rgba(0,217,255,0.28);--neon-soft:rgba(0,217,255,0.12);--neon-glow:rgba(0,217,255,0.5);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.15)), var(--bg-card);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:14px;height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 12px;cursor:pointer;transition:all 0.28s ease;position:relative}
.station-card:hover{background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.2)), rgba(18,26,38,0.85);border-color:var(--neon-border);transform:translateY(-2px)}
.station-card.active{border-color:var(--neon-border);background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.25)), rgba(14,20,29,0.9);box-shadow:0 0 0 1px var(--neon-border) inset, 0 4px 20px rgba(0,0,0,0.4)}
.card-logo-wrap{width:100%;height:54px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:rgba(0,0,0,0.28);border-radius:11px;position:relative;overflow:hidden;border:1px solid var(--neon-border);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 0 0 1px rgba(0,0,0,0.5);transition:all 0.35s ease}
.card-logo-wrap::before{content:'';position:absolute;inset:0;border-radius:11px;background:linear-gradient(100deg, transparent 20%, var(--neon-glow) 50%, transparent 80%);opacity:0;transform:translateX(-100%);transition:transform 0.9s ease, opacity 0.4s ease;mix-blend-mode:screen}
.station-card:hover .card-logo-wrap::before{transform:translateX(100%);opacity:0.32}
.station-card.active .card-logo-wrap{border-color:var(--neon);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 0 14px var(--neon-soft), 0 0 0 1px var(--neon-border) inset;animation:neonBreathe 2.8s ease-in-out infinite alternate}
@keyframes neonBreathe{0%{box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 0 8px var(--neon-soft), 0 0 0 1px var(--neon-border) inset}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,0.09), 0 0 16px var(--neon-soft), 0 0 22px var(--neon-border), 0 0 0 1px var(--neon) inset}}
.card-logo-wrap img{max-width:66%;max-height:74%;object-fit:contain;filter:drop-shadow(0 0 4px var(--neon-soft)) brightness(1.02);transition:all 0.35s ease;position:relative;z-index:1}
.station-card:hover .card-logo-wrap img{filter:drop-shadow(0 0 8px var(--neon-glow)) brightness(1.08);transform:scale(1.04)}
.card-name{font-size:13px;font-weight:700;color:#e8eef6;text-align:center;letter-spacing:-0.01em}.station-card.active .card-name{color:#fff;text-shadow:0 0 12px var(--neon-soft)}
.card-freq{font-size:10.5px;font-weight:600;color:var(--text-secondary);margin-top:3px;letter-spacing:0.04em}.station-card:hover .card-freq,.station-card.active .card-freq{color:var(--neon)}
.card-fav-btn{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--text-muted);transition:all 0.2s;z-index:2}
.card-fav-btn:hover,.card-fav-btn.is-fav{color:#ffcc66}
.stations-list{display:flex;flex-direction:column;gap:8px}.list-row{--neon:#00d9ff;--neon-border:rgba(0,217,255,0.28);--neon-soft:rgba(0,217,255,0.12);--neon-glow:rgba(0,217,255,0.45);display:flex;align-items:center;gap:12px;background:var(--bg-card);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:8px 14px;transition:all 0.22s;cursor:pointer}
.list-row:hover{background:rgba(18,26,38,0.85);border-color:var(--neon-border)}.list-row.active{border-color:var(--neon-border);box-shadow:0 0 0 1px var(--neon-border) inset}
.list-logo{width:42px;height:32px;display:grid;place-items:center;flex-shrink:0;background:rgba(0,0,0,0.32);border:1px solid var(--neon-border);border-radius:8px;box-shadow:0 0 8px var(--neon-soft);padding:3px}.list-logo img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 0 4px var(--neon-soft))}
.list-info{flex:1}.list-name{font-weight:700;font-size:13.5px}.list-freq{font-size:11px;color:var(--text-secondary)}.list-row.active .list-freq,.list-row:hover .list-freq{color:var(--neon)}
.list-actions{display:flex;align-items:center;gap:8px}.list-play{width:28px;height:28px;border-radius:50%;background:transparent;border:1px solid var(--neon-border);color:var(--neon);display:grid;place-items:center;font-size:10px;transition:all 0.2s}.list-row:hover .list-play{background:var(--neon);color:#000;box-shadow:0 0 10px var(--neon-soft)}
.stations-compact{display:flex;flex-wrap:wrap;gap:8px}.compact-pill{--neon:#00d9ff;--neon-border:rgba(0,217,255,0.28);--neon-soft:rgba(0,217,255,0.12);display:inline-flex;align-items:center;gap:8px;background:rgba(14,20,29,0.6);border:1px solid var(--neon-border);border-radius:100px;padding:6px 14px 6px 8px;cursor:pointer;transition:all 0.22s;font-size:12px;font-weight:600;color:#cbd5e1}
.compact-pill:hover{background:rgba(18,26,38,0.9);border-color:var(--neon);color:#fff;box-shadow:0 0 12px var(--neon-soft);transform:translateY(-1px)}.compact-pill.active{background:var(--neon);color:#000;border-color:var(--neon);box-shadow:0 0 14px var(--neon-soft)}.compact-pill img{width:20px;height:20px;object-fit:contain;background:rgba(0,0,0,0.35);border-radius:50%;padding:3px;border:1px solid var(--neon-border)}

/* PLAYER */
.player-bar{position:fixed;left:12px;right:12px;bottom:12px;max-width:1320px;margin:0 auto;background:rgba(10,15,23,0.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.08);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,0.75);z-index:100;overflow:visible;--player-neon:#00d9ff;--player-neon-soft:rgba(0,217,255,0.15);--player-neon-border:rgba(0,217,255,0.28)}
.rainbow-line{position:absolute;top:0;left:12px;right:12px;height:1px;background:linear-gradient(90deg, transparent, var(--player-neon), transparent);opacity:0;transition:opacity 0.5s}.player-bar.playing .rainbow-line{opacity:0.8}
.player-inner{padding:10px 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.player-left{display:flex;align-items:center;gap:12px;min-width:0}.player-logo{width:42px;height:42px;background:rgba(0,0,0,0.35);border:1px solid var(--player-neon-border);border-radius:10px;display:grid;place-items:center;flex-shrink:0;padding:4px;box-shadow:0 0 10px var(--player-neon-soft);transition:all 0.5s ease;position:relative}
.player-logo::after{content:'';position:absolute;inset:-10px;border-radius:16px;background:var(--player-neon);filter:blur(20px);opacity:0;transition:opacity 0.5s;z-index:-1}.player-bar.playing .player-logo{border-color:var(--player-neon);animation:neonBreathePlayer 2.5s infinite alternate}.player-bar.playing .player-logo::after{opacity:0.16}
@keyframes neonBreathePlayer{0%{box-shadow:0 0 10px var(--player-neon-soft)}100%{box-shadow:0 0 18px var(--player-neon-soft), 0 0 26px var(--player-neon-border)}}
.player-logo img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 0 6px var(--player-neon-soft))}.player-meta{min-width:0}.player-station{font-weight:800;font-size:13.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-live{font-size:10.5px;font-weight:600;color:var(--text-muted);display:flex;align-items:center;gap:7px;margin-top:2px}.p-live-dot{width:5px;height:5px;border-radius:50%;background:var(--text-muted)}.player-bar.playing .p-live-dot{background:#ff3355;box-shadow:0 0 6px #ff3355;animation:pulseDot 1.4s infinite}
.visualizer{display:flex;align-items:flex-end;gap:2.5px;height:14px;padding:2px 5px;background:rgba(0,0,0,0.28);border:1px solid rgba(255,255,255,0.05);border-radius:5px}.vbar{width:2.5px;height:3px;background:var(--text-muted);border-radius:2px;transition:all 0.15s ease}.player-bar.playing .vbar{background:var(--player-neon);box-shadow:0 0 5px var(--player-neon-soft)}
.player-bar.playing .vbar:nth-child(1){animation:waveAnim 0.7s infinite alternate 0.05s}.player-bar.playing .vbar:nth-child(2){animation:waveAnim 0.5s infinite alternate 0.2s}.player-bar.playing .vbar:nth-child(3){animation:waveAnim 0.9s infinite alternate 0.1s}.player-bar.playing .vbar:nth-child(4){animation:waveAnim 0.6s infinite alternate 0.3s}.player-bar.playing .vbar:nth-child(5){animation:waveAnim 0.8s infinite alternate 0.15s}.player-bar.playing .vbar:nth-child(6){animation:waveAnim 0.5s infinite alternate 0.25s}.player-bar.playing .vbar:nth-child(7){animation:waveAnim 0.7s infinite alternate 0s}.player-bar.playing .vbar:nth-child(8){animation:waveAnim 0.6s infinite alternate 0.35s}@keyframes waveAnim{0%{height:3px;opacity:0.4}100%{height:13px;opacity:1}}
.player-center{display:flex;align-items:flex-end;gap:10px;justify-content:center;position:relative;min-width:480px}
.controls-group{display:flex;align-items:center;gap:8px;justify-content:center;z-index:3;padding:0 4px}.ctrl-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:var(--text-primary);transition:all 0.2s;z-index:2}.ctrl-btn:hover{background:rgba(255,255,255,0.08);transform:scale(1.04)}.ctrl-btn.play{width:42px;height:42px;background:#f1f5f9;color:#000;border:none;box-shadow:0 0 12px rgba(255,255,255,0.15)}.player-bar.playing .ctrl-btn.play{background:var(--player-neon);box-shadow:0 0 14px var(--player-neon-soft)}
.dancers-stage{display:flex;align-items:flex-end;gap:5px;height:54px;pointer-events:none;user-select:none;position:relative;opacity:0.9}.dancers-stage::after{content:'';position:absolute;bottom:-4px;left:-8px;right:-8px;height:16px;background:radial-gradient(ellipse at center,var(--glow-color,rgba(0,217,255,0.16)),transparent 70%);filter:blur(6px);opacity:0.35}.dancers-stage.left{--glow-color:rgba(0,217,255,0.18)}.dancers-stage.right{--glow-color:rgba(255,0,170,0.15)}.player-bar.playing .dancers-stage::after{opacity:0.8;animation:floorPulse 0.7s infinite alternate}@keyframes floorPulse{0%{transform:scaleX(0.8);opacity:0.3}100%{transform:scaleX(1.1);opacity:0.8}}
.inflatable-wrapper{width:28px;height:50px;position:relative;transform-origin:bottom center;transition:transform 0.5s cubic-bezier(.34,1.56,.64,1),opacity 0.5s,filter 0.25s;opacity:0.5;transform:scaleY(0.78)}
.inflatable-svg{width:100%;height:100%;overflow:visible}
.neon-cyan{color:#00d9ff;filter:drop-shadow(0 0 4px rgba(0,217,255,0.45))}.neon-pink{color:#ff4dbe;filter:drop-shadow(0 0 4px rgba(255,77,190,0.45))}.neon-lime{color:#8aff4d;filter:drop-shadow(0 0 4px rgba(138,255,77,0.4))}.neon-yellow{color:#ffe066;filter:drop-shadow(0 0 4px rgba(255,224,102,0.4))}.neon-orange{color:#ff8c42;filter:drop-shadow(0 0 4px rgba(255,140,66,0.4))}.neon-violet{color:#b07cff;filter:drop-shadow(0 0 4px rgba(176,124,255,0.4))}
.player-bar.playing .inflatable-wrapper{opacity:1}
.player-bar.playing .dancer-1{animation:danceA 0.7s infinite alternate ease-in-out}.player-bar.playing .dancer-2{animation:danceB 0.66s infinite alternate ease-in-out 0.08s}.player-bar.playing .dancer-3{animation:danceA 0.74s infinite alternate ease-in-out 0.12s}.player-bar.playing .dancer-4{animation:danceB 0.62s infinite alternate ease-in-out 0.16s}.player-bar.playing .dancer-5{animation:danceC 0.68s infinite alternate ease-in-out 0.04s}.player-bar.playing .dancer-6{animation:danceA 0.7s infinite alternate ease-in-out 0.18s}.player-bar.playing .dancer-7{animation:danceB 0.64s infinite alternate ease-in-out 0.22s}.player-bar.playing .dancer-8{animation:danceC 0.72s infinite alternate ease-in-out 0.06s}.player-bar.playing .dancer-9{animation:danceA 0.66s infinite alternate ease-in-out 0.14s}.player-bar.playing .dancer-10{animation:danceB 0.7s infinite alternate ease-in-out 0.1s}
.player-bar.playing .arm{transform-origin:16px 18px}.player-bar.playing .arm-l{animation:armFlail 0.38s infinite alternate ease-in-out}.player-bar.playing .arm-r{animation:armFlailRev 0.42s infinite alternate ease-in-out}
@keyframes danceA{0%{transform:scaleY(0.84) skewX(-10deg) rotate(-6deg) translateY(2px)}100%{transform:scaleY(1.12) skewX(10deg) rotate(7deg) translateY(-2px)}}
@keyframes danceB{0%{transform:scaleY(1.1) skewX(9deg) rotate(6deg)}100%{transform:scaleY(0.86) skewX(-9deg) rotate(-6deg)}}
@keyframes danceC{0%{transform:scaleY(0.9) skewX(-8deg) rotate(-7deg)}100%{transform:scaleY(1.15) skewX(8deg) rotate(7deg)}}
@keyframes armFlail{0%{transform:rotate(-38deg) scaleY(0.85)}100%{transform:rotate(48deg) scaleY(1.1)}}
@keyframes armFlailRev{0%{transform:rotate(42deg) scaleY(1.05)}100%{transform:rotate(-42deg) scaleY(0.9)}}
.inflatable-wrapper.beat{transform:scaleY(1.25) scaleX(0.84) !important;filter:brightness(1.35) drop-shadow(0 0 10px currentColor) !important}
.sparkles{position:absolute;bottom:5px;left:0;right:0;height:32px;pointer-events:none}.sparkles i{position:absolute;bottom:0;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:0}.player-bar.playing .sparkles i{animation:sparkleUp var(--dur,1s) infinite linear}@keyframes sparkleUp{0%{transform:translateY(0) scale(0);opacity:0}15%{opacity:0.7;transform:translateY(-5px) scale(1)}100%{transform:translateY(-38px) translateX(var(--x2,8px)) scale(1.2);opacity:0}}

/* PAC-MAN */
.pacman-world{position:fixed;left:0;right:0;bottom:86px;height:28px;pointer-events:none;z-index:95;overflow:hidden}
.pacman-track{position:absolute;left:0;right:0;top:0;height:100%;display:flex;align-items:center}
.pacman-dots{display:flex;gap:26px;align-items:center;position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding-left:20px}
.pacman-dots i{width:5px;height:5px;background:#fff;border-radius:50%;box-shadow:0 0 6px rgba(255,255,255,0.7), 0 0 12px rgba(255,255,255,0.3);opacity:0.9;flex-shrink:0;transition:opacity 0.2s, transform 0.2s}
.pacman-dots i.eaten{opacity:0;transform:scale(0)}
.pacman-runner{position:absolute;left:-40px;top:50%;transform:translateY(-50%);display:flex;align-items:center;z-index:2;animation:runPac 16s linear infinite}
.pacman-runner.reverse{animation:runPacReverse 22s linear infinite;left:auto;right:-40px}
@keyframes runPac{0%{transform:translateY(-50%) translateX(-60px)}100%{transform:translateY(-50%) translateX(110vw)}}
@keyframes runPacReverse{0%{transform:translateY(-50%) translateX(60px)}100%{transform:translateY(-50%) translateX(-110vw)}}
.pacman{width:26px;height:26px;position:relative;flex-shrink:0;filter:drop-shadow(0 0 8px currentColor)}
.pacman.yellow{color:#ffeb00}
.pacman.pink{color:#ff8abe}
.pacman.cyan{color:#7defff}
.pacman::before,.pacman::after{content:'';position:absolute;left:0;width:100%;height:50%;background:currentColor}
.pacman::before{top:0;border-radius:26px 26px 0 0;transform-origin:50% 100%;animation:pacTop 0.22s ease-in-out infinite alternate}
.pacman::after{bottom:0;border-radius:0 0 26px 26px;transform-origin:50% 0%;animation:pacBottom 0.22s ease-in-out infinite alternate}
.pacman.reverse{transform:scaleX(-1)}
@keyframes pacTop{0%{transform:rotate(-32deg)}100%{transform:rotate(0deg)}}
@keyframes pacBottom{0%{transform:rotate(32deg)}100%{transform:rotate(0deg)}}
.pacman-eye{position:absolute;width:4px;height:4px;background:#000;border-radius:50%;top:6px;left:14px;z-index:3}
.ghost{width:22px;height:22px;background:currentColor;border-radius:11px 11px 3px 3px;position:relative;margin-left:18px;filter:drop-shadow(0 0 6px currentColor);animation:ghostWobble 0.35s ease-in-out infinite alternate}
.ghost::after{content:'';position:absolute;bottom:-6px;left:0;right:0;height:8px;background:currentColor;clip-path:polygon(0% 0%, 20% 100%, 40% 0%, 60% 100%, 80% 0%, 100% 100%, 100% 0%)}
.ghost .eye{position:absolute;top:5px;width:5px;height:7px;background:#fff;border-radius:50%}.ghost .eye::after{content:'';position:absolute;top:3px;left:2px;width:3px;height:3px;background:#0000ff;border-radius:50%}.ghost .eye.left{left:4px}.ghost .eye.right{left:11px}
@keyframes ghostWobble{0%{transform:translateY(-1px)}100%{transform:translateY(1px)}}

function svgFallback(name,neon){const n=neon||getNeon(0);return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='140' height='90' viewBox='0 0 140 90'><rect width='140' height='90' rx='11' fill='#0e141d' stroke='${n.color}' stroke-opacity='0.3' stroke-width='1'/><text x='50%' y='50%' fill='${n.color}' font-family='sans-serif' font-size='12' font-weight='800' text-anchor='middle' dominant-baseline='middle'>${name}</text></svg>`);}
let toastTimer;function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2000);}
function isFav(i){return favorites.includes(i);}function toggleFav(i,e){if(e)e.stopPropagation();const pos=favorites.indexOf(i);if(pos>-1){favorites.splice(pos,1);showToast('Eliminada');}else{favorites.push(i);showToast('Añadida a favoritas');}localStorage.setItem('crg_favs',JSON.stringify(favorites));render();}
function getFilteredStations(){const q=searchInput.value.trim().toLowerCase();return stations.map((s,i)=>({...s,_i:i,neon:getNeon(i)})).filter(s=>{const matches=!q||(s.name.toLowerCase().includes(q)||s.freq.toLowerCase().includes(q));const favOk=!showFavoritesOnly||isFav(s._i);return matches&&favOk;});}
function render(){
const list=getFilteredStations();listMeta.textContent=`${list.length} emisora${list.length!==1?'s':''}${showFavoritesOnly?' • Favoritas':''}`;
if(list.length===0){container.innerHTML=`<div class="empty-state">Sin emisoras.</div>`;return;}
if(viewMode==='grid'){
container.innerHTML=`<div class="stations-grid" id="gridWrap"></div>`;const grid=document.getElementById('gridWrap');
list.forEach(s=>{
const el=document.createElement('div');el.className='station-card'+(s._i===currentIndex?' active':'');el.style.setProperty('--neon',s.neon.color);el.style.setProperty('--neon-border',s.neon.border);el.style.setProperty('--neon-soft',s.neon.soft);el.style.setProperty('--neon-glow',s.neon.glow);
el.innerHTML=`<button class="card-fav-btn ${isFav(s._i)?'is-fav':''}" data-fav="${s._i}"><svg width="13" height="13" viewBox="0 0 24 24" fill="${isFav(s._i)?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 17.3l-6.18 3.25 1.18-6.88L2 8.93l6.91-1L12 1.5l3.09 6.43 6.91 1-5 4.74 1.18 6.88z"/></svg></button><div class="card-logo-wrap"><img src="${s.file}" alt="${s.name}" loading="lazy" onerror="this.onerror=null;this.src='${svgFallback(s.name,s.neon)}'"></div><div class="card-name">${s.name}</div><div class="card-freq">${s.freq}</div>`;
el.addEventListener('click',()=>playStation(s._i));el.querySelector('[data-fav]').addEventListener('click',(e)=>toggleFav(s._i,e));grid.appendChild(el);
});
}else if(viewMode==='list'){
container.innerHTML=`<div class="stations-list" id="listWrap"></div>`;const wrap=document.getElementById('listWrap');
list.forEach(s=>{
const row=document.createElement('div');row.className='list-row'+(s._i===currentIndex?' active':'');row.style.setProperty('--neon',s.neon.color);row.style.setProperty('--neon-border',s.neon.border);row.style.setProperty('--neon-soft',s.neon.soft);row.style.setProperty('--neon-glow',s.neon.glow);
row.innerHTML=`<div class="list-logo"><img src="${s.file}" alt="${s.name}" loading="lazy" onerror="this.onerror=null;this.src='${svgFallback(s.name,s.neon)}'"></div><div class="list-info"><div class="list-name">${s.name}</div><div class="list-freq">${s.freq}</div></div><div class="list-actions"><button class="card-fav-btn ${isFav(s._i)?'is-fav':''}" data-fav="${s._i}" style="position:static">★</button><button class="list-play">▶</button></div>`;
row.addEventListener('click',(e)=>{if(!e.target.closest('[data-fav]'))playStation(s._i);});row.querySelector('.list-play').addEventListener('click',(e)=>{e.stopPropagation();playStation(s._i);});row.querySelector('[data-fav]').addEventListener('click',(e)=>toggleFav(s._i,e));wrap.appendChild(row);
});
}else{
container.innerHTML=`<div class="stations-compact" id="compactWrap"></div>`;const wrap=document.getElementById('compactWrap');
list.forEach(s=>{
const pill=document.createElement('button');pill.className='compact-pill'+(s._i===currentIndex?' active':'');pill.style.setProperty('--neon',s.neon.color);pill.style.setProperty('--neon-border',s.neon.border);pill.style.setProperty('--neon-soft',s.neon.soft);
pill.innerHTML=`<img src="${s.file}" alt="" onerror="this.onerror=null;this.src='${svgFallback(s.name,s.neon)}'"><span>${s.name} <small style="opacity:0.6;margin-left:3px">${s.freq}</small></span>`;
pill.addEventListener('click',()=>playStation(s._i));wrap.appendChild(pill);
});
}
}
function playStation(index,urlTry=0){
if(index<0||index>=stations.length)return;const st=stations[index];const url=st.urls[urlTry];
if(!url){showToast("Sin conexión");playerLiveText.textContent="Error de señal";return;}
const neon=getNeon(index);
currentIndex=index;playerStationName.textContent=`${st.name} — ${st.freq}`;playerLogo.src=st.file;playerLogo.alt=st.name;
playerLogo.onerror=function(){this.onerror=null;this.src=svgFallback(st.name,neon);};
playerBar.style.setProperty('--player-neon',neon.color);playerBar.style.setProperty('--player-neon-soft',neon.soft);playerBar.style.setProperty('--player-neon-border',neon.border);
ambientGlow.style.setProperty('--glow',neon.bg);ambientGlow.style.setProperty('--glow2',neon.bg2);ambientGlow.classList.add('on');
playerLogoWrap.style.borderColor=neon.border;playerLiveText.textContent="Conectando…";render();
if(hlsInstance){try{hlsInstance.destroy();}catch(e){}hlsInstance=null;}audio.pause();
const tryNextUrl=()=>{if(urlTry+1<st.urls.length){playStation(index,urlTry+1);}else{playerLiveText.textContent="Error de señal";showToast("Error con "+st.name);}};
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
if(isIOS||audio.canPlayType('application/vnd.apple.mpegurl')){audio.src=url;audio.load();audio.play().catch(()=>{});return;}
if(window.Hls&&Hls.isSupported()){
hlsInstance=new Hls({enableWorker:true,lowLatencyMode:false,maxBufferLength:isMobile?30:15,maxMaxBufferLength:60,maxBufferSize:30*1000*1000,maxBufferHole:isMobile?1.5:0.5,liveSyncDurationCount:isMobile?5:3,liveMaxLatencyDurationCount:20,manifestLoadingTimeOut:20000,manifestLoadingMaxRetry:4,fragLoadingTimeOut:20000,fragLoadingMaxRetry:6,fragLoadingRetryDelay:1000,xhrSetup:xhr=>{xhr.withCredentials=false;}});
hlsInstance.loadSource(url);hlsInstance.attachMedia(audio);hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{audio.play().catch(()=>{});});hlsInstance.on(Hls.Events.ERROR,(event,data)=>{if(!data.fatal)return;if(data.type===Hls.ErrorTypes.NETWORK_ERROR){hlsInstance.startLoad();return;}if(data.type===Hls.ErrorTypes.MEDIA_ERROR){hlsInstance.recoverMediaError();return;}try{hlsInstance.destroy();}catch(e){}hlsInstance=null;tryNextUrl();});return;}
audio.src=url;audio.load();audio.play().catch(()=>{});
}
function togglePlay(){if(currentIndex===-1){playStation(0);return;}if(audio.paused){audio.play().catch(()=>{});}else{audio.pause();}}
function nextStation(){if(currentIndex===-1){playStation(0);return;}playStation((currentIndex+1)%stations.length);}
function prevStation(){if(currentIndex===-1){playStation(0);return;}playStation((currentIndex-1+stations.length)%stations.length);}
function setVolume(v){audio.volume=v;document.getElementById('volumeRange').value=v;localStorage.setItem('crg_vol',v);}
let beatTimer=null;function createSparkles(){document.querySelectorAll('.sparkles').forEach(c=>{c.innerHTML='';for(let k=0;k<3;k++){const i=document.createElement('i');i.style.left=(15+Math.random()*50)+'%';i.style.setProperty('--x2',(Math.random()*16-8)+'px');i.style.setProperty('--dur',(0.7+Math.random()*0.7)+'s');i.style.animationDelay=(Math.random()*1)+'s';c.appendChild(i);}});}
function startDynamic(){createSparkles();if(beatTimer)clearInterval(beatTimer);beatTimer=setInterval(()=>{const ds=document.querySelectorAll('.inflatable-wrapper');if(!ds.length||!isPlaying)return;const idx=Math.floor(Math.random()*ds.length);const el=ds[idx];el.classList.add('beat');setTimeout(()=>el.classList.remove('beat'),160);},400);}
function stopDynamic(){if(beatTimer)clearInterval(beatTimer);beatTimer=null;}
/* PAC-MAN DOTS + EATING LOGIC */
function initDots(){['dots1','dots2'].forEach(id=>{const cont=document.getElementById(id);if(!cont)return;cont.innerHTML='';for(let i=0;i<36;i++){const dot=document.createElement('i');dot.dataset.x=i*26;cont.appendChild(dot);}});}
function startPacmanEating(){
  const runners=[document.getElementById('runner1'),document.getElementById('runner2')];
  const dotsGroups=[document.getElementById('dots1'),document.getElementById('dots2')];
  let raf;
  function loop(){
    runners.forEach((runner,gi)=>{
      if(!runner) return;
      const rect=runner.getBoundingClientRect();
      const pacX=rect.left + (gi===0? 22 : 0);
      const dots=dotsGroups[gi]?.querySelectorAll('i');
      if(!dots) return;
      dots.forEach(d=>{
        const dr=d.getBoundingClientRect();
        const dotCenter=dr.left + dr.width/2;
        if(!d.classList.contains('eaten')){
          if(gi===0 && dotCenter < pacX + 10 && dotCenter > pacX - 20) d.classList.add('eaten');
          if(gi===1 && dotCenter > pacX - 10 && dotCenter < pacX + 30) d.classList.add('eaten');
        }
      });
      // reset when off screen
      if(gi===0 && rect.left > window.innerWidth + 50){
        dots.forEach(d=>d.classList.remove('eaten'));
      }
      if(gi===1 && rect.right < -50){
        dots.forEach(d=>d.classList.remove('eaten'));
      }
    });
    raf=requestAnimationFrame(loop);
  }
  loop();
}
audio.addEventListener('play',()=>{isPlaying=true;playerBar.classList.add('playing');playIcon.classList.add('hidden');pauseIcon.classList.remove('hidden');playerLiveText.textContent="EN VIVO";render();startDynamic();});
audio.addEventListener('pause',()=>{isPlaying=false;playerBar.classList.remove('playing');pauseIcon.classList.add('hidden');playIcon.classList.remove('hidden');playerLiveText.textContent=currentIndex>=0?"Pausado":"En espera";render();stopDynamic();});
audio.addEventListener('waiting',()=>{playerLiveText.textContent="Cargando…";});audio.addEventListener('playing',()=>{playerLiveText.textContent="EN VIVO";});
document.getElementById('playPauseBtn').addEventListener('click',togglePlay);document.getElementById('nextBtn').addEventListener('click',nextStation);document.getElementById('prevBtn').addEventListener('click',prevStation);
document.getElementById('volumeRange').addEventListener('input',e=>setVolume(parseFloat(e.target.value)));searchInput.addEventListener('input',render);
document.querySelectorAll('.view-btn').forEach(btn=>{btn.addEventListener('click',()=>{viewMode=btn.dataset.view;localStorage.setItem('crg_view',viewMode);document.querySelectorAll('.view-btn').forEach(b=>{b.classList.toggle('active',b===btn);});render();});});
document.getElementById('favToggle').addEventListener('click',function(){showFavoritesOnly=!showFavoritesOnly;this.classList.toggle('on',showFavoritesOnly);render();});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();togglePlay();}});
(function init(){const v=localStorage.getItem('crg_vol');if(v!==null)setVolume(parseFloat(v));else setVolume(1.0);playerLogo.src=svgFallback('CRG',getNeon(0));createSparkles();initDots();startPacmanEating();render();})();
</script>
</body>
</html>
