<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Radios Guatemala</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
<style>
:root{ --bg-top:#0b1118; --bg-bottom:#121c27; --card:rgba(255,255,255,0.05); --card-hover:rgba(255,255,255,0.08); --card-active:rgba(0,229,255,0.07); --border:rgba(255,255,255,0.08); --border-active:#00e5ff; --text:#e6edf3; --muted:#8a98a8; --muted-2:#617081; --red:#ff3b4c; --radius:16px; --glow:0 0 24px rgba(0,229,255,.18),0 0 46px rgba(0,229,255,.07); }
*{box-sizing:border-box;margin:0;padding:0} body{font-family:'Poppins',sans-serif;background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 100%);background-attachment:fixed;color:var(--text);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:48px 24px 140px}.site-header{text-align:center;padding:14px 0 32px}.live-badge{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.16em;color:#ffb8be;background:rgba(255,59,76,.08);border:1px solid rgba(255,59,76,.22);padding:6px 13px;border-radius:100px;margin-bottom:18px}.live-dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px rgba(255,59,76,.65);animation:pulseDot 1.6s infinite} @keyframes pulseDot{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}.site-title{font-size:clamp(28px,5.2vw,56px);font-weight:800;line-height:1.04}.site-title .thin{font-weight:700;color:#dfe7ef;display:block}.site-title .grad{background:linear-gradient(90deg,#00e5ff 0%,#5ef3ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.site-subtitle{margin-top:14px;color:var(--muted);font-size:15px}.controls-bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin:30px 0 24px}.search-wrap{position:relative;flex:1 1 320px;max-width:520px}.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#6d7b8c;width:18px;height:18px}.search-input{width:100%;background:rgba(255,255,255,0.045);border:1px solid var(--border);color:var(--text);border-radius:14px;padding:13px 15px 13px 42px;font-size:14px;outline:none}.view-controls{display:flex;gap:8px;flex-wrap:wrap}.view-btn,.fav-toggle{border:1px solid var(--border);background:rgba(255,255,255,0.035);color:#b8c4d2;font-size:13px;font-weight:600;padding:10px 15px;border-radius:12px}.view-btn.active{border-color:rgba(0,229,255,.45);background:rgba(0,229,255,.085);color:#7cf1ff}.fav-toggle.on{border-color:rgba(255,197,61,.38);background:rgba(255,197,61,.085);color:#ffd272}.list-meta{color:var(--muted-2);font-size:13px;margin:6px 2px 18px}.stations-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px} @media(max-width:1000px){.stations-grid{grid-template-columns:repeat(3,1fr)}} @media(max-width:700px){.stations-grid{grid-template-columns:repeat(2,1fr)}} @media(max-width:450px){.stations-grid{grid-template-columns:1fr}}.station-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;cursor:pointer;position:relative;text-align:center}.station-card.active{border-color:var(--border-active);background:var(--card-active);box-shadow:var(--glow)}.card-logo-wrap{width:132px;height:62px;display:flex;align-items:center;justify-content:center;margin-bottom:9px}.card-logo-wrap img{max-width:100%;max-height:55px;object-fit:contain}.card-name{font-size:13.4px;font-weight:600}.card-freq{font-size:11.8px;color:#78909f}.card-fav-btn{position:absolute;top:9px;right:10px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#6a7988;background:rgba(255,255,255,.025)}.card-fav-btn.is-fav{color:#ffc53d}.stations-list{display:flex;flex-direction:column;gap:10px}.list-row{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 16px;cursor:pointer}.list-row.active{border-color:var(--border-active);background:var(--card-active)}.list-logo{width:52px;height:44px;border-radius:9px;background:rgba(255,255,255,.035);display:grid;place-items:center}.list-logo img{max-width:44px;max-height:34px}.list-info{flex:1}.list-name{font-weight:600}.list-freq{font-size:12.5px;color:#7d8f9f}.list-actions{display:flex;gap:10px;align-items:center}.list-play{width:40px;height:40px;border-radius:50%;background:rgba(0,229,255,.10);color:#7cf2ff;display:grid;place-items:center}.stations-compact{display:flex;flex-wrap:wrap;gap:10px}.compact-pill{display:inline-flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:8px 14px 8px 10px;cursor:pointer;font-size:13.2px;font-weight:600}.compact-pill.active{border-color:var(--border-active);background:var(--card-active);color:#bff8ff}.compact-pill img{width:30px;height:22px;object-fit:contain}.player-bar{position:fixed;left:0;right:0;bottom:0;background:#0f1822;border-top:1px solid rgba(255,255,255,.10);z-index:60}.player-inner{max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}.player-left{display:flex;align-items:center;gap:14px;flex:1;min-width:0}.player-logo{width:52px;height:46px;background:rgba(255,255,255,.045);border-radius:10px;display:grid;place-items:center}.player-logo img{max-width:44px;max-height:34px}.player-station{font-weight:700;font-size:14.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-live{font-size:11.5px;color:#7c8d9d;display:flex;align-items:center;gap:7px}.p-live-dot{width:6px;height:6px;border-radius:50%;background:#4b5563}.player-bar.playing .p-live-dot{background:#ff4356;animation:pulseDot 1.5s infinite}.visualizer{display:flex;align-items:flex-end;gap:3px;height:18px;opacity:.55}.vbar{width:3px;background:#355260;border-radius:3px;height:5px}.player-bar.playing .vbar{background:#00e5ff;animation:vb 0.6s infinite alternate} @keyframes vb{from{height:4px}to{height:16px}}.player-center{display:flex;gap:10px}.ctrl-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.10);color:#b9c7d6}.ctrl-btn.play{width:54px;height:54px;background:linear-gradient(180deg,#00c8ff 0%,#00aadd 100%);color:#06232b}.player-right{display:flex;justify-content:flex-end} input[type=range]{width:124px}.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#132131;border:1px solid rgba(255,255,255,.12);color:#dbe7f1;padding:10px 15px;border-radius:12px;font-size:13px;font-weight:600;z-index:80;opacity:0;transition:.22s;pointer-events:none}.toast.show{opacity:1}.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="site-header"><div class="live-badge"><span class="live-dot"></span> EN VIVO</div><h1 class="site-title"><span class="thin">CENTRAL DE RADIOS</span><span style="background:linear-gradient(90deg,#00e5ff 0%,#5ef3ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent">GUATEMALA</span></h1><p class="site-subtitle">Las emisoras de Guatemala en un solo lugar</p></header>
  <div class="controls-bar"><div class="search-wrap"><input id="searchInput" class="search-input" type="search" placeholder="Buscar emisora..." /></div><div class="view-controls"><button class="view-btn active" data-view="grid">Grid</button><button class="view-btn" data-view="list">Lista</button><button class="view-btn" data-view="compact">Compacto</button><button class="fav-toggle" id="favToggle">★ Favoritas</button></div></div>
  <div class="list-meta" id="listMeta"></div><main id="stationsContainer"></main>
</div>
<div class="player-bar" id="playerBar"><div class="player-inner"><div class="player-left"><div class="player-logo"><img id="playerLogo" alt="" width="44" height="34"/></div><div><div class="player-station" id="playerStationName">Selecciona una emisora</div><div class="player-live"><span class="p-live-dot"></span><span id="playerLiveText">En espera</span></div></div><div class="visualizer"><div class="vbar"></div><div class="vbar"></div><div class="vbar"></div><div class="vbar"></div></div></div><div class="player-center"><button class="ctrl-btn" id="prevBtn">◀</button><button class="ctrl-btn play" id="playPauseBtn"><span id="playIcon">▶</span><span id="pauseIcon" class="hidden">⏸</span></button><button class="ctrl-btn" id="nextBtn">▶</button></div><div class="player-right"><input type="range" id="volumeRange" min="0" max="1" step="0.01" value="1"/></div></div><audio id="audioEl" preload="none" playsinline crossorigin="anonymous"></audio></div>
<div class="toast" id="toast"></div>

<script>
const CDN_NUEVO = "https://d2b5h5wyivfnfl.cloudfront.net";
const CDN_VIEJO = "https://d2qsan2ut81n2k.cloudfront.net";

// LINK REAL DE SONORA - diferente a los demás
const SONORA_URL = "https://d1iowt63cq06qa.cloudfront.net/medialist_14854753276708185244_hls.m3u8";

const stations = [
  { name: "Xtrema", freq: "101.3 FM", file: "xtrema.png", id: "c2cce928-c69c-45d5-bd0a-5a5eba167a0d" },
  { name: "Galaxia", freq: "88.5 FM", file: "galaxia.png", id: "406d6243-a8fc-4215-aca0-ffd43aac2bf3" },
  { name: "Tropicálida", freq: "104.9 FM", file: "tropicalida.png", id: "67aeb080-68fa-4197-89f6-c8bb70f9a395" },
  { name: "Éxitos", freq: "90.9", file: "exitos.png", id: "ca11fca0-0da4-4198-83bd-b50e5607d6f8" },
  { name: "Joya", freq: "92.9 FM", file: "joya.png", id: "e33ed625-2624-4334-a625-a53a70d95791" },
  { name: "Alfa", freq: "97.3 FM", file: "alfa.png", id: "3943e598-9843-4784-9388-80e97aa3674b" },
  { name: "Ranchera", freq: "95.7 FM", file: "ranchera.png", id: "a4e3175d-fa7e-4d4b-979f-e7f875468260" },
  { name: "La Marca", freq: "94.1 FM", file: "lamarca.png", id: "53ee315d-206f-4271-994b-4c1927ae338b" },
  { name: "Fiesta", freq: "103.7 FM", file: "fiesta.png", id: "9c2d6264-2009-49a8-a501-848a7bae1051" },
  { name: "Sonora", freq: "96.9 FM", file: "sonora.png", id: "8e7a8a5b-a2db-4323-8397-46c17f4573ac", customUrl: SONORA_URL },
  { name: "Éxitos Xela", freq: "107.1 FM", file: "exitosx.png", id: "ef0c82f1-e446-4093-8455-3a144ca2e171" },
  { name: "Flix Xela", freq: "93.9", file: "fixx.png", id: "c2af032e-3e29-4551-a757-e4f3d349386c" }
].map(s => {
  // Si tiene customUrl (Sonora), úsalo primero
  if(s.customUrl){
    return {...s, urls: [
      s.customUrl,
      `${CDN_NUEVO}/live/${s.id}/ts:abr.m3u8`,
      `${CDN_VIEJO}/live/${s.id}/ts:abr.m3u8`
    ]};
  }
  return {...s, urls: [
    `${CDN_NUEVO}/live/${s.id}/ts:abr.m3u8`,
    `${CDN_VIEJO}/live/${s.id}/ts:abr.m3u8`
  ]};
});

let currentIndex=-1,isPlaying=false,viewMode=localStorage.getItem('crg_view')||'grid',showFavoritesOnly=false,favorites=JSON.parse(localStorage.getItem('crg_favs')||'[]'),hlsInstance=null;
const audio=document.getElementById('audioEl'),playerBar=document.getElementById('playerBar'),playerStationName=document.getElementById('playerStationName'),playerLogo=document.getElementById('playerLogo'),playerLiveText=document.getElementById('playerLiveText'),playIcon=document.getElementById('playIcon'),pauseIcon=document.getElementById('pauseIcon'),container=document.getElementById('stationsContainer'),searchInput=document.getElementById('searchInput'),listMeta=document.getElementById('listMeta');

function svgFallback(n){return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='180' height='110'><rect width='180' height='110' rx='14' fill='#0f1f2b'/><text x='50%' y='50%' fill='#00e5ff' font-family='Poppins' font-size='14' font-weight='700' text-anchor='middle' dominant-baseline='middle'>${n}</text></svg>`)}
let toastTimer;function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
function isFav(i){return favorites.includes(i)}function toggleFav(i,e){if(e)e.stopPropagation();const p=favorites.indexOf(i);if(p>-1){favorites.splice(p,1)}else{favorites.push(i)}localStorage.setItem('crg_favs',JSON.stringify(favorites));render()}
function getFilteredStations(){const q=searchInput.value.trim().toLowerCase();return stations.map((s,i)=>({...s,_i:i})).filter(s=>{const m=!q||s.name.toLowerCase().includes(q);return m&&(!showFavoritesOnly||isFav(s._i))})}
function render(){const list=getFilteredStations();listMeta.textContent=`${list.length} emisoras`;if(!list.length){container.innerHTML=`<div style="padding:36px;text-align:center;border:1px dashed rgba(255,255,255,.14);border-radius:16px">Sin resultados</div>`;return}container.innerHTML=`<div class="stations-grid" id="gridWrap"></div>`;const g=document.getElementById('gridWrap');list.forEach(s=>{const el=document.createElement('div');el.className='station-card'+(s._i===currentIndex?' active':'');el.innerHTML=`<div class="card-logo-wrap"><img src="${s.file}" alt="${s.name}" onerror="this.src='${svgFallback(s.name)}'"></div><div class="card-name">${s.name}</div><div class="card-freq">${s.freq}</div>`;el.addEventListener('click',()=>playStation(s._i));g.appendChild(el)})}

function playStation(index, urlTry=0){
  if(index<0||index>=stations.length) return;
  const st=stations[index];
  const url=st.urls[urlTry];
  if(!url){playerLiveText.textContent="Fuera del aire";showToast("Sin señal: "+st.name);return;}

  currentIndex=index;
  playerStationName.textContent=`${st.name} — ${st.freq}`;
  playerLogo.src=st.file;
  playerLiveText.textContent=urlTry===0?"Conectando…":`Reintentando ${urlTry+1}…`;
  render();

  if(hlsInstance){try{hlsInstance.destroy()}catch(e){}hlsInstance=null;}
  audio.pause();
  audio.removeAttribute('src');
  try{audio.load()}catch(e){}
  audio.crossOrigin="anonymous";

  const tryNext=()=>{
    if(urlTry+1<st.urls.length) playStation(index, urlTry+1);
    else { playerLiveText.textContent="Fuera del aire"; showToast(st.name+" sin señal"); }
  };

  const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);

  if(isIOS){
    audio.src=url;
    audio.load();
    audio.onerror=tryNext;
    audio.play().catch(()=>{ playerLiveText.textContent="Toca Play"; });
    return;
  }

  if(window.Hls && Hls.isSupported()){
    const hls=new Hls({ enableWorker:true, xhrSetup:x=>x.withCredentials=false });
    hlsInstance=hls;
    hls.loadSource(url);
    hls.attachMedia(audio);
    hls.on(Hls.Events.MEDIA_ATTACHED, ()=>{ audio.play().catch(()=>{}); });
    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ audio.play().catch(()=>{}); });
    hls.on(Hls.Events.ERROR, (ev,data)=>{
      if(!data.fatal) return;
      if(data.type===Hls.ErrorTypes.NETWORK_ERROR){ try{hls.destroy()}catch(e){} hlsInstance=null; tryNext(); }
      else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){ hls.recoverMediaError(); }
      else { try{hls.destroy()}catch(e){} hlsInstance=null; tryNext(); }
    });
    return;
  }
  audio.src=url; audio.onerror=tryNext; audio.load(); audio.play().catch(()=>{});
}

function togglePlay(){if(currentIndex===-1){playStation(0);return}if(audio.paused){audio.play().catch(()=>{})}else{audio.pause()}}
function nextStation(){playStation((currentIndex+1)%stations.length)}
function prevStation(){playStation((currentIndex-1+stations.length)%stations.length)}
function setVolume(v){audio.volume=v;document.getElementById('volumeRange').value=v}

audio.addEventListener('play',()=>{isPlaying=true;playerBar.classList.add('playing');playIcon.classList.add('hidden');pauseIcon.classList.remove('hidden');playerLiveText.textContent="EN VIVO";render()});
audio.addEventListener('pause',()=>{isPlaying=false;playerBar.classList.remove('playing');pauseIcon.classList.add('hidden');playIcon.classList.remove('hidden');});
document.getElementById('playPauseBtn').addEventListener('click',togglePlay);
document.getElementById('nextBtn').addEventListener('click',nextStation);
document.getElementById('prevBtn').addEventListener('click',prevStation);
document.getElementById('volumeRange').addEventListener('input',e=>setVolume(parseFloat(e.target.value)));
searchInput.addEventListener('input',render);
document.querySelectorAll('.view-btn').forEach(b=>b.addEventListener('click',()=>{viewMode=b.dataset.view;localStorage.setItem('crg_view',viewMode);document.querySelectorAll('.view-btn').forEach(x=>x.classList.toggle('active',x===b));render()}));
document.getElementById('favToggle').addEventListener('click',function(){showFavoritesOnly=!showFavoritesOnly;this.classList.toggle('on',showFavoritesOnly);render()});
(function init(){playerLogo.src=svgFallback('CRG');render()})();
</script>
</body>
</html>
