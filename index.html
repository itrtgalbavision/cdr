<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Test Radio Móvil</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
<style>
  body{font-family:'Poppins',sans-serif;background:#111;color:#fafafa;padding:2rem;}
  .radio{cursor:pointer;padding:1rem;background:#222;border-radius:8px;margin-bottom:1rem;}
  .radio.activa{background:#0066ff;}
  .player{position:fixed;bottom:0;left:0;width:100%;background:#222;padding:1rem;display:flex;align-items:center;gap:1rem;}
</style>
</head>
<body>

<div class="radio" id="radioBtn">
  ▶️ Xtrema 101.3 FM
</div>

<div class="player">
  <span id="title">Selecciona una radio</span>
  <button id="playPause">Play / Pause</button>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
</div>

<audio id="audio" playsinline preload="auto"></audio>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
/* ------------------- Variables globales ------------------- */
const audio   = document.getElementById('audio');
const title   = document.getElementById('title');
const btn     = document.getElementById('radioBtn');
const playBtn = document.getElementById('playPause');
const volCtrl = document.getElementById('vol');

let hls = null;                 // <‑‑ ÚNICA instancia
const url = 'https://d2qsan2ut81n2k.cloudfront.net/live/c2cce928-c69c-45d5-bd0a-5a5eba167a0d/ts:abr.m3u8';
const name = 'Xtrema 101.3 FM';

/* ------------------- Configuración HLS ------------------- */
const hlsConfig = {
  maxBufferLength:        30,   // segundos (más margen)
  maxMaxBufferLength:     60,
  liveSyncDurationCount:  5,   // intentamos sincronizar un poco más
  liveMaxLatencyDurationCount: 15
};

/* ------------------- Funciones auxiliares ------------------- */
function initHls() {
  if (Hls.isSupported()) {
    if (hls) hls.destroy();          // destruir instancia previa
    hls = new Hls(hlsConfig);
    hls.loadSource(url);
    hls.attachMedia(audio);
    hls.on(Hls.Events.MANIFEST_PARSED, () => audio.play());
    hls.on(Hls.Events.ERROR, (e, data) => {
      console.warn('HLS error → fallback', data);
      if (data.fatal) {
        hls.destroy();
        audio.src = url;                  // fallback nativo
        audio.play();
      }
    });
  } else {
    // Navegadores que soportan HLS nativamente (Safari, algunos Android)
    audio.src = url;
    audio.play();
  }
}

/* ------------------- Eventos UI ------------------- */
btn.addEventListener('click', () => {
  btn.classList.toggle('activa');
  title.textContent = name;
  initHls();                     // ← solo se llama una vez
});

playBtn.addEventListener('click', () => {
  if (audio.paused) audio.play(); else audio.pause();
});

volCtrl.addEventListener('input', e => audio.volume = e.target.value);

/* ------------------- Depuración (opc.) ------------------- */
audio.addEventListener('waiting', () => console.log('🔄 waiting – buffer bajo'));
audio.addEventListener('stalled', () => console.log('⏸ stalled – red lenta'));
audio.addEventListener('error', e => console.error('❗ audio error', e));
</script>
</body>
</html>
