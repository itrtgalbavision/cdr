<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Radios Guatemala</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00e5ff;
            --primary-dark: #00bfff;
            --bg-dark: #080c12;
            --card-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        *{box-sizing:border-box;}
        body{
            margin:0;
            font-family:'Poppins',sans-serif;
            background: radial-gradient(circle at top, #121c27 0%, #080c12 100%);
            color:white;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 50px 20px 30px;
        }
        .badge-en-vivo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.3);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ff3366;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .punto-rojo {
            width: 8px; height: 8px;
            background-color: #ff3366;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff3366;
            animation: latido 1.5s infinite;
        }

        @keyframes latido {
            0% { transform: scale(0.9); opacity: 1; }
            70% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(0.9); opacity: 0; }
        }

        .header h1 { margin: 0; font-size: clamp(24px, 5vw, 40px); font-weight: 800; color: #f0f0f0; }
        .header h1 span {
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* GRID DE RADIOS */
        .contenedor {
            width: 90%; max-width: 1100px;
            margin: 20px auto 120px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .radio {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .radio:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.15);
        }

        .radio img {
            width: 80px; height: 80px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
            transition: transform 0.3s;
        }

        .radio:hover img { transform: scale(1.1); }

        .radio span {
            font-size: 14px;
            font-weight: 500;
            color: #efefef;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Efecto Activa */
        .radio.activa {
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid var(--primary);
        }

        /* REPRODUCTOR FLOTANTE */
        .player {
            position: fixed;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            width: 95%; max-width: 800px;
            background: rgba(15, 24, 34, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 10px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .player-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        .player-info img {
            width: 50px; height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            display: none; /* Se muestra al elegir radio */
        }

        .player-title { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

        .controls { display: flex; align-items: center; gap: 20px; }

        .btn-play {
            width: 45px; height: 45px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .btn-play:hover { transform: scale(1.1); background: #fff; }
        .btn-play svg { fill: #000; width: 20px; }

        .volume-container { display: flex; align-items: center; gap: 10px; }
        .volume { 
            cursor: pointer; 
            accent-color: var(--primary); 
            width: 80px;
        }

        /* Animación de Ondas (Solo visual) */
        .playing-animation {
            display: none;
            align-items: flex-end;
            gap: 3px;
            height: 15px;
            margin-top: 10px;
        }
        .radio.activa .playing-animation { display: flex; }
        .bar {
            width: 3px;
            background: var(--primary);
            animation: music-bar 0.5s infinite alternate;
        }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }

        @keyframes music-bar {
            0% { height: 2px; }
            100% { height: 15px; }
        }

        @media(max-width: 600px) {
            .player { border-radius: 20px; bottom: 10px; padding: 10px 15px; }
            .volume-container { display: none; }
            .player-title { max-width: 120px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge-en-vivo">
            <span class="punto-rojo"></span> En Vivo ahora
        </div>
        <h1>CENTRAL DE RADIOS <span>GUATEMALA</span></h1>
    </div>

    <div class="contenedor" id="gridRadios">
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/c2cce928-c69c-45d5-bd0a-5a5eba167a0d/ts:abr.m3u8','Xtrema 101.3 FM','https://static.onlineradiobox.com/img/l/8/16408.v8.png')">
            <img src="https://static.onlineradiobox.com/img/l/8/16408.v8.png">
            <span>Xtrema 101.3 FM</span>
            <div class="playing-animation"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>
        
        <div class="radio" onclick="playRadio(this,'https://d2qsan2ut81n2k.cloudfront.net/live/406d6243-a8fc-4215-aca0-ffd43aac2bf3/ts:abr.m3u8','Galaxia 88.5 FM','https://galaxia.com.gt/wp-content/uploads/2021/04/Logo-Galaxia-88.5-FM.png')">
            <img src="https://galaxia.com.gt/wp-content/uploads/2021/04/Logo-Galaxia-88.5-FM.png">
            <span>Galaxia 88.5 FM</span>
            <div class="playing-animation"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>

        </div>

    <div class="player">
        <div class="player-info">
            <img id="playerLogo" src="" alt="">
            <div class="player-title" id="playerTitle">Selecciona una emisora</div>
        </div>
        <div class="controls">
            <div class="volume-container">
                <input class="volume" type="range" min="0" max="1" step="0.01" value="1.0" oninput="setVolume(this.value)">
            </div>
            <button class="btn-play" onclick="togglePlay()" id="btnMain">
                <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>
    </div>

    <audio id="audio" playsinline></audio>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        let audio = document.getElementById("audio");
        let title = document.getElementById("playerTitle");
        let logo = document.getElementById("playerLogo");
        let btnIcon = document.getElementById("playIcon");
        let hlsInstancia = null;

        function playRadio(el, url, name, img) {
            // UI Update
            document.querySelectorAll(".radio").forEach(r => r.classList.remove("activa"));
            el.classList.add("activa");
            title.innerText = name;
            logo.src = img;
            logo.style.display = "block";
            
            updatePlayIcon(false);

            if (Hls.isSupported()) {
                if (hlsInstancia) hlsInstancia.destroy();
                hlsInstancia = new Hls();
                hlsInstancia.loadSource(url);
                hlsInstancia.attachMedia(audio);
                hlsInstancia.on(Hls.Events.MANIFEST_PARSED, () => audio.play());
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = url;
                audio.play();
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                updatePlayIcon(false);
            } else {
                audio.pause();
                updatePlayIcon(true);
            }
        }

        function updatePlayIcon(isPaused) {
            // Cambia el icono de Play a Pause (SVG Path)
            btnIcon.innerHTML = isPaused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }

        function setVolume(v) { audio.volume = v; }
    </script>
</body>
</html>
