<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Radios — GT</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>

<style>

/* =========================================================
   FUTURISTIC RADIO UI
   ========================================================= */

:root{
    --bg:#03070c;
    --bg2:#071019;
    --panel:rgba(9,18,28,.72);
    --panel2:rgba(12,23,35,.82);

    --line:rgba(255,255,255,.075);
    --line2:rgba(0,220,255,.20);

    --text:#f5f9ff;
    --muted:#8294a8;
    --dim:#506174;

    --cyan:#00d9ff;
    --cyan2:#00a8ff;

    --radius:18px;

    --font:'Inter',system-ui,sans-serif;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -20%,rgba(0,217,255,.10),transparent 38%),
        radial-gradient(circle at 100% 100%,rgba(90,50,255,.08),transparent 32%),
        var(--bg);
}

body{
    font-family:var(--font);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
}

/* =========================================================
   BACKGROUND
   ========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-2;

    background-image:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);

    background-size:50px 50px;

    mask-image:linear-gradient(to bottom,black,transparent 85%);
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;

    background:
        radial-gradient(circle at 20% 30%,rgba(0,217,255,.035),transparent 25%),
        radial-gradient(circle at 80% 70%,rgba(125,70,255,.035),transparent 25%);
}

/* =========================================================
   AMBIENT GLOW
   ========================================================= */

#ambientGlow{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;

    opacity:0;
    transition:opacity .8s ease;

    background:
        radial-gradient(
            650px 420px at 50% -5%,
            var(--glow,rgba(0,217,255,.13)),
            transparent 70%
        ),
        radial-gradient(
            800px 600px at 100% 100%,
            var(--glow2,rgba(120,50,255,.06)),
            transparent 60%
        );

    filter:blur(24px);
}

#ambientGlow.on{
    opacity:1;
}

/* =========================================================
   MAIN WRAPPER
   ========================================================= */

.wrap{
    width:min(1400px,100%);
    margin:auto;
    padding:42px 28px 180px;
}

/* =========================================================
   HEADER
   ========================================================= */

.site-header{
    position:relative;
    text-align:center;
    margin-bottom:38px;
}

.site-header::before{
    content:"";
    position:absolute;
    width:260px;
    height:1px;
    left:50%;
    bottom:-18px;
    transform:translateX(-50%);

    background:linear-gradient(
        90deg,
        transparent,
        var(--cyan),
        transparent
    );

    opacity:.5;
}

.header-badges{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-bottom:15px;
}

/* LIVE */

.live-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:7px 14px;

    border:1px solid rgba(255,60,90,.22);
    border-radius:100px;

    background:rgba(255,40,70,.055);

    color:#ff7187;

    font-size:9px;
    font-weight:800;
    letter-spacing:.20em;

    box-shadow:
        0 0 20px rgba(255,40,70,.04),
        inset 0 0 15px rgba(255,40,70,.03);
}

.live-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff3657;

    box-shadow:
        0 0 8px #ff3657,
        0 0 18px rgba(255,54,87,.55);

    animation:pulseDot 1.4s infinite;
}

@keyframes pulseDot{
    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.35;
        transform:scale(.72);
    }
}

/* TITLE */

.site-title{
    font-size:clamp(34px,5vw,64px);
    line-height:1;
    font-weight:900;
    letter-spacing:-.055em;
    text-transform:uppercase;
}

.site-title .thin{
    display:block;

    color:#627487;

    font-size:.27em;
    font-weight:700;

    letter-spacing:.42em;

    margin-bottom:10px;
}

.site-title .grad{
    background:
        linear-gradient(
            100deg,
            #fff 0%,
            #dffaff 35%,
            #66e8ff 65%,
            #00bfff 100%
        );

    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;

    filter:drop-shadow(0 0 20px rgba(0,217,255,.14));
}

.site-subtitle{
    margin-top:13px;

    color:#617487;

    font-size:11px;
    font-weight:600;

    letter-spacing:.18em;
    text-transform:uppercase;
}

/* =========================================================
   CONTROLS
   ========================================================= */

.controls-bar{
    display:flex;
    align-items:center;
    gap:12px;

    margin-bottom:25px;

    padding:9px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.012)
        );

    border:1px solid var(--line);

    border-radius:16px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.035);

    backdrop-filter:blur(18px);
}

.search-wrap{
    position:relative;
    flex:1;
}

.search-wrap svg{
    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    width:16px;
    height:16px;

    color:#53677a;
}

.search-input{
    width:100%;

    height:42px;

    padding:0 15px 0 42px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.055);

    outline:none;

    background:rgba(0,0,0,.25);

    color:#fff;

    font-family:inherit;
    font-size:12px;

    transition:.25s;
}

.search-input::placeholder{
    color:#526477;
}

.search-input:focus{
    border-color:rgba(0,217,255,.38);

    background:rgba(0,15,25,.55);

    box-shadow:
        0 0 0 3px rgba(0,217,255,.06),
        0 0 20px rgba(0,217,255,.06);
}

/* VIEW BUTTONS */

.view-controls{
    display:flex;
    gap:5px;
}

.view-btn,
.fav-toggle{
    height:38px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.06);

    background:rgba(255,255,255,.025);

    color:#718398;

    padding:0 14px;

    font-family:inherit;

    font-size:10px;
    font-weight:700;

    letter-spacing:.04em;

    cursor:pointer;

    transition:.25s;
}

.view-btn:hover,
.fav-toggle:hover{
    color:#d8f8ff;

    border-color:rgba(0,217,255,.18);

    background:rgba(0,217,255,.04);
}

.view-btn.active{
    color:#00dcff;

    border-color:rgba(0,217,255,.28);

    background:
        linear-gradient(
            180deg,
            rgba(0,217,255,.12),
            rgba(0,217,255,.045)
        );

    box-shadow:
        0 0 18px rgba(0,217,255,.06),
        inset 0 0 15px rgba(0,217,255,.03);
}

.fav-toggle.on{
    color:#ffd66b;

    border-color:rgba(255,190,50,.25);

    background:rgba(255,190,50,.06);
}

/* =========================================================
   META
   ========================================================= */

.list-meta{
    margin:0 0 13px 5px;

    color:#53667a;

    font-size:9px;
    font-weight:800;

    letter-spacing:.15em;

    text-transform:uppercase;
}

/* =========================================================
   STATIONS GRID
   ========================================================= */

.stations-grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(210px,1fr)
        );

    gap:15px;
}

/* CARD */

.station-card{
    --neon:#00d9ff;
    --neon-border:rgba(0,217,255,.28);
    --neon-soft:rgba(0,217,255,.10);

    position:relative;

    height:164px;

    padding:15px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    overflow:hidden;

    border-radius:17px;

    border:1px solid rgba(255,255,255,.065);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012) 45%,
            rgba(0,0,0,.22)
        );

    box-shadow:
        0 15px 35px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.025);

    backdrop-filter:blur(16px);

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}

.station-card::before{
    content:"";

    position:absolute;

    top:0;
    left:18%;
    right:18%;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--neon),
            transparent
        );

    opacity:.15;

    transition:.3s;
}

.station-card::after{
    content:"";

    position:absolute;

    width:100px;
    height:100px;

    left:50%;
    top:30px;

    transform:translateX(-50%);

    background:var(--neon);

    filter:blur(60px);

    opacity:0;

    transition:.35s;

    pointer-events:none;
}

.station-card:hover{
    transform:translateY(-5px);

    border-color:var(--neon-border);

    box-shadow:
        0 20px 45px rgba(0,0,0,.35),
        0 0 30px var(--neon-soft),
        inset 0 1px 0 rgba(255,255,255,.05);
}

.station-card:hover::before{
    opacity:.8;
}

.station-card:hover::after{
    opacity:.08;
}

.station-card.active{
    border-color:var(--neon-border);

    box-shadow:
        0 0 0 1px var(--neon-border) inset,
        0 0 35px var(--neon-soft),
        0 20px 45px rgba(0,0,0,.35);
}

.station-card.active::before{
    opacity:1;
}

/* LOGO */

.card-logo-wrap{
    position:relative;

    width:100%;
    height:80px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:12px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            rgba(0,0,0,.25)
        );

    border:1px solid var(--neon-border);

    overflow:hidden;

    transition:.35s;
}

.card-logo-wrap::before{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            115deg,
            transparent 30%,
            rgba(255,255,255,.045) 50%,
            transparent 70%
        );

    transform:translateX(-100%);

    transition:.6s;
}

.station-card:hover .card-logo-wrap::before{
    transform:translateX(100%);
}

.card-logo-wrap img{
    max-width:70%;
    max-height:72%;

    object-fit:contain;

    filter:
        drop-shadow(0 0 7px var(--neon-soft))
        brightness(1.05);

    transition:.35s;
}

.station-card:hover .card-logo-wrap img{
    transform:scale(1.06);
}

.station-card.active .card-logo-wrap{
    box-shadow:
        0 0 18px var(--neon-soft),
        inset 0 0 20px rgba(0,0,0,.18);
}

/* NAME */

.card-name{
    font-size:13px;

    font-weight:800;

    color:#edf5fc;

    text-align:center;

    letter-spacing:-.01em;
}

.card-freq{
    margin-top:4px;

    font-size:9px;

    font-weight:700;

    color:#65778a;

    letter-spacing:.08em;
}

.station-card:hover .card-freq,
.station-card.active .card-freq{
    color:var(--neon);
}

/* FAVORITE */

.card-fav-btn{
    position:absolute;

    top:10px;
    right:10px;

    width:27px;
    height:27px;

    display:grid;
    place-items:center;

    border-radius:8px;

    border:1px solid rgba(255,255,255,.055);

    background:rgba(0,0,0,.18);

    color:#4e6073;

    cursor:pointer;

    z-index:5;

    transition:.2s;
}

.card-fav-btn:hover{
    color:#ffd45c;

    border-color:rgba(255,210,80,.22);

    background:rgba(255,210,80,.06);
}

.card-fav-btn.is-fav{
    color:#ffd45c;

    background:rgba(255,210,80,.07);
}

/* =========================================================
   LIST VIEW
   ========================================================= */

.stations-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.list-row{
    --neon:#00d9ff;
    --neon-border:rgba(0,217,255,.28);

    position:relative;

    display:flex;
    align-items:center;

    gap:14px;

    min-height:62px;

    padding:9px 13px;

    cursor:pointer;

    border-radius:13px;

    border:1px solid rgba(255,255,255,.055);

    background:rgba(9,18,28,.65);

    transition:.25s;
}

.list-row:hover,
.list-row.active{
    border-color:var(--neon-border);

    background:
        linear-gradient(
            90deg,
            rgba(0,217,255,.055),
            rgba(255,255,255,.012)
        );

    box-shadow:0 0 25px rgba(0,0,0,.20);
}

.list-logo{
    width:54px;
    height:42px;

    display:grid;
    place-items:center;

    flex-shrink:0;

    padding:5px;

    border-radius:9px;

    background:rgba(0,0,0,.25);

    border:1px solid var(--neon-border);
}

.list-logo img{
    max-width:100%;
    max-height:100%;

    object-fit:contain;
}

.list-info{
    flex:1;
}

.list-name{
    font-size:13px;
    font-weight:800;
}

.list-freq{
    margin-top:3px;

    font-size:10px;
    color:#6c7f92;
}

.list-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.list-play{
    width:34px;
    height:34px;

    display:grid;
    place-items:center;

    border-radius:50%;

    border:1px solid var(--neon-border);

    color:var(--neon);

    background:rgba(0,0,0,.2);

    cursor:pointer;

    transition:.2s;
}

.list-play:hover{
    background:var(--neon);
    color:#000;

    box-shadow:0 0 18px var(--neon);
}

/* =========================================================
   COMPACT
   ========================================================= */

.stations-compact{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.compact-pill{
    --neon:#00d9ff;
    --neon-border:rgba(0,217,255,.28);

    display:inline-flex;
    align-items:center;
    gap:9px;

    padding:7px 14px 7px 8px;

    border-radius:100px;

    border:1px solid var(--neon-border);

    background:rgba(10,19,29,.65);

    color:#c8d4df;

    cursor:pointer;

    font-family:inherit;

    font-size:11px;
    font-weight:700;

    transition:.2s;
}

.compact-pill:hover{
    transform:translateY(-2px);

    color:#fff;

    box-shadow:0 0 18px rgba(0,217,255,.08);
}

.compact-pill.active{
    background:var(--neon);
    color:#000;
}

/* =========================================================
   FUTURISTIC PLAYER
   ========================================================= */

.player-bar{
    position:fixed;

    left:18px;
    right:18px;
    bottom:18px;

    width:min(1380px,calc(100% - 36px));

    margin:auto;

    z-index:100;

    --player-neon:#00d9ff;
    --player-neon-soft:rgba(0,217,255,.16);
    --player-neon-border:rgba(0,217,255,.30);

    border-radius:20px;

    border:1px solid rgba(255,255,255,.10);

    background:
        linear-gradient(
            135deg,
            rgba(10,20,31,.96),
            rgba(4,10,17,.97)
        );

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.72),
        0 0 0 1px rgba(255,255,255,.025) inset,
        0 0 50px var(--player-neon-soft);

    overflow:hidden;
}

/* TOP LINE */

.rainbow-line{
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--player-neon),
            #7a5cff,
            var(--player-neon),
            transparent
        );

    background-size:200% 100%;

    opacity:.75;
}

.player-bar.playing .rainbow-line{
    animation:playerLine 3s linear infinite;
}

@keyframes playerLine{
    from{
        background-position:0 0;
    }

    to{
        background-position:200% 0;
    }
}

/* PLAYER INNER */

.player-inner{
    min-height:88px;

    padding:12px 17px;

    display:grid;

    grid-template-columns:1fr auto 1fr;

    align-items:center;

    gap:20px;
}

/* LEFT */

.player-left{
    display:flex;
    align-items:center;
    gap:13px;

    min-width:0;
}

.player-logo{
    position:relative;

    width:54px;
    height:54px;

    flex-shrink:0;

    display:grid;
    place-items:center;

    padding:7px;

    border-radius:14px;

    border:1px solid var(--player-neon);

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.07),
            rgba(0,0,0,.5)
        );

    box-shadow:
        0 0 20px var(--player-neon-soft),
        inset 0 0 15px rgba(0,0,0,.5);

    transition:.4s;
}

.player-logo::before{
    content:"";

    position:absolute;

    inset:-5px;

    border-radius:17px;

    border:1px solid var(--player-neon);

    opacity:.12;
}

.player-bar.playing .player-logo{
    box-shadow:
        0 0 25px var(--player-neon-soft),
        0 0 45px var(--player-neon-soft),
        inset 0 0 15px rgba(0,0,0,.5);
}

.player-logo img{
    max-width:100%;
    max-height:100%;

    object-fit:contain;

    filter:
        drop-shadow(0 0 8px var(--player-neon-soft))
        brightness(1.12);
}

.player-meta{
    min-width:0;
}

.player-station{
    max-width:310px;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;

    font-size:14px;
    font-weight:800;

    color:#fff;
}

.player-live{
    display:flex;
    align-items:center;

    gap:7px;

    margin-top:5px;

    color:#65788c;

    font-size:9px;
    font-weight:800;

    letter-spacing:.10em;
}

.p-live-dot{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#536477;
}

.player-bar.playing .p-live-dot{
    background:#ff3b5b;

    box-shadow:0 0 8px #ff3b5b;

    animation:pulseDot 1.4s infinite;
}

/* =========================================================
   VISUALIZER
   ========================================================= */

.visualizer{
    height:22px;

    display:flex;
    align-items:flex-end;

    gap:3px;

    margin-left:5px;

    padding:4px 7px;

    border-radius:6px;

    background:rgba(0,0,0,.25);

    border:1px solid rgba(255,255,255,.045);
}

.vbar{
    width:3px;
    height:4px;

    border-radius:3px;

    background:#435468;

    transition:.15s;
}

.player-bar.playing .vbar{
    background:var(--player-neon);

    box-shadow:0 0 6px var(--player-neon-soft);
}

.player-bar.playing .vbar:nth-child(1){
    animation:wave .65s infinite alternate;
}

.player-bar.playing .vbar:nth-child(2){
    animation:wave .48s infinite alternate .15s;
}

.player-bar.playing .vbar:nth-child(3){
    animation:wave .75s infinite alternate .1s;
}

.player-bar.playing .vbar:nth-child(4){
    animation:wave .55s infinite alternate .22s;
}

.player-bar.playing .vbar:nth-child(5){
    animation:wave .7s infinite alternate .05s;
}

.player-bar.playing .vbar:nth-child(6){
    animation:wave .5s infinite alternate .18s;
}

.player-bar.playing .vbar:nth-child(7){
    animation:wave .65s infinite alternate .1s;
}

.player-bar.playing .vbar:nth-child(8){
    animation:wave .55s infinite alternate .25s;
}

@keyframes wave{
    from{
        height:4px;
        opacity:.35;
    }

    to{
        height:16px;
        opacity:1;
    }
}

/* =========================================================
   CONTROLS
   ========================================================= */

.player-center{
    display:flex;
    justify-content:center;
    align-items:center;
}

.controls-group{
    display:flex;
    align-items:center;
    gap:8px;

    padding:6px;

    border-radius:100px;

    border:1px solid rgba(255,255,255,.07);

    background:rgba(0,0,0,.28);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04),
        0 8px 20px rgba(0,0,0,.25);
}

.ctrl-btn{
    width:35px;
    height:35px;

    display:grid;
    place-items:center;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.035);

    color:#d6e2eb;

    cursor:pointer;

    transition:.22s;
}

.ctrl-btn:hover{
    transform:scale(1.08);

    color:#fff;

    border-color:rgba(255,255,255,.18);

    background:rgba(255,255,255,.09);
}

.ctrl-btn.play{
    width:49px;
    height:49px;

    border:none;

    color:#001018;

    background:var(--player-neon);

    box-shadow:
        0 0 20px var(--player-neon-soft),
        0 0 45px var(--player-neon-soft);

    animation:playPulse 1.7s ease-in-out infinite alternate;
}

@keyframes playPulse{
    from{
        box-shadow:
            0 0 15px var(--player-neon-soft),
            0 0 30px var(--player-neon-soft);
    }

    to{
        box-shadow:
            0 0 25px var(--player-neon-soft),
            0 0 55px var(--player-neon-soft);
    }
}

/* =========================================================
   RIGHT / VOLUME
   ========================================================= */

.player-right{
    display:flex;

    justify-content:flex-end;
    align-items:center;
}

.vol-wrap{
    display:flex;
    align-items:center;

    padding:5px 9px 5px 5px;

    border-radius:100px;

    border:1px solid var(--player-neon-border);

    background:rgba(0,0,0,.28);

    box-shadow:
        0 0 20px var(--player-neon-soft),
        inset 0 1px 0 rgba(255,255,255,.04);
}

.vol-icon-btn{
    width:35px;
    height:35px;

    display:grid;
    place-items:center;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.07);

    background:rgba(255,255,255,.045);

    color:var(--player-neon);

    cursor:pointer;

    transition:.25s;
}

.vol-icon-btn:hover{
    color:#000;

    background:var(--player-neon);

    box-shadow:0 0 18px var(--player-neon-soft);
}

.vol-icon-btn.muted{
    color:#ff6262;

    background:rgba(255,70,70,.08);
}

.vol-slider-wrap{
    display:flex;
    align-items:center;

    gap:10px;

    margin-left:10px;

    width:125px;
}

.vol-track{
    width:84px;
    height:4px;

    border-radius:5px;

    appearance:none;
    -webkit-appearance:none;

    outline:none;

    cursor:pointer;

    background:
        linear-gradient(
            to right,
            var(--player-neon) 0%,
            var(--player-neon) var(--vol-p,100%),
            rgba(255,255,255,.10) var(--vol-p,100%),
            rgba(255,255,255,.10) 100%
        );
}

.vol-track::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;

    width:14px;
    height:14px;

    border-radius:50%;

    border:2px solid #071019;

    background:var(--player-neon);

    box-shadow:
        0 0 0 1px var(--player-neon-border),
        0 0 10px var(--player-neon);

    cursor:pointer;
}

.vol-pct{
    min-width:32px;

    color:var(--player-neon);

    font-size:9px;
    font-weight:800;

    text-align:right;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:125px;

    transform:translateX(-50%) translateY(10px);

    z-index:120;

    padding:9px 16px;

    border-radius:100px;

    border:1px solid rgba(255,255,255,.10);

    background:rgba(8,15,24,.94);

    color:#fff;

    font-size:10px;
    font-weight:700;

    box-shadow:0 15px 40px rgba(0,0,0,.5);

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.toast.show{
    opacity:1;

    transform:translateX(-50%) translateY(0);
}

/* =========================================================
   EMPTY
   ========================================================= */

.empty-state{
    padding:55px 20px;

    text-align:center;

    color:#65778a;

    border:1px dashed rgba(255,255,255,.08);

    border-radius:16px;

    background:rgba(255,255,255,.015);

    font-size:12px;
}

/* =========================================================
   UTILITIES
   ========================================================= */

.hidden{
    display:none !important;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:1050px){

    .player-inner{
        grid-template-columns:1fr auto;
    }

    .player-center{
        grid-column:2;
        grid-row:1;
    }

    .player-right{
        display:none;
    }

}

@media(max-width:760px){

    .wrap{
        padding:
            30px
            15px
            180px;
    }

    .controls-bar{
        flex-direction:column;
        align-items:stretch;
    }

    .view-controls{
        width:100%;
    }

    .view-btn,
    .fav-toggle{
        flex:1;
        padding:0 8px;
    }

    .stations-grid{
        grid-template-columns:
            repeat(
                auto-fill,
                minmax(155px,1fr)
            );

        gap:10px;
    }

    .station-card{
        height:145px;
    }

    .card-logo-wrap{
        height:65px;
    }

    .player-bar{
        left:8px;
        right:8px;
        bottom:8px;

        width:calc(100% - 16px);

        border-radius:16px;
    }

    .player-inner{
        grid-template-columns:1fr auto;

        padding:10px;
    }

    .player-center{
        grid-column:2;
    }

    .player-station{
        max-width:180px;
    }

    .visualizer{
        display:none;
    }

}

@media(max-width:480px){

    .site-title{
        font-size:35px;
    }

    .site-title .thin{
        letter-spacing:.25em;
    }

    .stations-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .station-card{
        height:140px;
        padding:10px;
    }

    .card-logo-wrap{
        height:62px;
        margin-bottom:8px;
    }

    .card-name{
        font-size:11px;
    }

    .card-freq{
        font-size:8px;
    }

    .player-left{
        gap:9px;
    }

    .player-logo{
        width:44px;
        height:44px;
    }

    .player-station{
        max-width:135px;
        font-size:11px;
    }

    .player-live{
        font-size:8px;
    }

    .ctrl-btn{
        width:30px;
        height:30px;
    }

    .ctrl-btn.play{
        width:42px;
        height:42px;
    }

}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }

}

<script>

/* =========================================================

];


/* =========================================================
   NEON PALETTE
   ========================================================= */

const NEON_PALETTE = [

    {
        color:'#00d9ff',
        border:'rgba(0,217,255,.28)',
        soft:'rgba(0,217,255,.12)',
        glow:'rgba(0,217,255,.5)',

    },

    {

        soft:'rgba(138,255,77,.12)',

    },

    {
        color:'#ff8c42',
        border:'rgba(255,140,66,.28)',
        soft:'rgba(255,140,66,.12)',
        glow:'rgba(255,140,66,.45)',
        bg:'rgba(255,140,66,.12)',
        bg2:'rgba(255,140,66,.05)'
    },

    {
        color:'#b07cff',
        border:'rgba(176,124,255,.28)',
        soft:'rgba(176,124,255,.12)',
        glow:'rgba(176,124,255,.45)',
        bg:'rgba(176,124,255,.12)',
        bg2:'rgba(176,124,255,.05)'
    }

];

function getNeon(i){
    return NEON_PALETTE[i % NEON_PALETTE.length];
}


/* =========================================================
   VARIABLES
   ========================================================= */

let currentIndex=-1;

let isPlaying=false;

let viewMode=
    localStorage.getItem('crg_view') || 'grid';

let showFavoritesOnly=false;

let favorites=
    JSON.parse(
        localStorage.getItem('crg_favs') || '[]'
    );

let hlsInstance=null;

let prevVol=1;


/* =========================================================
   ELEMENTS
   ========================================================= */

const audio=
    document.getElementById('audioEl');

const playerBar=
    document.getElementById('playerBar');

const playerStationName=
    document.getElementById('playerStationName');

const playerLogo=
    document.getElementById('playerLogo');

const playerLogoWrap=
    document.getElementById('playerLogoWrap');

const playerLiveText=
    document.getElementById('playerLiveText');

const playIcon=
    document.getElementById('playIcon');

const pauseIcon=
    document.getElementById('pauseIcon');

const container=
    document.getElementById('stationsContainer');

const searchInput=
    document.getElementById('searchInput');

const listMeta=
    document.getElementById('listMeta');

const ambientGlow=
    document.getElementById('ambientGlow');

const volIconBtn=
    document.getElementById('volIconBtn');

const volIconHigh=
    document.getElementById('volIconHigh');

const volIconMuted=
    document.getElementById('volIconMuted');

const volPct=
    document.getElementById('volPct');

const volumeRange=
    document.getElementById('volumeRange');


/* =========================================================
   FALLBACK LOGO
   ========================================================= */

function svgFallback(name,neon){

    const n=neon || getNeon(0);

    return "data:image/svg+xml;charset=utf-8,"+
        encodeURIComponent(`

        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="180"
            height="100"
            viewBox="0 0 180 100">

            <rect
                width="180"
                height="100"
                rx="12"
                fill="#071019"
                stroke="${n.color}"
                stroke-opacity=".35"/>

            <text
                x="50%"
                y="50%"
                fill="${n.color}"
                font-family="sans-serif"
                font-size="13"
                font-weight="800"
                text-anchor="middle"
                dominant-baseline="middle">

                ${name}

            </text>

        </svg>

        `);
}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function showToast(msg){

    const t=
        document.getElementById('toast');

    t.textContent=msg;

    t.classList.add('show');

    clearTimeout(toastTimer);

    toastTimer=setTimeout(
        ()=>{
            t.classList.remove('show');
        },
        2000
    );
}


/* =========================================================
   FAVORITES
   ========================================================= */

function isFav(i){
    return favorites.includes(i);
}

function toggleFav(i,e){

    if(e)
        e.stopPropagation();

    const pos=
        favorites.indexOf(i);

    if(pos>-1){

        favorites.splice(pos,1);

        showToast('Eliminada de favoritas');

    }else{

        favorites.push(i);

        showToast('Añadida a favoritas');

    }

    localStorage.setItem(
        'crg_favs',
        JSON.stringify(favorites)
    );

    render();
}


/* =========================================================
   FILTER
   ========================================================= */

function getFilteredStations(){

    const q=
        searchInput.value
            .trim()
            .toLowerCase();

    return stations
        .map(
            (s,i)=>({
                ...s,
                _i:i,
                neon:getNeon(i)
            })
        )
        .filter(s=>{

            const matches=
                !q ||
                s.name
                    .toLowerCase()
                    .includes(q) ||
                s.freq
                    .toLowerCase()
                    .includes(q);

            const favOk=
                !showFavoritesOnly ||
                isFav(s._i);

            return matches && favOk;

        });

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

    const list=
        getFilteredStations();

    listMeta.textContent=
        `${list.length} emisora${list.length!==1?'s':''}`+
        `${showFavoritesOnly?' • Favoritas':''}`;


    if(list.length===0){

        container.innerHTML=`
            <div class="empty-state">
                NO HAY EMISORAS DISPONIBLES
            </div>
        `;

        return;
    }


    /* =====================================================
       GRID
       ===================================================== */

    if(viewMode==='grid'){

        container.innerHTML=
            `<div
                class="stations-grid"
                id="gridWrap">
            </div>`;

        const grid=
            document.getElementById('gridWrap');


        list.forEach(s=>{

            const el=
                document.createElement('div');


            el.className=
                'station-card' +
                (s._i===currentIndex?' active':'');


            el.style.setProperty(
                '--neon',
                s.neon.color
            );

            el.style.setProperty(
                '--neon-border',
                s.neon.border
            );

            el.style.setProperty(
                '--neon-soft',
                s.neon.soft
            );


            el.innerHTML=`

                <button
                    class="card-fav-btn ${isFav(s._i)?'is-fav':''}"
                    data-fav="${s._i}">

                    <svg
                        width="13"
                        height="13"
                        viewBox="0 0 24 24"
                        fill="${isFav(s._i)?'currentColor':'none'}"
                        stroke="currentColor"
                        stroke-width="2">

                        <path
                            d="M12 17.3l-6.18 3.25
                            1.18-6.88L2 8.93l6.91-1
                            L12 1.5l3.09 6.43
                            6.91 1-5 4.74
                            1.18 6.88z">
                        </path>

                    </svg>

                </button>


                <div class="card-logo-wrap">

                    <img
                        src="${s.file}"
                        alt="${s.name}"
                        loading="lazy"
                        onerror="
                            this.onerror=null;
                            this.src='${svgFallback(s.name,s.neon)}'
                        ">

                </div>


                <div class="card-name">
                    ${s.name}
                </div>

                <div class="card-freq">
                    ${s.freq}
                </div>

            `;


            el.addEventListener(
                'click',
                ()=>{
                    playStation(s._i);
                }
            );


            el.querySelector('[data-fav]')
                .addEventListener(
                    'click',
                    e=>toggleFav(s._i,e)
                );


            grid.appendChild(el);

        });

    }


    /* =====================================================
       LIST
       ===================================================== */

    else if(viewMode==='list'){

        container.innerHTML=
            `<div
                class="stations-list"
                id="listWrap">
            </div>`;

        const wrap=
            document.getElementById('listWrap');


        list.forEach(s=>{

            const row=
                document.createElement('div');


            row.className=
                'list-row' +
                (s._i===currentIndex?' active':'');


            row.style.setProperty(
                '--neon',
                s.neon.color
            );

            row.style.setProperty(
                '--neon-border',
                s.neon.border
            );


            row.innerHTML=`

                <div class="list-logo">

                    <img
                        src="${s.file}"
                        alt="${s.name}"
                        loading="lazy"
                        onerror="
                            this.onerror=null;
                            this.src='${svgFallback(s.name,s.neon)}'
                        ">

                </div>


                <div class="list-info">

                    <div class="list-name">
                        ${s.name}
                    </div>

                    <div class="list-freq">
                        ${s.freq}
                    </div>

                </div>


                <div class="list-actions">

                    <button
                        class="card-fav-btn ${isFav(s._i)?'is-fav':''}"
                        data-fav="${s._i}"
                        style="position:static">

                        ★

                    </button>


                    <button
                        class="list-play">
                        ▶
                    </button>

                </div>

            `;


            row.addEventListener(
                'click',
                e=>{

                    if(
                        !e.target.closest('[data-fav]')
                    ){

                        playStation(s._i);

                    }

                }
            );


            row.querySelector('.list-play')
                .addEventListener(
                    'click',
                    e=>{

                        e.stopPropagation();

                        playStation(s._i);

                    }
                );


            row.querySelector('[data-fav]')
                .addEventListener(
                    'click',
                    e=>toggleFav(s._i,e)
                );


            wrap.appendChild(row);

        });

    }


    /* =====================================================
       COMPACT
       ===================================================== */

    else{

        container.innerHTML=
            `<div
                class="stations-compact"
                id="compactWrap">
            </div>`;

        const wrap=
            document.getElementById('compactWrap');


        list.forEach(s=>{

            const pill=
                document.createElement('button');


            pill.className=
                'compact-pill' +
                (s._i===currentIndex?' active':'');


            pill.style.setProperty(
                '--neon',
                s.neon.color
            );

            pill.style.setProperty(
                '--neon-border',
                s.neon.border
            );


            pill.innerHTML=`

                <img
                    src="${s.file}"
                    alt=""
                    style="
                        width:21px;
                        height:21px;
                        object-fit:contain;
                    "
                    onerror="
                        this.onerror=null;
                        this.src='${svgFallback(s.name,s.neon)}'
                    ">

                <span>
                    ${s.name}

                    <small
                        style="
                            opacity:.55;
                            margin-left:4px;
                        ">

                        ${s.freq}

                    </small>

                </span>

            `;


            pill.addEventListener(
                'click',
                ()=>playStation(s._i)
            );


            wrap.appendChild(pill);

        });

    }

}


/* =========================================================
   PLAY STATION
   ========================================================= */

function playStation(index,urlTry=0){

    if(
        index<0 ||
        index>=stations.length
    )
        return;


    const st=
        stations[index];

    const url=
        st.urls[urlTry];


    if(!url){

        showToast("Sin conexión");

        playerLiveText.textContent="Error";

        return;

    }


    const neon=
        getNeon(index);


    currentIndex=index;


    playerStationName.textContent=
        `${st.name} — ${st.freq}`;


    playerLogo.src=
        st.file;

    playerLogo.alt=
        st.name;


    playerLogo.onerror=function(){

        this.onerror=null;

        this.src=
            svgFallback(
                st.name,
                neon
            );

    };


    playerBar.style.setProperty(
        '--player-neon',
        neon.color
    );

    playerBar.style.setProperty(
        '--player-neon-soft',
        neon.soft
    );

    playerBar.style.setProperty(
        '--player-neon-border',
        neon.border
    );


    ambientGlow.style.setProperty(
        '--glow',
        neon.bg
    );

    ambientGlow.style.setProperty(
        '--glow2',
        neon.bg2
    );

    ambientGlow.classList.add('on');


    playerLogoWrap.style.borderColor=
        neon.color;


    playerLiveText.textContent=
        "Conectando…";


    render();


    if(hlsInstance){

        try{
            hlsInstance.destroy();
        }catch(e){}

        hlsInstance=null;

    }


    audio.pause();


    const tryNextUrl=()=>{

        if(
            urlTry+1 <
            st.urls.length
        ){

            playStation(
                index,
                urlTry+1
            );

        }else{

            playerLiveText.textContent=
                "Error de señal";

            showToast(
                "Error con "+st.name
            );

        }

    };


    const isMobile=
        /Android|iPhone|iPad|iPod/i
        .test(
            navigator.userAgent
        );


    const isIOS=
        /iPhone|iPad|iPod/i
        .test(
            navigator.userAgent
        );


    if(
        isIOS ||
        audio.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ){

        audio.src=url;

        audio.load();

        audio.play().catch(()=>{});

        return;

    }


    if(
        window.Hls &&
        Hls.isSupported()
    ){

        hlsInstance=
            new Hls({

                enableWorker:true,

                lowLatencyMode:false,

                maxBufferLength:
                    isMobile ? 30 : 15,

                maxMaxBufferLength:60,

                maxBufferSize:
                    30*1000*1000,

                maxBufferHole:
                    isMobile ? 1.5 : .5,

                liveSyncDurationCount:
                    isMobile ? 5 : 3,

                liveMaxLatencyDurationCount:20,

                manifestLoadingTimeOut:20000,

                manifestLoadingMaxRetry:4,

                fragLoadingTimeOut:20000,

                fragLoadingMaxRetry:6,

                fragLoadingRetryDelay:1000,

                xhrSetup:xhr=>{
                    xhr.withCredentials=false;
                }

            });


        hlsInstance.loadSource(url);

        hlsInstance.attachMedia(audio);


        hlsInstance.on(
            Hls.Events.MANIFEST_PARSED,
            ()=>{
                audio.play().catch(()=>{});
            }
        );


        hlsInstance.on(
            Hls.Events.ERROR,
            (event,data)=>{

                if(!data.fatal)
                    return;


                if(
                    data.type===
                    Hls.ErrorTypes.NETWORK_ERROR
                ){

                    hlsInstance.startLoad();

                    return;

                }


                if(
                    data.type===
                    Hls.ErrorTypes.MEDIA_ERROR
                ){

                    hlsInstance.recoverMediaError();

                    return;

                }


                try{
                    hlsInstance.destroy();
                }catch(e){}

                hlsInstance=null;

                tryNextUrl();

            }
        );

        return;

    }


    audio.src=url;

    audio.load();

    audio.play().catch(()=>{});

}


/* =========================================================
   PLAY / PAUSE
   ========================================================= */

function togglePlay(){

    if(currentIndex===-1){

        playStation(0);

        return;

    }


    if(audio.paused){

        audio.play().catch(()=>{});

    }else{

        audio.pause();

    }

}


/* =========================================================
   NEXT
   ========================================================= */

function nextStation(){

    if(currentIndex===-1){

        playStation(0);

        return;

    }

    playStation(
        (currentIndex+1)%
        stations.length
    );

}


/* =========================================================
   PREVIOUS
   ========================================================= */

function prevStation(){

    if(currentIndex===-1){

        playStation(0);

        return;

    }

    playStation(
        (currentIndex-1+
        stations.length)%
        stations.length
    );

}


/* =========================================================
   VOLUME
   ========================================================= */

function setVolume(v){

    v=
        Math.max(
            0,
            Math.min(1,v)
        );


    audio.volume=v;

    volumeRange.value=v;


    localStorage.setItem(
        'crg_vol',
        v
    );


    volumeRange.style.setProperty(
        '--vol-p',
        (v*100)+'%'
    );


    volPct.textContent=
        Math.round(v*100)+'%';


    if(v===0){

        volIconHigh
            .classList
            .add('hidden');

        volIconMuted
            .classList
            .remove('hidden');

        volIconBtn
            .classList
            .add('muted');

    }else{

        volIconHigh
            .classList
            .remove('hidden');

        volIconMuted
            .classList
            .add('hidden');

        volIconBtn
            .classList
            .remove('muted');

    }

}


volIconBtn.addEventListener(
    'click',
    ()=>{

        if(audio.volume>0){

            prevVol=
                audio.volume;

            setVolume(0);

        }else{

            setVolume(
                prevVol || .8
            );

        }

    }
);


/* =========================================================
   AUDIO EVENTS
   ========================================================= */

audio.addEventListener(
    'play',
    ()=>{

        isPlaying=true;

        playerBar
            .classList
            .add('playing');

        playIcon
            .classList
            .add('hidden');

        pauseIcon
            .classList
            .remove('hidden');

        playerLiveText.textContent=
            "EN VIVO";

        render();

    }
);


audio.addEventListener(
    'pause',
    ()=>{

        isPlaying=false;

        playerBar
            .classList
            .remove('playing');

        pauseIcon
            .classList
            .add('hidden');

        playIcon
            .classList
            .remove('hidden');

        playerLiveText.textContent=
            currentIndex>=0
                ? "PAUSADO"
                : "EN ESPERA";

        render();

    }
);


audio.addEventListener(
    'waiting',
    ()=>{
        playerLiveText.textContent=
            "CARGANDO…";
    }
);


audio.addEventListener(
    'playing',
    ()=>{
        playerLiveText.textContent=
            "EN VIVO";
    }
);


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

document
    .getElementById('playPauseBtn')
    .addEventListener(
        'click',
        togglePlay
    );


document
    .getElementById('nextBtn')
    .addEventListener(
        'click',
        nextStation
    );


document
    .getElementById('prevBtn')
    .addEventListener(
        'click',
        prevStation
    );


document
    .getElementById('volumeRange')
    .addEventListener(
        'input',
        e=>setVolume(
            parseFloat(e.target.value)
        )
    );


searchInput.addEventListener(
    'input',
    render
);


/* =========================================================
   VIEW SWITCH
   ========================================================= */

document
    .querySelectorAll('.view-btn')
    .forEach(btn=>{

        btn.addEventListener(
            'click',
            ()=>{

                viewMode=
                    btn.dataset.view;


                localStorage.setItem(
                    'crg_view',
                    viewMode
                );


                document
                    .querySelectorAll(
                        '.view-btn'
                    )
                    .forEach(b=>{

                        b.classList.toggle(
                            'active',
                            b===btn
                        );

                    });


                render();

            }
        );

    });


/* =========================================================
   FAVORITES FILTER
   ========================================================= */

document
    .getElementById('favToggle')
    .addEventListener(
        'click',
        function(){

            showFavoritesOnly=
                !showFavoritesOnly;

            this.classList.toggle(
                'on',
                showFavoritesOnly
            );

            render();

        }
    );


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    'keydown',
    e=>{

        if(
            e.code==='Space' &&
            document.activeElement.tagName!=='INPUT'
        ){

            e.preventDefault();

            togglePlay();

        }

    }
);


/* =========================================================
   INIT
   ========================================================= */

(function init(){

    const v=
        localStorage.getItem(
            'crg_vol'
        );


    if(v!==null){

        setVolume(
            parseFloat(v)
        );

    }else{

        setVolume(1);

    }


    playerLogo.src=
        svgFallback(
            'CRG',
            getNeon(0)
        );


    render();

})();

</script>

</body>
</html>
