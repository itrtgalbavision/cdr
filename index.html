<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Radio sin cortes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module" src="https://cdn.jsdelivr.net/npm/@mux/mux-video/+esm"></script>

<style>
body{
    margin:0;
    background:#0b1118;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
}
button{
    background:#00e5ff;
    border:none;
    padding:20px 40px;
    font-size:18px;
    border-radius:50px;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>Radio PRO (sin cortes)</h2>

<button onclick="play()">PLAY</button>

<br><br>

<mux-video 
    id="player"
    playsinline
    preload="auto"
    style="width:0;height:0;opacity:0;">
</mux-video>

<script>
const URL = "https://d2qsan2ut81n2k.cloudfront.net/live/c2cce928-c69c-45d5-bd0a-5a5eba167a0d/ts:abr.m3u8";

const player = document.getElementById("player");

function play(){
    player.src = URL;
    player.play();
}
</script>

</body>
</html>
