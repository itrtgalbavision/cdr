<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Radio Estable PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="background:#0b1118;color:white;text-align:center;padding-top:100px;">

<h2>Radio Estable</h2>
<button onclick="start()">PLAY</button>

<audio id="audio" controls playsinline></audio>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const URL = "https://d2qsan2ut81n2k.cloudfront.net/live/c2cce928-c69c-45d5-bd0a-5a5eba167a0d/ts:abr.m3u8";

let audio = document.getElementById("audio");
let hls;

function start(){

    // limpiar instancia anterior
    if(hls){
        hls.destroy();
    }

    // 👉 iPhone / Safari (usa nativo SIEMPRE)
    if(audio.canPlayType('application/vnd.apple.mpegurl')){
        audio.src = URL;
        audio.play();
        return;
    }

    // 👉 Android / Chrome
    if(Hls.isSupported()){

        hls = new Hls({

            // 🔥 CONFIG ESTABLE REAL
            startLevel: 0,
            autoStartLoad: true,

            maxBufferLength: 50,
            maxMaxBufferLength: 100,

            liveSyncDurationCount: 6,
            liveMaxLatencyDurationCount: 15,

            enableWorker: true,
            lowLatencyMode: false
        });

        hls.loadSource(URL);
        hls.attachMedia(audio);

        hls.on(Hls.Events.MANIFEST_PARSED, function(){

            // 🔒 bloquear calidad (clave)
            hls.currentLevel = 0;
            hls.autoLevelEnabled = false;

            audio.play();
        });

        // 🔁 fallback si algo falla
        hls.on(Hls.Events.ERROR, function (event, data) {

            if (data.fatal) {

                console.warn("Error HLS, usando nativo");

                hls.destroy();
                audio.src = URL;
                audio.play();
            }
        });

    } else {
        // fallback total
        audio.src = URL;
        audio.play();
    }
}
</script>

</body>
</html>
