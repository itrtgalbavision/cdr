        colors: {

          'hud-glow': '0 0 30px rgba(0, 240, 255, 0.15)'
        }

<style>
  :root {
    --cyan: #00f0ff;
    --magenta: #ff007f;
    --blue: #3b82f6;
    --purple: #8b5cf6;
    --glow-primary: rgba(0, 240, 255, 0.25);
  }

  body {
    background-color: #04070d;
    color: #f1f5f9;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  /* Grid matrix background pattern */
  .cyber-grid {
    background-image: 
      linear-gradient(to right, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Ambient Holographic Glow Canvas background */
  #ambientGlow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background: 
      radial-gradient(circle at 20% 15%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 75%, rgba(255, 0, 127, 0.06) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 60%);
    transition: opacity 1s ease, background 1s ease;
  }

  /* Glassmorphism futuristic frame */
  .glass-panel {
    background: rgba(11, 16, 29, 0.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(0, 240, 255, 0.14);
  }

  .glass-panel-active {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(20px);
    border-color: rgba(0, 240, 255, 0.5);
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.08);
  }

  /* Cyber Scanline Overlay Effect */
  .scanlines {
    position: relative;
    overflow: hidden;
  }
  .scanlines::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
    background-size: 100% 4px;
    z-index: 2;
    pointer-events: none;
    opacity: 0.3;
  }

  /* Custom Audio Visualizer Spectrum Bars Animation */
  .spectrum-bar {
    transition: height 0.15s ease, background-color 0.3s ease;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.6)); }
    50% { opacity: 0.4; filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.2)); }
  }

  .animate-pulse-glow {
    animation: pulseGlow 2s infinite ease-in-out;
  }

  /* Custom Range Slider Styling for Cyberpunk Look */
  input[type=range].cyber-range {
    -webkit-appearance: none;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    height: 6px;
  }
  
  input[type=range].cyber-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #00f0ff;
    box-shadow: 0 0 10px #00f0ff;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  input[type=range].cyber-range::-webkit-slider-thumb:hover {
    transform: scale(1.25);
    box-shadow: 0 0 16px #00f0ff, 0 0 24px #00f0ff;
  }

  /* Pulsing Laser Indicator */
  .laser-dot {
    box-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
  }
</style>
</head>

// === REAL STATIONS DATA PROVIDED BY USER ===
const stations = [

// Color palette for neon accents per station card
const NEON_PALETTE = [
  { color: '#00f0ff', border: 'rgba(0, 240, 255, 0.4)', soft: 'rgba(0, 240, 255, 0.15)' },
  { color: '#ff007f', border: 'rgba(255, 0, 127, 0.4)', soft: 'rgba(255, 0, 127, 0.15)' },
  { color: '#10b981', border: 'rgba(16, 185, 129, 0.4)', soft: 'rgba(16, 185, 129, 0.15)' },
  { color: '#f59e0b', border: 'rgba(245, 158, 11, 0.4)', soft: 'rgba(245, 158, 11, 0.15)' },
  { color: '#8b5cf6', border: 'rgba(139, 92, 246, 0.4)', soft: 'rgba(139, 92, 246, 0.15)' },
  { color: '#3b82f6', border: 'rgba(59, 130, 246, 0.4)', soft: 'rgba(59, 130, 246, 0.15)' }
];

function getNeon(i) {
  return NEON_PALETTE[i % NEON_PALETTE.length];
}

// Application State Variables
let currentIndex = -1;
let isPlaying = false;
let viewMode = localStorage.getItem('crg_view') || 'grid';
let showFavoritesOnly = false;
let favorites = JSON.parse(localStorage.getItem('crg_favs') || '[]');
let hlsInstance = null;
let prevVol = 1;
let spectrumAnimId = null;

// DOM Elements References
const audio = document.getElementById('audioEl');
const playerBar = document.getElementById('playerBar');
const playerStationName = document.getElementById('playerStationName');
const playerLogo = document.getElementById('playerLogo');
const playerLogoWrap = document.getElementById('playerLogoWrap');
const playerLiveText = document.getElementById('playerLiveText');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const container = document.getElementById('stationsContainer');

const listMeta = document.getElementById('listMeta');
const favToggle = document.getElementById('favToggle');

const volIconMuted = document.getElementById('volIconMuted');

const volumeRange = document.getElementById('volumeRange');
const onlineCountEl = document.getElementById('onlineCount');
const visualizerSpectrum = document.getElementById('visualizerSpectrum');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const playPauseBtn = document.getElementById('playPauseBtn');

// Fallback SVG Generator for Station Logos if image files don't load
function svgFallback(name, neon) {
  const n = neon || getNeon(0);
  const initials = name.substring(0, 2).toUpperCase();
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'>
    <rect width='120' height='120' rx='20' fill='#0b101d'/>
    <circle cx='60' cy='60' r='45' fill='none' stroke='${n.color}' stroke-width='2' stroke-dasharray='4 4'/>
    <text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='Space Grotesk, sans-serif' font-weight='800' font-size='32' fill='${n.color}'>${initials}</text>
  </svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

// Build 32 Bars for audio spectrum analyzer HUD
function initSpectrumBars() {
  visualizerSpectrum.innerHTML = '';
  for (let i = 0; i < 32; i++) {
    const bar = document.createElement('div');
    bar.className = 'spectrum-bar w-1 bg-slate-800 rounded-t-sm';
    bar.style.height = '4px';
    visualizerSpectrum.appendChild(bar);
  }
}

// Animate spectrum visualizer when audio plays
function animateSpectrum() {
  if (!isPlaying) {
    const bars = visualizerSpectrum.children;
    for (let i = 0; i < bars.length; i++) {
      bars[i].style.height = '4px';
      bars[i].style.backgroundColor = '#1e293b';
    }
    return;
  }

  const bars = visualizerSpectrum.children;
  for (let i = 0; i < bars.length; i++) {
    const randHeight = Math.floor(Math.random() * 24) + 4;
    bars[i].style.height = randHeight + 'px';
    
    // Dynamic spectrum coloring based on height
    if (randHeight > 20) {
      bars[i].style.backgroundColor = '#ff007f';
    } else if (randHeight > 12) {
      bars[i].style.backgroundColor = '#00f0ff';
    } else {
      bars[i].style.backgroundColor = '#3b82f6';
    }
  }

  spectrumAnimId = setTimeout(() => {
    requestAnimationFrame(animateSpectrum);
  }, 90);
}

// Render Stations Grid / List / Compact View
function renderStations() {
  const searchTerm = searchInput.value.toLowerCase().trim();
  
  let filtered = stations.filter(st => {
    const matchesSearch = st.name.toLowerCase().includes(searchTerm) || st.freq.toLowerCase().includes(searchTerm);
    const matchesFav = showFavoritesOnly ? favorites.includes(st.name) : true;
    return matchesSearch && matchesFav;
  });

  listMeta.innerHTML = `<span>MOSTRANDO <strong class="text-cyan-400 font-mono">${filtered.length}</strong> ESTACIONES</span> <span class="text-slate-500 font-mono">FILTRO: ${showFavoritesOnly ? 'FAVORITAS' : 'TODAS'}</span>`;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="glass-panel p-12 rounded-2xl text-center border border-dashed border-slate-800">
        <p class="text-slate-400 font-hud text-sm">No se encontraron estaciones con los criterios especificados.</p>
      </div>`;
    return;
  }

  if (viewMode === 'grid') {
    container.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4";
    container.innerHTML = filtered.map((st, i) => {
      const origIndex = stations.findIndex(s => s.name === st.name);
      const neon = getNeon(origIndex);
      const isFav = favorites.includes(st.name);
      const isActive = currentIndex === origIndex;

      return `
        <div onclick="playStation(${origIndex})" 
          class="station-card glass-panel rounded-2xl p-3.5 flex flex-col items-center justify-between cursor-pointer transition-all duration-300 relative group hover:-translate-y-1 hover:border-cyan-400/50 ${isActive ? 'glass-panel-active' : ''}">
          
          <!-- Favorite Star Button -->
          <button onclick="event.stopPropagation(); toggleFavorite('${st.name}')" class="absolute top-2.5 right-2.5 w-7 h-7 rounded-lg flex items-center justify-center text-slate-500 hover:text-amber-400 transition-colors z-10">
            <span class="${isFav ? 'text-amber-400 font-bold' : 'opacity-40'}">★</span>
          </button>

          <!-- Logo Container -->
          <div class="w-full h-20 rounded-xl bg-slate-950/60 border border-slate-800 group-hover:border-cyan-500/30 flex items-center justify-center p-2 mb-3 relative overflow-hidden transition-all">
            <img src="${st.file}" onerror="this.onerror=null; this.src=svgFallback('${st.name}', ${JSON.stringify(neon).replace(/"/g, '&quot;')})" alt="${st.name}" class="max-h-full max-w-full object-contain filter drop-shadow-[0_0_8px_rgba(0,0,0,0.5)]">
          </div>

          <!-- Info -->
          <div class="text-center w-full">
            <h4 class="font-hud font-bold text-xs sm:text-sm text-slate-100 group-hover:text-cyan-300 truncate">${st.name}</h4>
            <p class="font-mono text-[11px] text-slate-400 mt-0.5">${st.freq}</p>
          </div>

          <!-- Active Indicator Light -->
          ${isActive ? `<div class="mt-2 w-full h-1 rounded-full bg-cyan-400 shadow-[0_0_10px_#00f0ff]"></div>` : ''}
        </div>
      `;
    }).join('');

  } else if (viewMode === 'list') {
    container.className = "flex flex-col gap-2.5";
    container.innerHTML = filtered.map((st) => {
      const origIndex = stations.findIndex(s => s.name === st.name);
      const neon = getNeon(origIndex);
      const isFav = favorites.includes(st.name);
      const isActive = currentIndex === origIndex;

      return `
        <div onclick="playStation(${origIndex})" 
          class="glass-panel rounded-xl p-3 flex items-center justify-between cursor-pointer hover:border-cyan-500/40 transition-all ${isActive ? 'glass-panel-active' : ''}">
          
          <div class="flex items-center gap-3.5 min-w-0">
            <div class="w-10 h-10 rounded-lg bg-slate-950/80 border border-slate-800 p-1 flex items-center justify-center shrink-0">
              <img src="${st.file}" onerror="this.onerror=null; this.src=svgFallback('${st.name}', ${JSON.stringify(neon).replace(/"/g, '&quot;')})" class="max-h-full max-w-full object-contain">
            </div>
            <div class="truncate">
              <h4 class="font-hud font-bold text-sm text-white truncate">${st.name}</h4>
              <span class="font-mono text-xs text-slate-400">${st.freq}</span>
            </div>
          </div>

          <div class="flex items-center gap-3">
            <button onclick="event.stopPropagation(); toggleFavorite('${st.name}')" class="text-slate-500 hover:text-amber-400 p-1">
              <span class="${isFav ? 'text-amber-400' : 'opacity-30'}">★</span>
            </button>
            <div class="w-8 h-8 rounded-full border border-cyan-500/30 text-cyan-400 flex items-center justify-center text-xs font-bold">
              ${isActive && isPlaying ? '❚❚' : '▶'}
            </div>
          </div>

        </div>
      `;
    }).join('');

  } else if (viewMode === 'compact') {
    container.className = "flex flex-wrap gap-2";
    container.innerHTML = filtered.map((st) => {
      const origIndex = stations.findIndex(s => s.name === st.name);
      const isFav = favorites.includes(st.name);
      const isActive = currentIndex === origIndex;

      return `
        <button onclick="playStation(${origIndex})" 
          class="glass-panel px-3 py-2 rounded-xl border flex items-center gap-2 text-xs font-hud transition-all ${isActive ? 'border-cyan-400 bg-cyan-500/20 text-cyan-200' : 'border-slate-800 text-slate-300 hover:border-cyan-500/40'}">
          <span class="font-bold">${st.name}</span>
          <span class="font-mono text-[10px] text-slate-400">${st.freq}</span>
          ${isFav ? '<span class="text-amber-400 text-[10px]">★</span>' : ''}
        </button>
      `;
    }).join('');
  }
}

// Play Audio Stream Logic using HLS or Native Audio
function playStation(index) {
  if (index < 0 || index >= stations.length) return;

  const st = stations[index];
  currentIndex = index;
  const neon = getNeon(index);

  // Update Player Metadata HUD
  playerStationName.textContent = st.name + " (" + st.freq + ")";
  playerLogo.src = st.file;
  playerLogo.onerror = function() {
    this.src = svgFallback(st.name, neon);
  };

  playerLiveText.textContent = "CONECTANDO...";
  playerLiveText.className = "tracking-wider uppercase text-[10px] text-amber-400";

  // Clean existing HLS instance
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }

  const streamUrl = st.urls[0];

  if (Hls.isSupported() && streamUrl.includes('.m3u8')) {
    hlsInstance = new Hls({
      enableWorker: true,
      lowLatencyMode: true
    });
    hlsInstance.loadSource(streamUrl);
    hlsInstance.attachMedia(audio);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
      audio.play().then(() => setPlayState(true)).catch(err => {
        console.warn("Autoplay block:", err);
        setPlayState(false);
      });
    });
    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        playerLiveText.textContent = "ERROR DE CONEXIÓN";
        playerLiveText.className = "tracking-wider uppercase text-[10px] text-pink-500";
        setPlayState(false);
      }
    });
  } else if (audio.canPlayType('application/vnd.apple.mpegurl') || streamUrl) {
    audio.src = streamUrl;
    audio.play().then(() => setPlayState(true)).catch(() => setPlayState(false));
  }

  renderStations();
  showToast(`Sintonizando: ${st.name} ${st.freq}`);
}

// Update UI Play/Pause States
function setPlayState(playing) {
  isPlaying = playing;

  if (playing) {
    playIcon.classList.add('hidden');
    pauseIcon.classList.remove('hidden');
    playerLiveText.textContent = "EN VIVO";
    playerLiveText.className = "tracking-wider uppercase text-[10px] text-pink-500 font-bold";
    animateSpectrum();
  } else {
    playIcon.classList.remove('hidden');
    pauseIcon.classList.add('hidden');
    playerLiveText.textContent = "EN PAUSA";
    playerLiveText.className = "tracking-wider uppercase text-[10px] text-slate-500";
    if (spectrumAnimId) clearTimeout(spectrumAnimId);
  }
}

// Toggle Play/Pause Button
function togglePlayPause() {
  if (currentIndex === -1) {
    playStation(0);
    return;
  }
  if (isPlaying) {
    audio.pause();
    setPlayState(false);
  } else {
    audio.play().then(() => setPlayState(true)).catch(() => setPlayState(false));
  }
}

// Next / Previous Station Navigation
function nextStation() {
  let next = currentIndex + 1;
  if (next >= stations.length) next = 0;
  playStation(next);
}

function prevStation() {
  let prev = currentIndex - 1;
  if (prev < 0) prev = stations.length - 1;
  playStation(prev);
}

// Favorite Management using LocalStorage
function toggleFavorite(name) {
  if (favorites.includes(name)) {
    favorites = favorites.filter(f => f !== name);
    showToast(`Eliminada de favoritas: ${name}`);
  } else {
    favorites.push(name);
    showToast(`Añadida a favoritas: ${name}`);
  }
  localStorage.setItem('crg_favs', JSON.stringify(favorites));
  renderStations();
}

// Volume Controls
function updateVolume() {
  const val = parseFloat(volumeRange.value);
  audio.volume = val;
  volPct.textContent = Math.round(val * 100) + '%';

  if (val === 0) {
    volIconHigh.classList.add('hidden');
    volIconMuted.classList.remove('hidden');
  } else {
    volIconHigh.classList.remove('hidden');
    volIconMuted.classList.add('hidden');
  }
}

function toggleMute() {
  if (audio.volume > 0) {
    prevVol = audio.volume;
    volumeRange.value = 0;
  } else {
    volumeRange.value = prevVol || 1.0;
  }
  updateVolume();
}

// HUD Notification Toast
function showToast(msg) {
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  toastMsg.textContent = msg;
  toast.classList.remove('opacity-0', 'pointer-events-none');
  toast.classList.add('opacity-100');
  setTimeout(() => {
    toast.classList.add('opacity-0', 'pointer-events-none');
  }, 2500);
}

// Online Listener Telemetry Counter Random Bump Simulation
function simulateTelemetry() {
  setInterval(() => {
    const delta = Math.floor(Math.random() * 7) - 3;
    let count = parseInt(onlineCountEl.textContent.replace(',', '')) + delta;
    if (count < 1000) count = 1250;
    onlineCountEl.textContent = count.toLocaleString();
  }, 4000);
}

// DOM Ready Event Listeners Setup
document.addEventListener('DOMContentLoaded', () => {
  initSpectrumBars();
  renderStations();
  simulateTelemetry();

  // Search Input Listener
  searchInput.addEventListener('input', renderStations);

  // View Switchers
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active', 'text-cyan-300', 'bg-slate-800'));
      btn.classList.add('active', 'text-cyan-300', 'bg-slate-800');
      viewMode = btn.dataset.view;
      localStorage.setItem('crg_view', viewMode);
      renderStations();
    });
  });

  // Favorites Toggle
  favToggle.addEventListener('click', () => {
    showFavoritesOnly = !showFavoritesOnly;
    favToggle.classList.toggle('border-amber-400', showFavoritesOnly);
    favToggle.classList.toggle('text-amber-300', showFavoritesOnly);
    renderStations();
  });

  // Control Buttons
  playPauseBtn.addEventListener('click', togglePlayPause);
  nextBtn.addEventListener('click', nextStation);
  prevBtn.addEventListener('click', prevStation);
  volumeRange.addEventListener('input', updateVolume);
  volIconBtn.addEventListener('click', toggleMute);

  // Audio Events
  audio.addEventListener('play', () => setPlayState(true));
  audio.addEventListener('pause', () => setPlayState(false));
  audio.addEventListener('ended', nextStation);
});
</script>
