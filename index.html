<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Radio Test – Low‑Latency</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
<style>
  body{font-family:'Poppins',sans-serif;background:#111;color:#fafafa;margin:0;padding:2rem;}
  .radio{padding:.8rem 1.2rem;background:#222;border-radius:.5rem;margin-bottom:.8rem;cursor:pointer;}
  .radio.activa{background:#0066ff;}
  .player{position:fixed;bottom:0;left:0;width:100%;background:#222;padding:.8rem;display:flex;align-items:center;gap:1rem;}
</style>
</head>
<body>

<div class="radio" id="radioBtn">▶️ Xtrema 101.3 FM</div>

<div class="player">
  <span id="title">Selecciona una radio</span>
  <button id="playPause">Play / Pause</button>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
</div>

<audio id="audio" playsinline preload="metadata"></audio>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
/* ------------------- Variables globales ------------------- */
const audio   = document.getElementById('audio');
const title   = document.getElementById('title');
const btn     = document.getElementById('radioBtn');
const playBtn = document.getElementById('playPause');
const volCtrl = document.getElementById('vol');

let hls = null;
let currentUrl = null;
let reconectando = false;
const REINTENTOS_MAX = 3;

/* ------------------- Low‑Latency HLS config ------------------- */
const hlsConfig = {
  maxBufferLength:          30,
  maxMaxBufferLength:       60,
  liveSyncDurationCount:    3,
  liveMaxLatencyDurationCount: 6,
  enableWorker:             true,
  lowLatencyMode:           true,
  fragLoadingTimeout:       4000,
  fragLoadingRetryDelay:    500,
  backBufferLength:         30
};

/* ------------------- Inicializar / actualizar HLS ------------------- */
function initOrUpdateHls(url) {
  if (url === currentUrl && hls) return; // ya está cargado

  if (hls) {
    hls.destroy();
    hls = null;
  }
  currentUrl = url;

  if (Hls.isSupported()) {
    hls = new Hls(hlsConfig);
    hls.loadSource(url);
    hls.attachMedia(audio);
    hls.on(Hls.Events.MANIFEST_PARSED, () => audio.play());
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) {
        console.warn('❗ HLS fatal → fallback native', data);
        hls.destroy();
        hls = null;
        audio.src = url;
        audio.play();
      }
    });
  } else {
    audio.src = url;
    audio.play();
  }
}

/* ------------------- Monitor de buffer y reconexión ------------------- */
function monitorAudio() {
  const intervalo = setInterval(() => {
    if (audio.paused) return;
    const buffered = audio.buffered;
    const now = audio.currentTime;
    let hayDatos = false;
    for (let i = 0; i < buffered.length; i++) {
      if (now >= buffered.start(i) && now <= buffered.end(i)) {
        hayDatos = true; break;
      }
    }
    if (!hayDatos && !reconectando) {
      console.warn('⚠️ Buffer vacío → reconexión');
      reconectando = true;
      intentarReconectar();
    }
  }, 1000);
  window.addEventListener('beforeunload', () => clearInterval(intervalo));
}

function intentarReconectar(attempt = 1) {
  if (attempt > REINTENTOS_MAX) {
    console.error('❌ No se pudo reconectar tras varios intentos');
    reconectando = false;
    return;
  }
  if (hls) { hls.destroy(); hls = null; }
  audio.src = '';
  setTimeout(() => {
    initOrUpdateHls(currentUrl);
    reconectando = false;
  }, 1500 * attempt);
}

/* ------------------- UI ------------------- */
btn.addEventListener('click', () => {
  btn.classList.toggle('activa');
  const url  = 'https://d2qsan2ut81n2k.cloudfront.net/live/c2cce928-c69c-45d5-bd0a-5a5eba167a0d/ts:abr.m3u8';
  const name = 'Xtrema 101.3 FM';
  title.textContent = name;
  initOrUpdateHls(url);
});

playBtn.addEventListener('click', () => {
  if (audio.paused) audio.play(); else audio.pause();
});

volCtrl.addEventListener('input', e => {
  const v = e.target.value;
  audio.volume = v;
  localStorage.setItem('radioVol', v);
});

/* Carga el último volumen guardado */
const savedVol = localStorage.getItem('radioVol');
if (savedVol !== null) {
  volCtrl.value = savedVol;
  audio.volume = savedVol;
}

/* Inicia monitor cuando el audio está listo */
audio.addEventListener('canplay', () => monitorAudio());

/* Opcional: manejo de focus (Android) */
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('play',  () => audio.play());
}
</script>
</body>
</html>
