<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Test Radio Móvil</title>

<style>
    body{
        background:#0b1118;
        color:white;
        font-family: Arial;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }

    button{
        padding:15px 30px;
        font-size:18px;
        border:none;
        border-radius:10px;
        background:#00e5ff;
        cursor:pointer;
        font-weight:bold;
    }

    button:hover{
        background:white;
    }
</style>

</head>
<body>

<h2>🎧 Test Radio (Móvil)</h2>

<button onclick="playRadio()">PLAY RADIO</button>

<br><br>

<button onclick="togglePlay()">Play / Pause</button>

<audio id="audio" playsinline preload="auto"></audio>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
let audio = document.getElementById("audio");
let hls = null;

const url = "https://d2qsan2ut81n2k.cloudfront.net/live/c2cce928-c69c-45d5-bd0a-5a5eba167a0d/ts:abr.m3u8";

const esMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

function playRadio() {

    if (hls) {
        hls.destroy();
    }

    if (esMovil && Hls.isSupported()) {

        hls = new Hls({
            maxBufferLength: 10,
            maxMaxBufferLength: 20,
            liveSyncDurationCount: 2,
            liveMaxLatencyDurationCount: 5,
            enableWorker: true,
            lowLatencyMode: true
        });

        hls.loadSource(url);
        hls.attachMedia(audio);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
            audio.play();
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
            console.log("ERROR HLS:", data);

            if (data.fatal) {
                hls.destroy();
                audio.src = url;
                audio.play();
            }
        });

    } else {
        audio.src = url;
        audio.play();
    }
}

function togglePlay() {
    if (audio.paused) {
        audio.play();
    } else {
        audio.pause();
    }
}
</script>

</body>
</html>
