<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Radio PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin:0;
        background:#0b1118;
        color:white;
        font-family:Arial;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        flex-direction:column;
    }

    button {
        background:#00e5ff;
        border:none;
        padding:20px 40px;
        font-size:18px;
        border-radius:50px;
        cursor:pointer;
        font-weight:bold;
    }

    .status {
        margin-top:20px;
        font-size:14px;
        opacity:0.7;
    }
</style>
</head>

<body>

<h2>Radio PRO (Anti Cortes)</h2>

<button onclick="startRadio()">PLAY</button>

<div class="status" id="status">Esperando...</div>

<audio id="audio" playsinline></audio>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const URL = "https://d2qsan2ut81n2k.cloudfront.net/live/c2cce928-c69c-45d5-bd0a-5a5eba167a0d/ts:abr.m3u8";

let audio = document.getElementById("audio");
let status = document.getElementById("status");
let hls = null;
let retryCount = 0;

function log(msg){
    console.log(msg);
    status.innerText = msg;
}

function startRadio(){

    if(hls){
        hls.destroy();
    }

    if(Hls.isSupported()){

        hls = new Hls({

            // 🔥 CONFIG PRO ESTABLE
            autoStartLoad: true,
            startLevel: 0, // calidad fija baja = estabilidad
            capLevelToPlayerSize: false,

            maxBufferLength: 60,
            maxMaxBufferLength: 120,
            liveSyncDurationCount: 6,
            liveMaxLatencyDurationCount: 20,

            enableWorker: true,
            lowLatencyMode: false,
            backBufferLength: 90

        });

        hls.loadSource(URL);
        hls.attachMedia(audio);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {

            // ❌ DESACTIVAR ADAPTATIVO
            hls.autoLevelEnabled = false;
            hls.currentLevel = 0;

            audio.play();
            log("Reproduciendo estable...");
        });

        // 🔁 MANEJO PRO DE ERRORES
        hls.on(Hls.Events.ERROR, function (event, data) {

            if (data.fatal) {

                log("Reconectando...");

                switch(data.type){

                    case Hls.ErrorTypes.NETWORK_ERROR:
                        hls.startLoad();
                        break;

                    case Hls.ErrorTypes.MEDIA_ERROR:
                        hls.recoverMediaError();
                        break;

                    default:
                        retryReconnect();
                        break;
                }
            }
        });

    } else {
        // fallback nativo
        audio.src = URL;
        audio.play();
    }
}

// 🔁 RECONEXIÓN FUERTE
function retryReconnect(){

    if(retryCount > 5){
        log("Error persistente");
        return;
    }

    retryCount++;

    setTimeout(() => {
        log("Reintentando ("+retryCount+")...");
        startRadio();
    }, 3000);
}

</script>

</body>
</html>
